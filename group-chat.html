<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group Chat — NGIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/group-chat.css">
  <style>
    /* Reduce FOUC */
    body { opacity: 0; }
    body.ready { opacity: 1; transition: opacity .12s; }
  </style>
</head>
<body data-page="group-chat">

<!-- layout.js injects sidebar + topbar into .main as first children -->
<main class="main" id="groupChatMain">

  <!-- Demo mode banner (hidden until needed) -->
  <div class="demo-banner" id="demoBanner" hidden>
    <span class="material-symbols-outlined" style="font-size:16px">info</span>
    Demo mode — connect a server for live group messaging. See <code>server/</code> to get started.
  </div>

  <div class="group-shell">

    <!-- ─────────────────────────────────────────────────────
         LEFT: Class list panel
         ───────────────────────────────────────────────────── -->
    <aside class="class-panel" id="classPanel" aria-label="Class list">

      <!-- Panel header -->
      <div class="cp-head">
        <h2>Classes</h2>
      </div>

      <!-- Class list -->
      <div class="class-list" id="classList" role="listbox" aria-label="Your classes">
        <!-- Populated by group-chat.js -->
        <div class="class-empty-state">
          <span class="material-symbols-outlined">school</span>
          <p>Loading your classes…</p>
        </div>
      </div>

    </aside>

    <!-- ─────────────────────────────────────────────────────
         RIGHT: Group chat window
         ───────────────────────────────────────────────────── -->
    <section class="gchat-win" id="gchatWin" aria-label="Group chat window">

      <!-- Empty / select-a-class state -->
      <div class="gchat-empty" id="gchatEmpty">
        <div class="ico-wrap">
          <span class="material-symbols-outlined">groups</span>
        </div>
        <h3>Class Group Chat</h3>
        <p>Select a class from the list to view its group conversation.</p>
      </div>

      <!-- Active chat (hidden until a class is selected) -->
      <div class="gchat-active" id="gchatActive" hidden aria-live="polite">

        <!-- Chat header -->
        <header class="gchat-header">
          <button class="chat-icon-btn back-btn" id="gchatBackBtn" aria-label="Back to class list">
            <span class="material-symbols-outlined">arrow_back</span>
          </button>

          <!-- Class avatar -->
          <div class="class-header-ava" id="gchatHeaderAva">GA</div>

          <div class="gchat-hinfo">
            <span class="gchat-hname" id="gchatHName">Class Name</span>
            <span class="gchat-hmeta" id="gchatHMeta">Group Chat</span>
          </div>

          <div>
            <button class="chat-icon-btn" aria-label="More options" title="More options">
              <span class="material-symbols-outlined">more_vert</span>
            </button>
          </div>
        </header>

        <!-- Messages scroll area -->
        <div class="gmsg-area" id="gmsgArea" role="log" aria-label="Messages" aria-live="polite">
          <!-- Messages injected by group-chat.js -->
        </div>

        <!-- Typing indicator -->
        <div class="typing-row" id="typingRow" aria-live="polite" aria-label="Typing indicator">
          <div class="typing-bubble">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
          </div>
          <span class="typing-name" id="typingName"></span>
        </div>

        <!-- Message input area -->
        <div class="gmsg-input-area">

          <!-- Emoji picker (hidden by default) -->
          <div class="emoji-picker" id="emojiPicker" hidden aria-label="Emoji picker">
            <div class="emoji-grid" id="emojiGrid"></div>
          </div>

          <form class="gmsg-form" id="gmsgForm" aria-label="Send a message">

            <!-- Emoji toggle -->
            <button
              type="button"
              class="chat-icon-btn"
              id="gemojiBtn"
              aria-label="Open emoji picker"
              aria-expanded="false"
              aria-controls="emojiPicker"
            >
              <span class="material-symbols-outlined">sentiment_satisfied</span>
            </button>

            <!-- Text input -->
            <div class="gmsg-input-wrap">
              <textarea
                id="gmsgInput"
                placeholder="Type a message to your class…"
                rows="1"
                maxlength="2000"
                aria-label="Message text"
                autocomplete="off"
                spellcheck="true"
              ></textarea>
            </div>

            <!-- Send button -->
            <button
              type="submit"
              class="chat-icon-btn send-btn"
              id="gsendBtn"
              aria-label="Send message"
              disabled
            >
              <span class="material-symbols-outlined">send</span>
            </button>

          </form>
        </div>

      </div><!-- /gchat-active -->

    </section><!-- /gchat-win -->

  </div><!-- /group-shell -->

</main><!-- /main -->

<!-- ─────────────────────────────────────────────────────────────
     Scripts
     ───────────────────────────────────────────────────────────── -->
<script>
(function () {
  /* Theme init (must run before layout.js) */
  var t = localStorage.getItem("ngis-theme") || "light";
  document.documentElement.setAttribute("data-theme", t);

  /* Resolve logged-in user's role for sidebar nav */
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem("ngis_chat_user") || "null"); } catch (e) {}
  var role = saved?.role || window.CURRENT_USER?.role || "student";

  /* Layout engine config */
  window.PAGE = { role: role, active: "group-chat" };

  /* Group Chat server URL */
  window.GROUP_CHAT_SERVER = "http://localhost:3001";

  /* Pass resolved user to group-chat.js */
  if (saved) window.CURRENT_USER = saved;

  document.body.classList.add("ready");
})();
</script>

<!-- Layout engine (sidebar + topbar + mobile nav) -->
<script src="assets/js/layout.js"></script>

<!-- Socket.io client -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<!-- Group chat logic -->
<script src="assets/js/group-chat.js"></script>

</body>
</html>
