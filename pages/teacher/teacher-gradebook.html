<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>NGIS — Teacher Gradebook</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700;800&family=Kantumruy+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">

<!-- NGIS Stylesheets -->
<link rel="stylesheet" href="../../assets/css/app.css?v=3.1">
<link rel="stylesheet" href="../../assets/css/hero.css">
<link rel="stylesheet" href="../../assets/css/interactions.css">

<!-- Phosphor Icons for Mobile View -->
<script src="https://unpkg.com/@phosphor-icons/web"></script>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
  /* Global typography constraint: No bold font */
  * { font-weight: 400; }
  b, strong, th, h1, h2, h3, h4, h5, h6,
  .font-bold, .font-extrabold, .font-semibold, .font-medium,
  [class*="font-medium"] {
    font-weight: 500 !important;
  }
  
  html, body {
    overflow-x: hidden;
  }
  
  @media (max-width: 1023px) {
    #heroBanner, .hero, .hero-topbar, .hero-main, .hero-subpage {
      display: none !important;
    }
  }
  
  .gradebook-container {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  
  .gradebook-table {
    min-width: 600px;
  }
  
  .grade-cell {
    padding: 0.5rem;
  }
  
  .grade-input {
    width: 60px;
    padding: 0.25rem;
    border: 1px solid #cbd5e1;
    border-radius: 0.375rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.875rem;
    text-align: center;
  }
  
  .grade-input.modified {
    background-color: #fef3c7;
  }
  
  [data-theme="dark"] .grade-input.modified {
    background-color: #7c2d12;
  }
  
  .sticky-col-name {
    position: sticky;
    left: 0;
    z-index: 10;
    background-color: #f8fafc;
  }
  
  [data-theme="dark"] .sticky-col-name {
    background-color: #0f172a;
  }

  @media (max-width: 640px) {
    .gradebook-container {
      margin: 0 -1rem;
      padding: 0 1rem;
    }
  }
</style>

<!-- Theme bootstrap -->
<script>try{var _t=localStorage.getItem('ngis-theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/protect.js"></script>
<script src="_auth-bootstrap.js"></script>
</head>
<body data-role="teacher" data-page="gradebook">
<main class="main">

  <!-- Hero Banner -->
  <div id="heroBanner"></div>

  <!-- Desktop View -->
  <div class="teacher-desktop-view">
    <div class="page" style="padding-top: 2rem;">
      <div class="mb-8">
        <h1 class="text-2xl font-medium text-slate-900 dark:text-white mb-1">Teacher Gradebook</h1>
        <p class="text-sm text-slate-600 dark:text-slate-400">Record, review, and manage student grades.</p>
      </div>

      <!-- Selection Toolbar -->
      <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200/80 dark:border-slate-700 p-4 mb-6 shadow-subtle">
        <div class="grid grid-cols-1 md:grid-cols-5 gap-3 mb-4">
          <!-- Class Selector -->
          <div>
            <label class="text-xs font-medium text-slate-600 dark:text-slate-300 block mb-1.5">Class</label>
            <select id="classSelector" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-brand-600 dark:focus:border-brand-400">
              <option value="">Select a class...</option>
              <option value="10A">Grade 10A — Homeroom & Adv Math</option>
              <option value="11B">Grade 11B — Physics CP</option>
              <option value="11C">Grade 11C — AP Calculus BC</option>
            </select>
          </div>

          <!-- Subject Selector -->
          <div>
            <label class="text-xs font-medium text-slate-600 dark:text-slate-300 block mb-1.5">Subject</label>
            <select id="subjectSelector" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-brand-600 dark:focus:border-brand-400">
              <option value="">All Subjects</option>
              <option value="math">Mathematics</option>
              <option value="physics">Physics</option>
              <option value="chemistry">Chemistry</option>
            </select>
          </div>

          <!-- Academic Year -->
          <div>
            <label class="text-xs font-medium text-slate-600 dark:text-slate-300 block mb-1.5">Academic Year</label>
            <select id="academicYearSelector" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-brand-600 dark:focus:border-brand-400">
              <option value="2025-26">2025–26</option>
              <option value="2024-25">2024–25</option>
            </select>
          </div>

          <!-- Term/Semester -->
          <div>
            <label class="text-xs font-medium text-slate-600 dark:text-slate-300 block mb-1.5">Term</label>
            <select id="termSelector" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-brand-600 dark:focus:border-brand-400">
              <option value="">Semester 1</option>
              <option value="q1">Q1</option>
              <option value="q2">Q2</option>
            </select>
          </div>

          <!-- Search -->
          <div>
            <label class="text-xs font-medium text-slate-600 dark:text-slate-300 block mb-1.5">Search Student</label>
            <input type="text" id="studentSearch" placeholder="Name or ID..." class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm text-slate-900 dark:text-slate-100 placeholder:text-slate-400 focus:outline-none focus:border-brand-600 dark:focus:border-brand-400">
          </div>
        </div>

        <div class="flex items-center justify-between gap-2 text-xs">
          <span class="text-slate-600 dark:text-slate-400" id="selectionInfo">Select a class to view gradebook</span>
          <div class="flex items-center gap-2">
            <span id="unsavedIndicator" class="px-2 py-1 rounded-lg text-xs font-medium bg-amber-100 dark:bg-amber-900/30 text-amber-800 dark:text-amber-300 hidden">
              <span class="material-symbols-outlined text-[14px] inline-block -mt-0.5">edit</span> Unsaved Changes
            </span>
            <button id="saveChangesBtn" class="px-4 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-xs font-medium transition disabled:opacity-50" disabled>
              Save Changes
            </button>
          </div>
        </div>
      </div>

      <!-- Gradebook Table -->
      <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200/80 dark:border-slate-700 shadow-subtle overflow-hidden">
        <div id="gradebookContainer" class="gradebook-container">
          <div class="text-center py-12 text-slate-500 dark:text-slate-400">
            <span class="material-symbols-outlined text-5xl opacity-30 block mb-2">grade</span>
            <span>Select a class to view and edit grades</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile View -->
  <div class="teacher-mobile-view px-4 pt-4 pb-28">
    <header class="flex items-center justify-between gap-3 mb-4">
      <button type="button" class="mobile-hamburger-btn hamburger-btn" aria-label="Open menu" aria-expanded="false" data-action="toggle-sidebar" title="Open navigation">
        <i class="ph-bold ph-list text-xl"></i>
      </button>
      <div class="flex-1 min-w-0">
        <h1 class="text-base font-medium text-slate-900 dark:text-white">Gradebook</h1>
      </div>
      <a href="teacher-classes.html" class="w-9 h-9 rounded-lg bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300">
        <span class="material-symbols-outlined text-lg">close</span>
      </a>
    </header>

    <!-- Mobile Class Selector -->
    <div class="mb-4">
      <select id="classSelectorMobile" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm text-slate-900 dark:text-slate-100">
        <option value="">Select a class...</option>
        <option value="10A">Grade 10A</option>
        <option value="11B">Grade 11B</option>
        <option value="11C">Grade 11C</option>
      </select>
    </div>

    <!-- Mobile Gradebook -->
    <div id="gradebookMobileContainer">
      <div class="text-center py-8 text-slate-500 dark:text-slate-400">
        <span class="material-symbols-outlined text-4xl opacity-30 block mb-2">grade</span>
        <span class="text-sm">Select a class to view grades</span>
      </div>
    </div>
  </div>

</main>

<script src="../../assets/js/hero.js"></script>
<script src="../../assets/js/layout.js"></script>

<script>
// ── TEACHER GRADEBOOK PAGE LOGIC ──
(function() {
  let allGrades = {};
  let selectedClass = null;
  let hasUnsavedChanges = false;

  // Mock grade data
  const mockGrades = {
    '10A': [
      { studentId: '2026-STD-0142', name: 'Nrinphouneta Hok', assignment1: 85, assignment2: 90, quiz: 88, exam: 82 },
      { studentId: '2026-STD-0144', name: 'Sophea Chan', assignment1: 78, assignment2: 82, quiz: 80, exam: 75 },
      { studentId: '2026-STD-0145', name: 'Virak Heng', assignment1: null, assignment2: 88, quiz: 85, exam: null },
      { studentId: '2026-STD-0148', name: 'Kosal Rith Mony', assignment1: 92, assignment2: 94, quiz: 91, exam: 89 },
      { studentId: '2026-STD-0151', name: 'Sreylin Vuth', assignment1: 95, assignment2: 96, quiz: 94, exam: 92 },
    ],
    '11B': [
      { studentId: '2026-STD-0143', name: 'Kosal Rith Mony', assignment1: 88, assignment2: 90, quiz: 87, exam: 85 },
      { studentId: '2026-STD-0146', name: 'Sreymom Vuth', assignment1: 91, assignment2: 93, quiz: 92, exam: 90 },
    ],
    '11C': [
      { studentId: '2026-STD-0147', name: 'Kimheak Chheng', assignment1: 89, assignment2: 91, quiz: 88, exam: 86 },
      { studentId: '2026-STD-0149', name: 'Prak Piseth', assignment1: 72, assignment2: 75, quiz: 71, exam: 70 },
    ]
  };

  function renderGradebook() {
    if (!selectedClass) {
      document.getElementById('gradebookContainer').innerHTML = `
        <div class="text-center py-12 text-slate-500 dark:text-slate-400">
          <span class="material-symbols-outlined text-5xl opacity-30 block mb-2">grade</span>
          <span>Select a class to view and edit grades</span>
        </div>
      `;
      return;
    }

    const students = mockGrades[selectedClass] || [];
    const assessments = ['Assignment 1', 'Assignment 2', 'Quiz', 'Exam'];

    let html = `
      <table class="w-full gradebook-table text-sm border-collapse">
        <thead>
          <tr class="bg-slate-50 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700">
            <th class="sticky-col-name px-4 py-3 text-left text-xs font-medium text-slate-600 dark:text-slate-300">Student</th>
    `;

    assessments.forEach((assessment, idx) => {
      html += `<th class="px-4 py-3 text-center text-xs font-medium text-slate-600 dark:text-slate-300 whitespace-nowrap">${assessment}<br><span style="font-weight: 400; font-size: 10px; color: #64748b;">/ 100</span></th>`;
    });

    html += `
            <th class="px-4 py-3 text-center text-xs font-medium text-slate-600 dark:text-slate-300">Total</th>
            <th class="px-4 py-3 text-center text-xs font-medium text-slate-600 dark:text-slate-300">Average</th>
            <th class="px-4 py-3 text-center text-xs font-medium text-slate-600 dark:text-slate-300">Grade</th>
          </tr>
        </thead>
        <tbody>
    `;

    students.forEach((student, idx) => {
      const grades = [student.assignment1, student.assignment2, student.quiz, student.exam];
      const validGrades = grades.filter(g => g !== null && g !== undefined);
      const total = validGrades.reduce((a, b) => a + b, 0);
      const average = validGrades.length > 0 ? Math.round(total / validGrades.length) : null;
      const letterGrade = average !== null ? (average >= 90 ? 'A' : average >= 80 ? 'B' : average >= 70 ? 'C' : average >= 60 ? 'D' : 'F') : '—';

      html += `
        <tr class="border-b border-slate-100 dark:border-slate-700/50 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition">
          <td class="sticky-col-name px-4 py-3 text-slate-900 dark:text-slate-100 text-sm">${student.name}</td>
      `;

      grades.forEach((grade, gradeIdx) => {
        const inputId = `grade-${idx}-${gradeIdx}`;
        html += `
          <td class="grade-cell text-center border-r border-slate-200 dark:border-slate-700">
            <input type="number" id="${inputId}" min="0" max="100" 
              value="${grade !== null ? grade : ''}" 
              placeholder="—"
              class="grade-input"
              data-student-id="${student.studentId}"
              data-assessment="${gradeIdx}"
              onchange="handleGradeChange(this)">
          </td>
        `;
      });

      html += `
          <td class="grade-cell text-center border-r border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100 font-medium">${average !== null ? average : '—'}</td>
          <td class="grade-cell text-center border-r border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100 font-medium">${average !== null ? average : '—'}</td>
          <td class="grade-cell text-center text-slate-900 dark:text-slate-100 font-medium">${letterGrade}</td>
        </tr>
      `;
    });

    html += `
        </tbody>
      </table>
    `;

    document.getElementById('gradebookContainer').innerHTML = html;
  }

  function renderMobileGradebook() {
    if (!selectedClass) {
      document.getElementById('gradebookMobileContainer').innerHTML = `
        <div class="text-center py-8 text-slate-500 dark:text-slate-400">
          <span class="material-symbols-outlined text-4xl opacity-30 block mb-2">grade</span>
          <span class="text-sm">Select a class to view grades</span>
        </div>
      `;
      return;
    }

    const students = mockGrades[selectedClass] || [];
    let html = `<div class="space-y-3">`;

    students.forEach(student => {
      const grades = [student.assignment1, student.assignment2, student.quiz, student.exam];
      const validGrades = grades.filter(g => g !== null && g !== undefined);
      const average = validGrades.length > 0 ? Math.round(validGrades.reduce((a, b) => a + b, 0) / validGrades.length) : null;

      html += `
        <div class="bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-700 rounded-lg p-3">
          <div class="font-medium text-slate-900 dark:text-white mb-2">${student.name}</div>
          <div class="grid grid-cols-2 gap-2 text-xs mb-2">
            <div class="flex items-center justify-between">
              <span class="text-slate-600 dark:text-slate-400">Assign 1:</span>
              <input type="number" min="0" max="100" value="${student.assignment1 || ''}" placeholder="—" class="grade-input w-12">
            </div>
            <div class="flex items-center justify-between">
              <span class="text-slate-600 dark:text-slate-400">Assign 2:</span>
              <input type="number" min="0" max="100" value="${student.assignment2 || ''}" placeholder="—" class="grade-input w-12">
            </div>
            <div class="flex items-center justify-between">
              <span class="text-slate-600 dark:text-slate-400">Quiz:</span>
              <input type="number" min="0" max="100" value="${student.quiz || ''}" placeholder="—" class="grade-input w-12">
            </div>
            <div class="flex items-center justify-between">
              <span class="text-slate-600 dark:text-slate-400">Exam:</span>
              <input type="number" min="0" max="100" value="${student.exam || ''}" placeholder="—" class="grade-input w-12">
            </div>
          </div>
          <div class="pt-2 border-t border-slate-200 dark:border-slate-700 text-xs flex items-center justify-between">
            <span class="text-slate-600 dark:text-slate-400">Average:</span>
            <span class="font-medium text-slate-900 dark:text-white">${average || '—'}</span>
          </div>
        </div>
      `;
    });

    html += `</div>`;
    document.getElementById('gradebookMobileContainer').innerHTML = html;
  }

  window.handleGradeChange = function(input) {
    hasUnsavedChanges = true;
    document.getElementById('unsavedIndicator').classList.remove('hidden');
    document.getElementById('saveChangesBtn').disabled = false;
    input.classList.add('modified');
  };

  // Event listeners
  document.getElementById('classSelector').addEventListener('change', (e) => {
    selectedClass = e.target.value;
    document.getElementById('classSelectorMobile').value = selectedClass;
    if (selectedClass) {
      document.getElementById('selectionInfo').textContent = `Grade ${selectedClass} Gradebook`;
      renderGradebook();
      renderMobileGradebook();
    } else {
      renderGradebook();
      renderMobileGradebook();
    }
  });

  document.getElementById('classSelectorMobile').addEventListener('change', (e) => {
    document.getElementById('classSelector').value = e.target.value;
    document.getElementById('classSelector').dispatchEvent(new Event('change'));
  });

  document.getElementById('saveChangesBtn').addEventListener('click', () => {
    alert('Grades saved! (Mock save)');
    hasUnsavedChanges = false;
    document.getElementById('unsavedIndicator').classList.add('hidden');
    document.getElementById('saveChangesBtn').disabled = true;
    const inputs = document.querySelectorAll('.grade-input.modified');
    inputs.forEach(input => input.classList.remove('modified'));
  });

  // Initialize
  document.addEventListener('DOMContentLoaded', () => {
    allGrades = mockGrades;
  });
})();
</script>

</body>
</html>
