<head>

<style>
  /* Global typography constraint: No bold font */
  * { font-weight: 400; }
  b, strong, th, h1, h2, h3, h4, h5, h6,
  .font-bold, .font-extrabold, .font-semibold, .font-medium,

    overflow-x: auto;
    -webkit-overflow-scrolling: touch;

<!-- Theme bootstrap -->
<script>try{var _t=localStorage.getItem('ngis-theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>

</head>
<body data-role="teacher" data-page="roster">
<main class="main">

  <!-- Hero Banner -->
  <div id="heroBanner"></div>

  <!-- Desktop View -->
  <div class="teacher-desktop-view">
    <div class="page" style="padding-top: 2rem;">
      <div class="mb-8">
        <h1 class="text-2xl font-medium text-slate-900 dark:text-white mb-1">Roster & Profiles</h1>
        <p class="text-sm text-slate-600 dark:text-slate-400">Manage students in your assigned classes.</p>
      </div>

      <!-- Filter Toolbar -->
      <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200/80 dark:border-slate-700 p-4 mb-6 shadow-subtle">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-4">
          <!-- Search by Name/ID -->
          <div>
            <label class="text-xs font-medium text-slate-600 dark:text-slate-300 block mb-1.5">Search</label>
            <input type="text" id="searchInput" placeholder="Name or ID..." class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm text-slate-900 dark:text-slate-100 placeholder:text-slate-400 focus:outline-none focus:border-brand-600 dark:focus:border-brand-400">
          </div>

          <!-- Class Filter -->
          <div>
            <label class="text-xs font-medium text-slate-600 dark:text-slate-300 block mb-1.5">Class</label>
            <select id="classFilter" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-brand-600 dark:focus:border-brand-400">
              <option value="">All Classes</option>
              <option value="10A">Grade 10A</option>
              <option value="11B">Grade 11B</option>
              <option value="11C">Grade 11C</option>
            </select>
          </div>

          <!-- Status Filter -->
          <div>
            <label class="text-xs font-medium text-slate-600 dark:text-slate-300 block mb-1.5">Status</label>
            <select id="statusFilter" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-brand-600 dark:focus:border-brand-400">
              <option value="">All Students</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>

          <!-- Sort -->
          <div>
            <label class="text-xs font-medium text-slate-600 dark:text-slate-300 block mb-1.5">Sort by</label>
            <select id="sortBy" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm text-slate-900 dark:text-slate-100 focus:outline-none focus:border-brand-600 dark:focus:border-brand-400">
              <option value="name">Name (A-Z)</option>
              <option value="id">Student ID</option>
              <option value="gpa">GPA (High to Low)</option>
            </select>
          </div>
        </div>

        <div class="flex items-center justify-between gap-2 text-xs">
          <span class="text-slate-600 dark:text-slate-400"><span id="resultCount">0</span> students</span>
          <button id="clearFiltersBtn" class="px-3 py-1.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
            Clear Filters
          </button>
        </div>
      </div>

      <!-- Students Table -->
      <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200/80 dark:border-slate-700 shadow-subtle overflow-hidden">
        <div class="table-container">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
                <th class="px-4 py-3 text-left text-xs font-medium text-slate-600 dark:text-slate-300">Student ID</th>
                <th class="px-4 py-3 text-left text-xs font-medium text-slate-600 dark:text-slate-300">Name</th>
                <th class="px-4 py-3 text-left text-xs font-medium text-slate-600 dark:text-slate-300">Class</th>
                <th class="px-4 py-3 text-left text-xs font-medium text-slate-600 dark:text-slate-300">Email</th>
                <th class="px-4 py-3 text-center text-xs font-medium text-slate-600 dark:text-slate-300">Attendance</th>
                <th class="px-4 py-3 text-center text-xs font-medium text-slate-600 dark:text-slate-300">GPA</th>
                <th class="px-4 py-3 text-center text-xs font-medium text-slate-600 dark:text-slate-300">Status</th>
                <th class="px-4 py-3 text-center text-xs font-medium text-slate-600 dark:text-slate-300">Action</th>
              </tr>
            </thead>
            <tbody id="rosterTable">
              <!-- Populated by JS -->
              <tr class="border-b border-slate-100 dark:border-slate-700/50 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition">
                <td colspan="8" class="px-4 py-8 text-center text-slate-500 dark:text-slate-400">
                  <div class="flex flex-col items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-4xl opacity-30">people</span>
                    <span>No students found</span>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Pagination -->
      <div class="mt-4 flex items-center justify-between text-sm">
        <div class="text-slate-600 dark:text-slate-400">
          Showing <span id="pagingInfo">0 of 0</span>
        </div>
        <div class="flex items-center gap-2">
          <button id="prevPageBtn" class="px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 text-sm transition disabled:opacity-50" disabled>
            Previous
          </button>
          <div id="pageNumbers" class="flex items-center gap-1"></div>
          <button id="nextPageBtn" class="px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 text-sm transition disabled:opacity-50" disabled>
            Next
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile View -->
  <div class="teacher-mobile-view px-4 pt-4 pb-28">
    <header class="flex items-center justify-between gap-3 mb-4">
      <button type="button" class="mobile-hamburger-btn hamburger-btn" aria-label="Open menu" aria-expanded="false" data-action="toggle-sidebar" title="Open navigation">
        <i class="ph-bold ph-list text-xl"></i>
      </button>
      <div class="flex-1 min-w-0">
        <h1 class="text-base font-medium text-slate-900 dark:text-white">Roster & Profiles</h1>
      </div>
      <a href="teacher-classes.html" class="w-9 h-9 rounded-lg bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300">
        <span class="material-symbols-outlined text-lg">close</span>
      </a>
    </header>

    <!-- Mobile Search -->
    <div class="relative w-full mb-4">
      <i class="ph-bold ph-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
      <input type="search" id="searchInputMobile" placeholder="Search name or ID..." class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl pl-10 pr-4 py-2.5 text-xs text-slate-700 dark:text-slate-200 placeholder:text-slate-400 focus:outline-none focus:border-brand-600 dark:focus:border-brand-400">
    </div>

    <!-- Mobile Filters -->
    <div class="grid grid-cols-2 gap-2 mb-4">
      <select id="classFilterMobile" class="px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs text-slate-900 dark:text-slate-100">
        <option value="">All Classes</option>
        <option value="10A">Grade 10A</option>
        <option value="11B">Grade 11B</option>
        <option value="11C">Grade 11C</option>
      </select>
      <select id="statusFilterMobile" class="px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs text-slate-900 dark:text-slate-100">
        <option value="">All Students</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
    </div>

    <!-- Mobile Students List -->
    <div id="rosterMobileList" class="space-y-2">
      <!-- Populated by JS -->
    </div>
  </div>

</main>

<script src="../../assets/js/hero.js"></script>
<script src="../../assets/js/layout.js"></script>

<script>
// ── ROSTER & PROFILES PAGE LOGIC ──
(function() {
  const ITEMS_PER_PAGE = 10;
  let allStudents = [];
  let filteredStudents = [];
  let currentPage = 1;

  // Fetch real student data from API
  async function loadStudents() {
    try {
      const token = window.getToken ? window.getToken() : localStorage.getItem('ngis_token');
      const response = await fetch('/api/students', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (response.ok) {
        const result = await response.json();
        return result.data || [];
      }
    } catch (err) {
      console.error('Failed to load students:', err);
    }
    // Fallback to mock data
    return [
      { id: '2026-STD-0142', first_name: 'Nrinphouneta', last_name: 'Hok', grade: '10A', email: 'nrinphouneta@ngis.edu.kh', attendance_rate: 96, gpa: 3.87, status: 'active' },
      { id: '2026-STD-0144', first_name: 'Sophea', last_name: 'Chan', grade: '10A', email: 'sophea@ngis.edu.kh', attendance_rate: 91, gpa: 3.55, status: 'active' },
      { id: '2026-STD-0145', first_name: 'Virak', last_name: 'Heng', grade: '10A', email: 'virak@ngis.edu.kh', attendance_rate: 95, gpa: 3.65, status: 'active' },
      { id: '2026-STD-0148', first_name: 'Kosal', last_name: 'Rith Mony', grade: '10A', email: 'kosal@ngis.edu.kh', attendance_rate: 94, gpa: 3.72, status: 'active' },
      { id: '2026-STD-0151', first_name: 'Sreylin', last_name: 'Vuth', grade: '10A', email: 'sreylin@ngis.edu.kh', attendance_rate: 99, gpa: 3.92, status: 'active' },
    ];
  }

  function applyFilters() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const classFilter = document.getElementById('classFilter').value;
    const statusFilter = document.getElementById('statusFilter').value;
    const sortBy = document.getElementById('sortBy').value;

    filteredStudents = allStudents.filter(student => {
      const matchesSearch = !search || 
        student.name.toLowerCase().includes(search) || 
        student.id.toLowerCase().includes(search);
      const matchesClass = !classFilter || student.class === classFilter;
      const matchesStatus = !statusFilter || student.status === statusFilter;
      return matchesSearch && matchesClass && matchesStatus;
    });

    // Apply sorting
    switch(sortBy) {
      case 'id':
        filteredStudents.sort((a, b) => a.id.localeCompare(b.id));
        break;
      case 'gpa':
        filteredStudents.sort((a, b) => b.gpa - a.gpa);
        break;
      case 'name':
      default:
        filteredStudents.sort((a, b) => a.name.localeCompare(b.name));
    }

    currentPage = 1;
    document.getElementById('resultCount').textContent = filteredStudents.length;
    renderTable();
    renderMobileList();
    updatePagination();
  }

  function renderTable() {
    const tbody = document.getElementById('rosterTable');
    const start = (currentPage - 1) * ITEMS_PER_PAGE;
    const end = start + ITEMS_PER_PAGE;
    const pageStudents = filteredStudents.slice(start, end);

    if (pageStudents.length === 0) {
      tbody.innerHTML = `
        <tr class="border-b border-slate-100 dark:border-slate-700/50">
          <td colspan="8" class="px-4 py-8 text-center text-slate-500 dark:text-slate-400">
            <div class="flex flex-col items-center justify-center gap-2">
              <span class="material-symbols-outlined text-4xl opacity-30">people</span>
              <span>No students found</span>
            </div>
          </td>
        </tr>
      `;
      return;
    }

    tbody.innerHTML = pageStudents.map(student => `
      <tr class="border-b border-slate-100 dark:border-slate-700/50 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition">
        <td class="px-4 py-3 text-slate-900 dark:text-slate-100 text-xs font-mono">${student.id}</td>
        <td class="px-4 py-3 text-slate-900 dark:text-slate-100 text-sm">${student.name}</td>
        <td class="px-4 py-3 text-slate-600 dark:text-slate-400 text-sm">Grade ${student.class}</td>
        <td class="px-4 py-3 text-slate-600 dark:text-slate-400 text-xs hidden sm:table-cell">${student.email}</td>
        <td class="px-4 py-3 text-center">
          <span class="inline-block px-2 py-1 rounded-full text-xs font-medium" style="background-color: ${student.attendance >= 95 ? '#dcfce7' : '#fef3c7'}; color: ${student.attendance >= 95 ? '#15803d' : '#92400e'};">
            ${student.attendance}%
          </span>
        </td>
        <td class="px-4 py-3 text-center text-slate-900 dark:text-slate-100 font-medium">${student.gpa.toFixed(2)}</td>
        <td class="px-4 py-3 text-center">
          <span class="inline-block px-2 py-1 rounded-full text-xs font-medium bg-emerald-100 dark:bg-emerald-900/30 text-emerald-800 dark:text-emerald-300">
            ${student.status === 'active' ? 'Active' : 'Inactive'}
          </span>
        </td>
        <td class="px-4 py-3 text-center">
          <button class="text-brand-600 dark:text-brand-400 hover:text-brand-700 dark:hover:text-brand-300 text-sm font-medium transition">
            View
          </button>
        </td>
      </tr>
    `).join('');
  }

  function renderMobileList() {
    const list = document.getElementById('rosterMobileList');
    const start = (currentPage - 1) * ITEMS_PER_PAGE;
    const end = start + ITEMS_PER_PAGE;
    const pageStudents = filteredStudents.slice(start, end);

    if (pageStudents.length === 0) {
      list.innerHTML = `
        <div class="text-center py-8 text-slate-500 dark:text-slate-400">
          <span class="material-symbols-outlined text-4xl opacity-30 block mb-2">people</span>
          <span>No students found</span>
        </div>
      `;
      return;
    }

    list.innerHTML = pageStudents.map(student => `
      <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg p-3">
        <div class="flex items-start justify-between gap-2 mb-2">
          <div class="min-w-0 flex-1">
            <div class="font-medium text-slate-900 dark:text-white text-sm truncate">${student.name}</div>
            <div class="text-xs text-slate-500 dark:text-slate-400 font-mono">${student.id}</div>
          </div>
          <span class="inline-block px-2 py-1 rounded-full text-xs font-medium bg-emerald-100 dark:bg-emerald-900/30 text-emerald-800 dark:text-emerald-300 shrink-0">Active</span>
        </div>
        <div class="grid grid-cols-3 gap-2 text-xs mb-3">
          <div class="text-center">
            <div class="text-slate-500 dark:text-slate-400">Class</div>
            <div class="font-medium text-slate-900 dark:text-white">Grade ${student.class}</div>
          </div>
          <div class="text-center">
            <div class="text-slate-500 dark:text-slate-400">Attendance</div>
            <div class="font-medium text-slate-900 dark:text-white">${student.attendance}%</div>
          </div>
          <div class="text-center">
            <div class="text-slate-500 dark:text-slate-400">GPA</div>
            <div class="font-medium text-slate-900 dark:text-white">${student.gpa.toFixed(2)}</div>
          </div>
        </div>
        <button class="w-full px-3 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-xs font-medium transition active:scale-95">
          View Profile
        </button>
      </div>
    `).join('');
  }

  function updatePagination() {
    const totalPages = Math.ceil(filteredStudents.length / ITEMS_PER_PAGE);
    document.getElementById('pagingInfo').textContent = `${filteredStudents.length === 0 ? 0 : (currentPage - 1) * ITEMS_PER_PAGE + 1} - ${Math.min(currentPage * ITEMS_PER_PAGE, filteredStudents.length)} of ${filteredStudents.length}`;
    
    document.getElementById('prevPageBtn').disabled = currentPage === 1;
    document.getElementById('nextPageBtn').disabled = currentPage === totalPages || totalPages === 0;

    const pageNumbersContainer = document.getElementById('pageNumbers');
    pageNumbersContainer.innerHTML = '';
    for (let i = 1; i <= totalPages; i++) {
      if (i === currentPage) {
        pageNumbersContainer.innerHTML += `<span class="px-2 py-1 rounded bg-brand-600 text-white text-xs font-medium">${i}</span>`;
      } else if (i <= 3 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
        const btn = document.createElement('button');
        btn.textContent = i;
        btn.className = 'px-2 py-1 rounded border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 text-xs hover:bg-slate-50 dark:hover:bg-slate-700 transition';
        btn.onclick = () => { currentPage = i; renderTable(); renderMobileList(); updatePagination(); };
        pageNumbersContainer.appendChild(btn);
      } else if (i === 4) {
        pageNumbersContainer.innerHTML += `<span class="px-1 text-slate-400">...</span>`;
      }
    }
  }

  // Event listeners
  document.getElementById('searchInput').addEventListener('input', applyFilters);
  document.getElementById('searchInputMobile').addEventListener('input', (e) => {
    document.getElementById('searchInput').value = e.target.value;
    applyFilters();
  });
  document.getElementById('classFilter').addEventListener('change', (e) => {
    document.getElementById('classFilterMobile').value = e.target.value;
    applyFilters();
  });
  document.getElementById('classFilterMobile').addEventListener('change', (e) => {
    document.getElementById('classFilter').value = e.target.value;
    applyFilters();
  });
  document.getElementById('statusFilter').addEventListener('change', (e) => {
    document.getElementById('statusFilterMobile').value = e.target.value;
    applyFilters();
  });
  document.getElementById('statusFilterMobile').addEventListener('change', (e) => {
    document.getElementById('statusFilter').value = e.target.value;
    applyFilters();
  });
  document.getElementById('sortBy').addEventListener('change', applyFilters);
  document.getElementById('clearFiltersBtn').addEventListener('click', () => {
    document.getElementById('searchInput').value = '';
    document.getElementById('classFilter').value = '';
    document.getElementById('statusFilter').value = '';
    document.getElementById('sortBy').value = 'name';
    document.getElementById('searchInputMobile').value = '';
    document.getElementById('classFilterMobile').value = '';
    document.getElementById('statusFilterMobile').value = '';
    applyFilters();
  });
  document.getElementById('prevPageBtn').addEventListener('click', () => {
    if (currentPage > 1) { currentPage--; renderTable(); renderMobileList(); updatePagination(); }
  });
  document.getElementById('nextPageBtn').addEventListener('click', () => {
    const totalPages = Math.ceil(filteredStudents.length / ITEMS_PER_PAGE);
    if (currentPage < totalPages) { currentPage++; renderTable(); renderMobileList(); updatePagination(); }
  });

  // Initialize
  document.addEventListener('DOMContentLoaded', async () => {
    const students = await loadStudents();
    allStudents = students.map(s => ({
      id: s.id,
      name: `${s.first_name} ${s.last_name}`,
      class: s.grade || s.class || '10A',
      email: s.email || '',
      attendance: s.attendance_rate || 95,
      gpa: s.gpa || 3.5,
      status: s.status || 'active'
    }));
    applyFilters();
  });
})();
</script>

</body>
</html>
