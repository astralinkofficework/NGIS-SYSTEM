<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NGIS — Grades</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/hero.css">
<script>try{var _t=localStorage.getItem('ngis-theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>















<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/protect.js"></script>
<script src="_auth-bootstrap.js"></script>
</head>
<body>
<main class="main">
<div id="heroBanner"></div>
<div class="page">

  <div class="card anim-up" style="margin-bottom:16px">
    <div class="card-head"><h3>Enter Grade</h3><div class="sub">Posts to shared database + notifies student</div></div>
    <div class="card-pad">
      <form id="gradeForm" style="display:grid;gap:12px;grid-template-columns:1fr 1fr 1fr">
        <label style="font-size:13px;font-weight:600">Student ID
          <input class="input" name="studentId" value="student-001" required style="width:100%;margin-top:4px">
        </label>
        <label style="font-size:13px;font-weight:600">Subject
          <select class="select" name="subjectId" style="width:100%;margin-top:4px">
            <option value="subj-math">Mathematics</option>
            <option value="subj-phys">Physics</option>
            <option value="subj-chem">Chemistry</option>
            <option value="subj-eng">English</option>
            <option value="subj-hist">History</option>
          </select>
        </label>
        <label style="font-size:13px;font-weight:600">Class
          <select class="select" name="classId" style="width:100%;margin-top:4px">
            <option value="cls-10a">10A</option>
            <option value="cls-11b">11B</option>
          </select>
        </label>
        <label style="font-size:13px;font-weight:600">Assessment title
          <input class="input" name="assessmentTitle" placeholder="Quiz 4" required style="width:100%;margin-top:4px">
        </label>
        <label style="font-size:13px;font-weight:600">Type
          <select class="select" name="assessmentType" style="width:100%;margin-top:4px">
            <option value="quiz">Quiz</option>
            <option value="exam">Exam</option>
            <option value="homework">Homework</option>
            <option value="lab">Lab</option>
          </select>
        </label>
        <label style="font-size:13px;font-weight:600">Score / Max
          <div class="flex gap8" style="margin-top:4px">
            <input class="input" type="number" name="score" required min="0" style="flex:1">
            <input class="input" type="number" name="maxScore" value="100" min="1" style="width:90px">
          </div>
        </label>
        <div style="grid-column:1/-1;display:flex;gap:8px;align-items:center">
          <button type="submit" class="btn btn-primary">Save grade</button>
          <span id="formMsg" class="muted" style="font-size:13px"></span>
        </div>
      </form>
    </div>
  </div>

  <div class="card anim-up-2">
    <div class="card-head"><div><h3>Recent Grades You Recorded</h3></div></div>
    <div class="card-pad" id="list"><p class="muted">Loading…</p></div>
  </div>

</div>
</main>
<script>window.PAGE={"role":"teacher","active":"grades"};</script>
<script>
window.HERO_CONFIG = {
  role: 'teacher', active: 'grades', name: 'Teacher', id: 'Teacher', grade: 'Teacher',
  avatar: 'https://images.pexels.com/photos/3769021/pexels-photo-3769021.jpeg?auto=compress&cs=tinysrgb&w=160',
  avatarSm: 'https://images.pexels.com/photos/3769021/pexels-photo-3769021.jpeg?auto=compress&cs=tinysrgb&w=80',
  homeLink: '../../index.html', signOutLink: '../../index.html',
  profileLink: 'teacher-profile.html', notifLink: 'teacher-notifications.html', chatLink: '../shared/chat.html',
  notifCount: 0, title: 'Grades', greeting: 'Enter and review grades.',
  breadcrumbs: [{ label: 'Grades' }], ddRows: []
};
</script>
<script src="../../assets/js/hero.js"></script>
<script src="../../assets/js/layout.js"></script>
<script>
(function () {
  function esc(s) { return String(s||'').replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>'); }

  async function load() {
    const el = document.getElementById('list');
    try {
      const res = await NGISAuth.api('/api/grades');
      const rows = res.data || [];
      if (!rows.length) { el.innerHTML = '<p class="muted">No grades recorded yet.</p>'; return; }
      el.innerHTML = `
        <div class="tbl-wrap">
          <table class="tbl">
            <thead><tr><th>Student</th><th>Subject</th><th>Assessment</th><th>Score</th><th>Letter</th><th>Date</th></tr></thead>
            <tbody>
              ${rows.map(g => `<tr>
                <td>${esc(g.student_name || g.student_id)}</td>
                <td>${esc(g.subject_name || g.subject_id)}</td>
                <td>${esc(g.assessment_title)}</td>
                <td class="mono">${g.score}/${g.max_score}</td>
                <td><span class="badge green">${esc(g.letter_grade)}</span></td>
                <td class="faint" style="font-size:12px">${esc((g.recorded_at||'').slice(0,10))}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    } catch (err) {
      el.innerHTML = `<p style="color:#b91c1c">${esc(err.message)}</p>`;
    }
  }

  document.getElementById('gradeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const msg = document.getElementById('formMsg');
    msg.textContent = 'Saving…';
    try {
      await NGISAuth.api('/api/grades', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          studentId: fd.get('studentId'),
          subjectId: fd.get('subjectId'),
          classId: fd.get('classId'),
          assessmentType: fd.get('assessmentType'),
          assessmentTitle: fd.get('assessmentTitle'),
          score: Number(fd.get('score')),
          maxScore: Number(fd.get('maxScore') || 100),
        }),
      });
      msg.textContent = 'Grade saved. Student notified.';
      e.target.reset();
      e.target.studentId.value = 'student-001';
      e.target.maxScore.value = '100';
      load();
    } catch (err) {
      msg.textContent = err.message || 'Failed';
    }
  });

  setTimeout(load, 200);
})();
</script>
</body>
</html>
