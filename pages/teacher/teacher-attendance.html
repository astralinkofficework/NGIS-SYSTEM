<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NGIS — Attendance</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/hero.css">
<script>try{var _t=localStorage.getItem('ngis-theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/protect.js"></script>
<script src="_auth-bootstrap.js"></script>
</head>
<body>
<main class="main">
<div id="heroBanner"></div>
<div class="page">

  <div class="card anim-up">
    <div class="card-head">
      <div><h3>Mark Attendance</h3><div class="sub">Select class and date, then save</div></div>
    </div>
    <div class="card-pad">
      <div class="flex gap8 wrap" style="margin-bottom:16px;align-items:flex-end">
        <label style="font-size:13px;font-weight:600">Class
          <select id="classId" class="select" style="display:block;margin-top:4px;min-width:140px">
            <option value="cls-10a">Grade 10A</option>
            <option value="cls-11b">Grade 11B</option>
          </select>
        </label>
        <label style="font-size:13px;font-weight:600">Date
          <input type="date" id="attDate" class="input" style="display:block;margin-top:4px">
        </label>
        <button class="btn btn-primary btn-sm" id="btnLoad">Load roster</button>
        <button class="btn btn-soft btn-sm" id="btnMarkAllPresent">All present</button>
        <button class="btn btn-primary btn-sm" id="btnSave" disabled>Save attendance</button>
      </div>
      <p id="statusMsg" class="muted" style="font-size:13px"></p>
      <div id="roster"></div>
    </div>
  </div>

</div>
</main>
<script>window.PAGE={"role":"teacher","active":"attendance"};</script>
<script>
window.HERO_CONFIG = {
  role: 'teacher', active: 'attendance', name: 'Teacher', id: 'Teacher', grade: 'Teacher',
  avatar: 'https://images.pexels.com/photos/3769021/pexels-photo-3769021.jpeg?auto=compress&cs=tinysrgb&w=160',
  avatarSm: 'https://images.pexels.com/photos/3769021/pexels-photo-3769021.jpeg?auto=compress&cs=tinysrgb&w=80',
  homeLink: '../../index.html', signOutLink: '../../index.html',
  profileLink: 'teacher-profile.html', notifLink: 'teacher-notifications.html', chatLink: '../shared/chat.html',
  notifCount: 0, title: 'Attendance', greeting: 'Mark class attendance.',
  breadcrumbs: [{ label: 'Attendance' }], ddRows: []
};
</script>
<script src="../../assets/js/hero.js"></script>
<script src="../../assets/js/layout.js"></script>
<script>
(function () {
  const dateEl = document.getElementById('attDate');
  dateEl.value = new Date().toISOString().slice(0, 10);
  let roster = [];

  function esc(s) {
    return String(s || '').replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>');
  }

  async function loadRoster() {
    const classId = document.getElementById('classId').value;
    const date = dateEl.value;
    const msg = document.getElementById('statusMsg');
    const box = document.getElementById('roster');
    msg.textContent = 'Loading…';
    document.getElementById('btnSave').disabled = true;

    try {
      const res = await NGISAuth.api(`/api/attendance?classId=${encodeURIComponent(classId)}&date=${encodeURIComponent(date)}`);
      roster = res.data || [];
      msg.textContent = `${roster.length} student(s) · ${date}`;

      if (!roster.length) {
        box.innerHTML = '<p class="muted">No students in this class.</p>';
        return;
      }

      box.innerHTML = `
        <div class="tbl-wrap">
          <table class="tbl">
            <thead><tr><th>Student</th><th>Number</th><th>Status</th></tr></thead>
            <tbody>
              ${roster.map((s, i) => `
                <tr>
                  <td><b>${esc(s.first_name)} ${esc(s.last_name)}</b></td>
                  <td class="faint mono" style="font-size:12px">${esc(s.student_number)}</td>
                  <td>
                    <select data-idx="${i}" class="select status-select" style="width:auto">
                      ${['present','late','absent','excused'].map(st =>
                        `<option value="${st}" ${(s.status||'present')===st?'selected':''}>${st}</option>`
                      ).join('')}
                    </select>
                  </td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`;

      document.getElementById('btnSave').disabled = false;
    } catch (err) {
      msg.textContent = err.message || 'Failed';
      box.innerHTML = '';
    }
  }

  document.getElementById('btnLoad').addEventListener('click', loadRoster);
  document.getElementById('btnMarkAllPresent').addEventListener('click', () => {
    document.querySelectorAll('.status-select').forEach(sel => { sel.value = 'present'; });
  });

  document.getElementById('btnSave').addEventListener('click', async () => {
    const classId = document.getElementById('classId').value;
    const date = dateEl.value;
    const msg = document.getElementById('statusMsg');
    const records = [];
    document.querySelectorAll('.status-select').forEach(sel => {
      const i = Number(sel.dataset.idx);
      const s = roster[i];
      if (s) records.push({ studentId: s.student_id, status: sel.value });
    });

    msg.textContent = 'Saving…';
    try {
      await NGISAuth.api('/api/attendance', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ classId, date, records }),
      });
      msg.textContent = `Saved ${records.length} record(s) for ${date}.`;
      loadRoster();
    } catch (err) {
      msg.textContent = err.message || 'Save failed';
    }
  });

  setTimeout(loadRoster, 250);
})();
</script>
</body>
</html>
