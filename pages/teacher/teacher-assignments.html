<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NGIS — Assignments</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/hero.css">
<script>try{var _t=localStorage.getItem('ngis-theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/protect.js"></script>
<script src="_auth-bootstrap.js"></script>
</head>
<body>
<main class="main">
<div id="heroBanner"></div>
<div class="page">

  <div class="grid g-3 anim-up" style="margin-bottom:16px">
    <div class="stat"><div class="stat-top"><div class="stat-ico t-amber"><span class="material-symbols-outlined fill">assignment</span></div></div><div class="stat-val" id="statTotal">—</div><div class="stat-label">My Assignments</div></div>
    <div class="stat"><div class="stat-top"><div class="stat-ico t-green"><span class="material-symbols-outlined fill">check_circle</span></div></div><div class="stat-val" id="statPublished">—</div><div class="stat-label">Published</div></div>
    <div class="stat"><div class="stat-top"><div class="stat-ico t-blue"><span class="material-symbols-outlined fill">schedule</span></div></div><div class="stat-val" id="statUpcoming">—</div><div class="stat-label">Upcoming Due</div></div>
  </div>

  <div class="col-main anim-up-2">
    <div class="stack" style="flex:2">
      <div class="card">
        <div class="card-head">
          <div><h3>All Assignments</h3></div>
          <button class="btn btn-primary btn-sm" id="btnShowCreate">
            <span class="material-symbols-outlined">add</span> New Assignment
          </button>
        </div>
        <div class="card-pad" id="assignmentsTable">
          <p class="muted">Loading…</p>
        </div>
      </div>
    </div>

    <div class="stack">
      <div class="card" id="createCard" style="display:none">
        <div class="card-head"><h3>Create Assignment</h3></div>
        <div class="card-pad">
          <form id="createForm" style="display:flex;flex-direction:column;gap:12px">
            <label style="font-size:13px;font-weight:600">Title
              <input required name="title" class="input" style="width:100%;margin-top:4px" placeholder="e.g. Math Problem Set 5">
            </label>
            <label style="font-size:13px;font-weight:600">Description
              <textarea name="description" class="input" rows="3" style="width:100%;margin-top:4px" placeholder="Instructions for students"></textarea>
            </label>
            <label style="font-size:13px;font-weight:600">Subject ID
              <select name="subjectId" class="select" style="width:100%;margin-top:4px">
                <option value="subj-math">Mathematics</option>
                <option value="subj-phys">Physics</option>
                <option value="subj-chem">Chemistry</option>
                <option value="subj-eng">English</option>
                <option value="subj-hist">History</option>
              </select>
            </label>
            <label style="font-size:13px;font-weight:600">Class ID
              <select name="classId" class="select" style="width:100%;margin-top:4px">
                <option value="cls-10a">Grade 10A</option>
                <option value="cls-11b">Grade 11B</option>
              </select>
            </label>
            <label style="font-size:13px;font-weight:600">Due Date
              <input required type="date" name="dueDate" class="input" style="width:100%;margin-top:4px">
            </label>
            <label style="font-size:13px;font-weight:600">Max Score
              <input type="number" name="maxScore" class="input" value="100" min="1" style="width:100%;margin-top:4px">
            </label>
            <div class="flex gap8">
              <button type="submit" class="btn btn-primary">Publish</button>
              <button type="button" class="btn btn-ghost" id="btnCancelCreate">Cancel</button>
            </div>
            <p id="createMsg" class="muted" style="font-size:13px;margin:0"></p>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h3>Quick grade</h3></div>
        <div class="card-pad">
          <form id="gradeForm" style="display:flex;flex-direction:column;gap:10px">
            <label style="font-size:13px;font-weight:600">Assignment ID
              <input name="assignmentId" class="input" style="width:100%;margin-top:4px" placeholder="asgn-001" required>
            </label>
            <label style="font-size:13px;font-weight:600">Student ID
              <input name="studentId" class="input" style="width:100%;margin-top:4px" value="student-001" required>
            </label>
            <label style="font-size:13px;font-weight:600">Score
              <input type="number" name="score" class="input" style="width:100%;margin-top:4px" required>
            </label>
            <label style="font-size:13px;font-weight:600">Feedback
              <input name="feedback" class="input" style="width:100%;margin-top:4px" placeholder="Optional">
            </label>
            <button type="submit" class="btn btn-primary btn-sm">Submit Grade</button>
            <p id="gradeMsg" class="muted" style="font-size:13px;margin:0"></p>
          </form>
        </div>
      </div>
    </div>
  </div>

</div>
</main>
<script>window.PAGE={"role":"teacher","active":"assignments"};</script>
<script>
window.HERO_CONFIG = {
  role: 'teacher',
  active: 'assignments',
  name: 'Teacher',
  id: 'Teacher',
  grade: 'Teacher',
  avatar: 'https://images.pexels.com/photos/3769021/pexels-photo-3769021.jpeg?auto=compress&cs=tinysrgb&w=160',
  avatarSm: 'https://images.pexels.com/photos/3769021/pexels-photo-3769021.jpeg?auto=compress&cs=tinysrgb&w=80',
  homeLink: '../../index.html',
  signOutLink: '../../index.html',
  profileLink: 'teacher-profile.html',
  notifLink: 'teacher-notifications.html',
  chatLink: '../shared/chat.html',
  notifCount: 0,
  title: 'Assignments',
  greeting: 'Create and manage class assignments.',
  breadcrumbs: [{ label: 'Assignments' }],
  ddRows: []
};
</script>
<script src="../../assets/js/hero.js"></script>
<script src="../../assets/js/layout.js"></script>
<script>
(function () {
  const tableEl = document.getElementById('assignmentsTable');
  const createCard = document.getElementById('createCard');

  document.getElementById('btnShowCreate').addEventListener('click', () => {
    createCard.style.display = createCard.style.display === 'none' ? 'block' : 'none';
  });
  document.getElementById('btnCancelCreate').addEventListener('click', () => {
    createCard.style.display = 'none';
  });

  async function load() {
    try {
      const res = await NGISAuth.api('/api/assignments');
      const items = res.data || [];

      document.getElementById('statTotal').textContent = items.length;
      document.getElementById('statPublished').textContent = items.filter(a => a.status === 'published').length;
      const today = new Date().toISOString().slice(0, 10);
      document.getElementById('statUpcoming').textContent = items.filter(a => a.due_date && a.due_date >= today).length;

      if (!items.length) {
        tableEl.innerHTML = '<p class="muted">No assignments yet. Create one →</p>';
        return;
      }

      tableEl.innerHTML = `
        <div class="tbl-wrap">
          <table class="tbl">
            <thead><tr><th>Assignment</th><th>Class</th><th>Due</th><th>Max</th><th>Status</th><th>ID</th></tr></thead>
            <tbody>
              ${items.map(a => `
                <tr>
                  <td><b>${esc(a.title)}</b><div class="faint" style="font-size:11px">${esc(a.subject_name || '')}</div></td>
                  <td><span class="badge blue">${esc(a.class_name || a.class_id)}</span></td>
                  <td class="faint mono" style="font-size:12px">${a.due_date || '—'}</td>
                  <td>${a.max_score || 100}</td>
                  <td><span class="badge green">${a.status || 'published'}</span></td>
                  <td class="faint mono" style="font-size:11px">${a.id}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    } catch (err) {
      tableEl.innerHTML = `<p style="color:#b91c1c">${esc(err.message)}</p>`;
    }
  }

  document.getElementById('createForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const body = {
      title: fd.get('title'),
      description: fd.get('description'),
      subjectId: fd.get('subjectId'),
      classId: fd.get('classId'),
      dueDate: fd.get('dueDate'),
      maxScore: Number(fd.get('maxScore') || 100),
    };
    const msg = document.getElementById('createMsg');
    msg.textContent = 'Publishing…';
    try {
      await NGISAuth.api('/api/assignments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      msg.textContent = 'Published successfully!';
      e.target.reset();
      load();
    } catch (err) {
      msg.textContent = err.message || 'Failed';
    }
  });

  document.getElementById('gradeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const assignmentId = fd.get('assignmentId');
    const msg = document.getElementById('gradeMsg');
    msg.textContent = 'Saving…';
    try {
      await NGISAuth.api(`/api/assignments/${assignmentId}/grade`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          studentId: fd.get('studentId'),
          score: Number(fd.get('score')),
          feedback: fd.get('feedback') || '',
        }),
      });
      msg.textContent = 'Grade saved!';
    } catch (err) {
      msg.textContent = err.message || 'Failed';
    }
  });

  function esc(s) {
    return String(s || '').replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>');
  }

  // Wait briefly for auth
  setTimeout(load, 200);
})();
</script>
</body>
</html>
