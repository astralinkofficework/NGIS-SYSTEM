<body data-page="messaging">
<main class="main">
  <div id="heroBanner"></div>
  <div class="msg-page">

    <div class="msg-page-head">
      <div>
        <div class="msg-eyebrow">Organization</div>
        <h1 class="msg-title">Archived Conversations</h1>
        <p class="msg-subtitle">Conversations you have archived. They stay searchable and receive messages — they are simply hidden from your main list.</p>
      </div>
    </div>

    <div class="msg-toolbar">
      <div class="msg-search">
        <span class="material-symbols-outlined">search</span>
        <input type="search" id="archSearch" placeholder="Search archived conversations…" autocomplete="off" aria-label="Search archived conversations">
      </div>
    </div>

    <div class="msg-section">
      <div class="msg-section-head">
        <span class="msg-section-title"><span class="material-symbols-outlined">archive</span>Archived</span>
        <span class="msg-tag gray" id="archCount"></span>
      </div>
      <div class="msg-section-body" id="archList"></div>
    </div>
  </div>
</main>

<script>
window.PAGE = { role: 'student', active: 'archived-conversations' };
</script>

<script src="../../assets/js/hero.js"></script>
<script src="../../assets/js/layout.js"></script>
<script src="../../assets/js/messaging-data.js"></script>
<script>
(function () {
  var M = window.MSG;
  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  var archived = M.conversations.filter(function (c) { return c.archived; });
  var q = '';

  function render() {
    var list = archived.filter(function (c) {
      return !q || (c.name + ' ' + c.sub + ' ' + c.lastMsg).toLowerCase().indexOf(q) !== -1;
    });
    document.getElementById('archCount').textContent = list.length + (list.length === 1 ? ' conversation' : ' conversations');
    var el = document.getElementById('archList');
    if (!list.length) {
      el.innerHTML = '<div class="msg-empty"><span class="material-symbols-outlined">archive</span><h4>No archived conversations</h4><p>Archive conversations from the conversation list to keep them out of sight.</p></div>';
      return;
    }
    el.innerHTML = '<div class="msg-list">' + list.map(function (c) {
      var dot = c.status ? '<span class="msg-status-dot ' + c.status + '"></span>' : '';
      var typeTag = c.type === 'group' ? '<span class="msg-tag blue"><span class="material-symbols-outlined">groups</span>Group</span>' :
        '<span class="msg-tag"><span class="material-symbols-outlined">person</span>Direct</span>';
      return '<div class="msg-row">' +
        '<div class="msg-ava" style="background:' + c.color + '">' + c.initials + dot + '</div>' +
        '<div class="msg-row-main"><div class="msg-row-top"><span class="msg-row-name">' + esc(c.name) + '</span><span class="msg-row-time">' + esc(c.time) + '</span></div>' +
        '<div class="msg-row-sub">' + esc(c.sub) + '</div>' +
        '<div class="msg-row-preview">' + esc(c.lastMsg) + '</div>' +
        '<div style="display:flex;gap:6px;margin-top:6px">' + typeTag + '</div></div>' +
        '<div class="msg-row-side">' +
        '<button class="msg-ic-btn" title="Unarchive" onclick="window.toast(\'Conversation unarchived (demo)\',\'success\')"><span class="material-symbols-outlined">unarchive</span></button>' +
        '<button class="msg-ic-btn" title="Open" onclick="window.toast(\'Opening conversation (demo)\',\'info\')"><span class="material-symbols-outlined">open_in_new</span></button>' +
        '</div></div>';
    }).join('') + '</div>';
  }
  render();

  document.getElementById('archSearch').addEventListener('input', function () { q = this.value.trim().toLowerCase(); render(); });
})();
</script>
</body>
</html>
