<body data-page="messaging">
<main class="main">
  <div id="heroBanner"></div>
  <div class="msg-page">

    <div class="msg-page-head">
      <div>
        <div class="msg-eyebrow">Discovery</div>
        <h1 class="msg-title">Message Search</h1>
        <p class="msg-subtitle">Search conversations, messages, class chats, groups, channels, announcements and shared files — only within scopes you can access.</p>
      </div>
    </div>

    <div class="msg-toolbar">
      <div class="msg-search">
        <span class="material-symbols-outlined">search</span>
        <input type="search" id="searchInput" placeholder="Search messages, people, files…" autocomplete="off" aria-label="Search messages" autofocus>
      </div>
      <button class="btn btn-ghost btn-sm" id="filterToggle"><span class="material-symbols-outlined">tune</span>Filters</button>
    </div>

    <!-- Filter drawer -->
    <div class="msg-section" id="filterDrawer" style="display:none;margin-bottom:16px">
      <div class="msg-section-body" style="display:flex;gap:10px;flex-wrap:wrap;padding:14px 16px">
        <select class="msg-select" id="fType" aria-label="Filter by type">
          <option value="">All types</option>
          <option value="message">Messages</option>
          <option value="announcement">Announcements</option>
          <option value="file">Files</option>
        </select>
        <select class="msg-select" id="fSender" aria-label="Filter by sender">
          <option value="">Any sender</option>
        </select>
        <select class="msg-select" id="fCampus" aria-label="Filter by campus">
          <option value="">All campuses</option>
          <option>Sen Sok</option>
          <option>Depo</option>
          <option>Bak Touk</option>
          <option>All campuses</option>
        </select>
        <select class="msg-select" id="fDept" aria-label="Filter by department">
          <option value="">All departments</option>
          <option>Khmer</option>
          <option>English</option>
          <option>Science</option>
          <option>Mathematics</option>
          <option>Chinese</option>
          <option>Physical Education</option>
          <option>Administration</option>
        </select>
        <select class="msg-select" id="fClass" aria-label="Filter by class">
          <option value="">All classes</option>
          <option>10A</option>
          <option>10B</option>
          <option>10C</option>
          <option>11A</option>
          <option>11B</option>
          <option>8A</option>
          <option>12A</option>
        </select>
        <label class="msg-checkbox-row" style="align-self:center">
          <input type="checkbox" id="fAttach">
          <span>Has attachment</span>
        </label>
      </div>
    </div>

    <div class="msg-section">
      <div class="msg-section-head">
        <span class="msg-section-title"><span class="material-symbols-outlined">search</span>Results</span>
        <span class="msg-tag gray" id="resultCount"></span>
      </div>
      <div class="msg-section-body" id="resultList"></div>
    </div>
  </div>
</main>

window.PAGE = { role: 'student', active: 'message-search' };

<script src="../../assets/js/hero.js"></script>
<script src="../../assets/js/layout.js"></script>
<script src="../../assets/js/messaging-data.js"></script>
<script>
(function () {
  var M = window.MSG;
  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  var S = { q: '', type: '', sender: '', campus: '', dept: '', classId: '', attach: false };

  /* Populate sender filter from directory */
  var senderSel = document.getElementById('fSender');
  var senders = {};
  M.searchIndex.forEach(function (r) { senders[r.sender] = true; });
  Object.keys(senders).sort().forEach(function (s) {
    var opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    senderSel.appendChild(opt);
  });

  function highlight(text, q) {
    if (!q) return esc(text);
    var i = text.toLowerCase().indexOf(q);
    if (i === -1) return esc(text);
    return esc(text.slice(0, i)) + '<mark style="background:var(--accent-soft);color:inherit;padding:0 2px;border-radius:3px">' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
  }

  function matches(r) {
    if (S.type && r.type !== S.type) return false;
    if (S.sender && r.sender !== S.sender) return false;
    if (S.campus && r.campus !== S.campus) return false;
    if (S.dept && r.dept !== S.dept) return false;
    if (S.classId && r.classId !== S.classId) return false;
    if (S.attach && !r.hasAttachment) return false;
    if (S.q && (r.text + ' ' + r.sender + ' ' + r.conv).toLowerCase().indexOf(S.q) === -1) return false;
    return true;
  }

  function render() {
    var list = M.searchIndex.filter(matches);
    document.getElementById('resultCount').textContent = list.length + (list.length === 1 ? ' result' : ' results');
    var el = document.getElementById('resultList');
    if (!S.q && !S.type && !S.sender && !S.campus && !S.dept && !S.classId && !S.attach) {
      el.innerHTML = '<div class="msg-empty"><span class="material-symbols-outlined">search</span><h4>Search the messaging system</h4><p>Enter a keyword or apply filters to search messages, announcements and files you are permitted to access.</p></div>';
      return;
    }
    if (!list.length) {
      el.innerHTML = '<div class="msg-empty"><span class="material-symbols-outlined">search_off</span><h4>No results found</h4><p>Try different keywords or clear some filters.</p></div>';
      return;
    }
    var typeIco = { message: 'chat', announcement: 'campaign', file: 'description' };
    el.innerHTML = '<div class="msg-list">' + list.map(function (r) {
      var tag = r.type === 'announcement' ? '<span class="msg-tag blue"><span class="material-symbols-outlined">campaign</span>Announcement</span>' :
        r.type === 'file' ? '<span class="msg-tag"><span class="material-symbols-outlined">description</span>File</span>' :
        '<span class="msg-tag gray"><span class="material-symbols-outlined">chat</span>Message</span>';
      var scope = [r.campus, r.dept !== '—' ? r.dept : null, r.classId !== '—' ? 'Class ' + r.classId : null].filter(Boolean).join(' · ');
      return '<div class="msg-row" style="align-items:flex-start" role="button" tabindex="0" onclick="window.toast(\'Opening result (demo)\',\'info\')">' +
        '<div class="msg-ava sm" style="background:var(--charcoal-blue)"><span class="material-symbols-outlined" style="font-size:16px">' + typeIco[r.type] + '</span></div>' +
        '<div class="msg-row-main" style="min-width:0">' +
        '<div class="msg-row-top"><span class="msg-row-name">' + highlight(r.sender, S.q) + '</span><span class="msg-row-time">' + esc(r.date) + '</span></div>' +
        '<div class="msg-row-sub">' + esc(r.conv) + ' · ' + esc(scope) + '</div>' +
        '<div class="msg-row-preview">' + highlight(r.text, S.q) + (r.hasAttachment ? ' 📎' : '') + '</div>' +
        '<div style="display:flex;gap:6px;margin-top:6px">' + tag + '</div></div></div>';
    }).join('') + '</div>';
  }

  var debounce;
  document.getElementById('searchInput').addEventListener('input', function () {
    var v = this.value.trim().toLowerCase();
    clearTimeout(debounce);
    debounce = setTimeout(function () { S.q = v; render(); }, 180);
  });
  document.getElementById('filterToggle').addEventListener('click', function () {
    var d = document.getElementById('filterDrawer');
    d.style.display = d.style.display === 'none' ? '' : 'none';
  });
  document.getElementById('fType').addEventListener('change', function () { S.type = this.value; render(); });
  document.getElementById('fSender').addEventListener('change', function () { S.sender = this.value; render(); });
  document.getElementById('fCampus').addEventListener('change', function () { S.campus = this.value; render(); });
  document.getElementById('fDept').addEventListener('change', function () { S.dept = this.value; render(); });
  document.getElementById('fClass').addEventListener('change', function () { S.classId = this.value; render(); });
  document.getElementById('fAttach').addEventListener('change', function () { S.attach = this.checked; render(); });

  /* Pre-fill from ?q= */
  var params = new URLSearchParams(window.location.search);
  if (params.get('q')) {
    document.getElementById('searchInput').value = params.get('q');
    S.q = params.get('q').toLowerCase();
  }
  render();
})();
</script>
</body>
</html>
