<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Attachments & Shared Files — NGIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Kantumruy+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/hero.css">
<link rel="stylesheet" href="../../assets/css/messaging.css">
<script>try{var _t=localStorage.getItem('ngis-theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<link rel="stylesheet" href="../../assets/css/interactions.css">
</head>
<body data-page="messaging">
<main class="main">
  <div id="heroBanner"></div>
  <div class="msg-page">

    <div class="msg-page-head">
      <div>
        <div class="msg-eyebrow">Files</div>
        <h1 class="msg-title">Attachments & Shared Files</h1>
        <p class="msg-subtitle">Every document, image and archive shared with you across messaging. Uploads are validated server-side — executables are blocked.</p>
      </div>
    </div>

    <div class="msg-toolbar">
      <div class="msg-search">
        <span class="material-symbols-outlined">search</span>
        <input type="search" id="attSearch" placeholder="Search files…" autocomplete="off" aria-label="Search files">
      </div>
      <select class="msg-select" id="attType" aria-label="Filter by type">
        <option value="">All types</option>
        <option value="pdf">PDF</option>
        <option value="doc">Documents</option>
        <option value="image">Images</option>
        <option value="archive">Archives</option>
      </select>
      <select class="msg-select" id="attConv" aria-label="Filter by conversation">
        <option value="">All conversations</option>
        <option>Direct message</option>
        <option>Class 10A</option>
        <option>Class 10B</option>
        <option>Grade 10A Study Group</option>
        <option>Science Department</option>
        <option>Science Club</option>
        <option>English Department</option>
        <option>Chinese Department</option>
        <option>School Announcements</option>
      </select>
    </div>

    <div class="msg-section">
      <div class="msg-section-head">
        <span class="msg-section-title"><span class="material-symbols-outlined">folder_open</span>Shared files</span>
        <span class="msg-tag gray" id="attCount"></span>
      </div>
      <div class="msg-section-body flush">
        <div class="msg-table-wrap">
          <table class="msg-table" id="attTable">
            <thead>
              <tr><th>File</th><th>Type</th><th>Size</th><th>Shared by</th><th>Conversation</th><th>Date</th><th></th></tr>
            </thead>
            <tbody id="attBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
window.PAGE = { role: 'student', active: 'attachments' };
</script>
<script>window.HERO_CONFIG = {
  name: 'Nrinphouneta Hok',

  grade: 'Grade 10',

  chatLink: 'chat.html',
  notifCount: 3,
  ddRows: [
    { icon: 'school', text: 'Grade 10 — Science Stream' },
    { icon: 'class', text: 'Class 10A · Sen Sok' },
    { icon: 'email', text: 'nrinphouneta@ngis.edu.kh' },
    { icon: 'calendar_today', text: 'Academic Year: 2025–2026' }
  ],
  title: 'Attachments & Shared Files',

<script src="../../assets/js/hero.js"></script>
<script src="../../assets/js/layout.js"></script>
<script src="../../assets/js/messaging-data.js"></script>
<script>
(function () {
  var M = window.MSG;
  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  var q = '', type = '', conv = '';

  function render() {
    var list = M.attachments.filter(function (a) {
      if (type && a.type !== type) return false;
      if (conv && a.conv !== conv) return false;
      if (q && (a.name + ' ' + a.from + ' ' + a.conv).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    document.getElementById('attCount').textContent = list.length + (list.length === 1 ? ' file' : ' files');
    var body = document.getElementById('attBody');
    if (!list.length) {
      body.innerHTML = '<tr><td colspan="7"><div class="msg-empty"><span class="material-symbols-outlined">folder_off</span><h4>No files found</h4><p>Adjust your filters or search term.</p></div></td></tr>';
      return;
    }
    body.innerHTML = list.map(function (a) {
      var icoClass = a.type === 'image' ? 'image' : a.type === 'archive' ? 'archive' : a.type === 'doc' ? 'doc' : '';
      return '<tr>' +
        '<td><div style="display:flex;align-items:center;gap:10px"><div class="msg-file-ico ' + icoClass + '">' + a.type.toUpperCase() + '</div><span style="font-weight:500">' + esc(a.name) + '</span></div></td>' +
        '<td><span class="msg-tag">' + a.type.toUpperCase() + '</span></td>' +
        '<td class="num">' + esc(a.size) + '</td>' +
        '<td>' + esc(a.from) + '</td>' +
        '<td>' + esc(a.conv) + '</td>' +
        '<td class="num">' + esc(a.date) + '</td>' +
        '<td><div style="display:flex;gap:4px">' +
        '<button class="msg-ic-btn" title="Download" onclick="window.toast(\'Downloading ' + esc(a.name) + '\',\'success\')"><span class="material-symbols-outlined">download</span></button>' +
        '<button class="msg-ic-btn" title="Share" onclick="window.toast(\'Share link copied (demo)\',\'info\')"><span class="material-symbols-outlined">share</span></button>' +
        '</div></td></tr>';
    }).join('');
  }
  render();

  document.getElementById('attSearch').addEventListener('input', function () { q = this.value.trim().toLowerCase(); render(); });
  document.getElementById('attType').addEventListener('change', function () { type = this.value; render(); });
  document.getElementById('attConv').addEventListener('change', function () { conv = this.value; render(); });
})();
</script>
</body>
</html>
