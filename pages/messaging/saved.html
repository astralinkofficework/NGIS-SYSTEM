<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Saved Messages — NGIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Kantumruy+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

<link rel="stylesheet" href="../../assets/css/hero.css">
<link rel="stylesheet" href="../../assets/css/messaging.css">
<script>try{var _t=localStorage.getItem('ngis-theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>

</head>
<body data-page="messaging">
<main class="main">
  <div id="heroBanner"></div>
  <div class="msg-page">

    <div class="msg-page-head">
      <div>
        <div class="msg-eyebrow">Personal</div>
        <h1 class="msg-title">Saved Messages</h1>
        <p class="msg-subtitle">Your private notebook — messages and files you saved from any conversation. Only you can see this.</p>
      </div>
    </div>

    <div class="msg-toolbar">
      <div class="msg-search">
        <span class="material-symbols-outlined">search</span>
        <input type="search" id="savedSearch" placeholder="Search saved items…" autocomplete="off" aria-label="Search saved items">
      </div>
      <select class="msg-select" id="savedType" aria-label="Filter by type">
        <option value="">All types</option>
        <option value="text">Text</option>
        <option value="file">Files</option>
        <option value="link">Links</option>
      </select>
    </div>

    <div class="msg-section">
      <div class="msg-section-head">
        <span class="msg-section-title"><span class="material-symbols-outlined">bookmark</span>Saved</span>
        <span class="msg-tag gray" id="savedCount"></span>
      </div>
      <div class="msg-section-body" id="savedList"></div>
    </div>
  </div>
</main>

<script>
window.PAGE = { role: 'student', active: 'saved-messages' };
</script>
<script>window.HERO_CONFIG = {
  name: 'Nrinphouneta Hok',
  id: 'Student ID: 2026-STD-0142',
  grade: 'Grade 10',
  avatar: 'https://images.pexels.com/photos/3785079/pexels-photo-3785079.jpeg?auto=compress&cs=tinysrgb&w=160',
  avatarSm: 'https://images.pexels.com/photos/3785079/pexels-photo-3785079.jpeg?auto=compress&cs=tinysrgb&w=80',
  homeLink: '../../index.html',
  signOutLink: '../../index.html',
  profileLink: '../student/student-profile.html',
  notifLink: '../student/student-notifications.html',
  chatLink: 'chat.html',
  notifCount: 3,
  ddRows: [
    { icon: 'school', text: 'Grade 10 — Science Stream' },
    { icon: 'class', text: 'Class 10A · Sen Sok' },
    { icon: 'email', text: 'nrinphouneta@ngis.edu.kh' },
    { icon: 'calendar_today', text: 'Academic Year: 2025–2026' }
  ],
  title: 'Saved Messages',
  greeting: 'Your private saved items.',
  breadcrumbs: [{ label: 'Messaging', href: 'messaging-dashboard.html' }, { label: 'Saved Messages' }]
};</script>
<script src="../../assets/js/hero.js"></script>
<script src="../../assets/js/layout.js"></script>
<script src="../../assets/js/messaging-data.js"></script>
<script>
(function () {
  var M = window.MSG;
  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  var q = '', type = '';

  function render() {
    var list = M.saved.filter(function (s) {
      if (type && s.type !== type) return false;
      if (q && (s.text + ' ' + s.from + ' ' + s.conv).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    document.getElementById('savedCount').textContent = list.length + (list.length === 1 ? ' item' : ' items');
    var el = document.getElementById('savedList');
    if (!list.length) {
      el.innerHTML = '<div class="msg-empty"><span class="material-symbols-outlined">bookmark</span><h4>Nothing saved yet</h4><p>Use the bookmark action on any message to save it here.</p></div>';
      return;
    }
    el.innerHTML = list.map(function (s) {
      var typeTag = s.type === 'file' ? '<span class="msg-tag blue"><span class="material-symbols-outlined">description</span>File</span>' :
        s.type === 'link' ? '<span class="msg-tag"><span class="material-symbols-outlined">link</span>Link</span>' :
        '<span class="msg-tag gray"><span class="material-symbols-outlined">text_fields</span>Text</span>';
      return '<div class="msg-row" style="align-items:flex-start">' +
        '<div class="msg-ava sm" style="background:var(--charcoal-blue)"><span class="material-symbols-outlined" style="font-size:16px">bookmark</span></div>' +
        '<div class="msg-row-main" style="min-width:0">' +
        '<div class="msg-row-top"><span class="msg-row-name">From: ' + esc(s.from) + '</span><span class="msg-row-time">' + esc(s.date) + '</span></div>' +
        '<div class="msg-row-sub">' + esc(s.conv) + '</div>' +
        '<div class="msg-bubble-card" style="margin-top:6px">' + esc(s.text) +
        (s.attachment ? '<div class="attachment-line"><span class="material-symbols-outlined">description</span>' + esc(s.attachment.name) + ' · ' + esc(s.attachment.size) + '</div>' : '') +
        '</div>' +
        '<div style="display:flex;gap:6px;margin-top:6px">' + typeTag + '</div></div>' +
        '<div class="msg-row-side">' +
        '<button class="msg-ic-btn" title="Forward" onclick="window.toast(\'Forward saved item (demo)\',\'info\')"><span class="material-symbols-outlined">forward</span></button>' +
        '<button class="msg-ic-btn danger" title="Remove" onclick="window.toast(\'Removed from saved (demo)\',\'info\')"><span class="material-symbols-outlined">delete</span></button>' +
        '</div></div>';
    }).join('');
  }
  render();

  document.getElementById('savedSearch').addEventListener('input', function () { q = this.value.trim().toLowerCase(); render(); });
  document.getElementById('savedType').addEventListener('change', function () { type = this.value; render(); });
})();
</script>
</body>
</html>
