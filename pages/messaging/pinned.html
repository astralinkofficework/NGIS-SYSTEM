<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Pinned Messages — NGIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Kantumruy+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/hero.css">
<link rel="stylesheet" href="../../assets/css/messaging.css">
<script>try{var _t=localStorage.getItem('ngis-theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<link rel="stylesheet" href="../../assets/css/interactions.css">
</head>
<body data-page="messaging">
<main class="main">
  <div id="heroBanner"></div>
  <div class="msg-page">

    <div class="msg-page-head">
      <div>
        <div class="msg-eyebrow">Organization</div>
        <div class="msg-title-wrap">
          <button class="hamburger-btn" data-action="toggle-sidebar" aria-label="Toggle navigation" title="Toggle navigation">
            <span class="material-symbols-outlined">menu</span>
          </button>
          <h1 class="msg-title">Pinned Messages</h1>
        </div>
        <p class="msg-subtitle">Important messages pinned across your conversations, class chats and department channels.</p>
      </div>
    </div>

    <div class="msg-toolbar">
      <div class="msg-search">
        <span class="material-symbols-outlined">search</span>
        <input type="search" id="pinSearch" placeholder="Search pinned messages…" autocomplete="off" aria-label="Search pinned messages">
      </div>
      <select class="msg-select" id="pinScope" aria-label="Filter by conversation type">
        <option value="">All types</option>
        <option value="direct">Direct messages</option>
        <option value="class">Class chats</option>
        <option value="group">Group chats</option>
        <option value="channel">Department channels</option>
      </select>
    </div>

    <div class="msg-section">
      <div class="msg-section-head">
        <span class="msg-section-title"><span class="material-symbols-outlined">push_pin</span>Pinned</span>
        <span class="msg-tag gray" id="pinCount"></span>
      </div>
      <div class="msg-section-body" id="pinList"></div>
    </div>
  </div>
</main>

<script>
var _portalRole = (new URLSearchParams(window.location.search).get('portal') || new URLSearchParams(window.location.search).get('role') || localStorage.getItem('ngis_active_portal') || 'admin').toLowerCase();
window.PAGE = { role: _portalRole, active: 'pinned' };
window.HERO_CONFIG = {
  title: 'Pinned Messages',
  greeting: 'Important pinned messages across all conversations.',
  breadcrumbs: [{ label: 'Messaging', href: '../shared/chat.html?portal=' + _portalRole }, { label: 'Pinned Messages' }]
};
</script>
<script src="../../assets/js/hero.js"></script>
<script src="../../assets/js/layout.js"></script>
<script src="../../assets/js/messaging-data.js"></script>
<script>
(function () {
  var M = window.MSG;
  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  var q = '', scope = '';
  var scopeLabel = { direct: 'Direct message', class: 'Class chat', group: 'Group chat', channel: 'Department channel' };

  function render() {
    var list = M.pinned.filter(function (p) {
      if (scope && p.convType !== scope) return false;
      if (q && (p.text + ' ' + p.sender + ' ' + p.conv).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    document.getElementById('pinCount').textContent = list.length + (list.length === 1 ? ' message' : ' messages');
    var el = document.getElementById('pinList');
    if (!list.length) {
      el.innerHTML = '<div class="msg-empty"><span class="material-symbols-outlined">push_pin</span><h4>No pinned messages</h4><p>Pin important messages inside any conversation for quick reference.</p></div>';
      return;
    }
    el.innerHTML = list.map(function (p) {
      return '<div class="msg-row" style="align-items:flex-start">' +
        '<div class="msg-ava" style="background:' + p.senderColor + '">' + p.senderInit + '</div>' +
        '<div class="msg-row-main" style="min-width:0">' +
        '<div class="msg-row-top"><span class="msg-row-name">' + esc(p.sender) + '</span><span class="msg-row-time">' + esc(p.date) + '</span></div>' +
        '<div class="msg-row-sub">' + esc(p.conv) + ' · ' + esc(scopeLabel[p.convType] || p.convType) + ' · Pinned by ' + esc(p.pinnedBy) + '</div>' +
        '<div class="msg-bubble-card" style="margin-top:6px">' + esc(p.text) +
        (p.attachment ? '<div class="attachment-line"><span class="material-symbols-outlined">description</span>' + esc(p.attachment.name) + ' · ' + esc(p.attachment.size) + '</div>' : '') +
        '</div></div>' +
        '<div class="msg-row-side">' +
        '<button class="msg-ic-btn" title="Jump to conversation" onclick="window.toast(\'Opening conversation (demo)\',\'info\')"><span class="material-symbols-outlined">open_in_new</span></button>' +
        '<button class="msg-ic-btn danger" title="Unpin" onclick="window.toast(\'Message unpinned (demo)\',\'info\')"><span class="material-symbols-outlined">push_pin</span></button>' +
        '</div></div>';
    }).join('');
  }
  render();

  document.getElementById('pinSearch').addEventListener('input', function () { q = this.value.trim().toLowerCase(); render(); });
  document.getElementById('pinScope').addEventListener('change', function () { scope = this.value; render(); });
})();
</script>
</body>
</html>
