<body data-role="principal" data-portal="principal" data-page="calendar" class="bg-[#F8FAFC] text-slate-800 font-sans antialiased min-h-screen flex flex-col">
<main class="main flex-1 flex flex-col">

  <!-- Authoritative NGIS Responsive Hero Banner & Desktop Topbar -->

  <!-- Mandatory Mobile Responsive Hamburger Header (AGENTS.md Critical Rule) -->
  <div class="lg:hidden flex items-center justify-between px-4 py-3 bg-white border-b border-[#E1E9E3] text-[#29352E]">

      <button type="button" class="hamburger-btn mobile-hamburger-btn p-2 rounded-lg text-[#29352E] hover:bg-[#F8FAFC] transition active:scale-95" data-action="toggle-sidebar" aria-label="Open menu" aria-expanded="false" title="Open navigation">

      </div>
    </div>
    <div class="flex items-center gap-2">
      <a href="principal-calendar.html" class="p-2 text-[#176B45] hover:bg-[#F0FDF4] rounded-lg transition" aria-label="Calendar">

      <a href="principal-profile.html" class="p-2 text-[#64746A] hover:bg-[#F8FAFC] rounded-lg transition" aria-label="Profile">

    </div>
  </div>

  <!-- Calendar Content Workspace -->

    <!-- Top Principal Executive Bar -->

      <div class="flex items-start sm:items-center gap-3">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center text-[#176B45] shrink-0 border border-[#E1E9E3] bg-[#F8FAFC]">
          <span data-ngis-icon="calendar"></span>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-medium text-[#29352E] tracking-tight">Executive Academic Calendar</h1>
          <p class="text-xs sm:text-sm text-[#64746A]">Academic governance, faculty evaluations, board conferences, and official term dates.</p>
        </div>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium text-[#176B45] bg-[#F0FDF4] border border-[#BBF7D0]">
          Executive Oversight Active
        </span>
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium text-[#64746A] bg-[#F1F5F9] border border-[#E1E9E3]">
          Term 1 · Week 12
        </span>
      </div>
    </div>

    <!-- Mount Point for the Academic Calendar Engine -->
    <div id="academicCalendarApp"></div>

  </div><!-- /.cal-workspace -->
