<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>NGIS — Faculty Oversight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500&family=Inter:wght@300;400;500&family=Kantumruy+Pro:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/app.css?v=3.0">
<link rel="stylesheet" href="../../assets/css/hero.css">
<link rel="stylesheet" href="../../assets/css/interactions.css">
<link rel="stylesheet" href="../../assets/css/design-system.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
/* CRITICAL RULE: NO BOLD FONTS (AGENTS.md) */
*, h1, h2, h3, h4, h5, h6, b, strong, th, td { font-weight: 400 !important; }
.font-medium, .badge, th { font-weight: 500 !important; }
:root { --navy:#202F63; --burgundy:#92243D; --white:#FFFFFF; --black:#000000; --soft-gray:#F3F3F5; --border-subtle:#E5E5E8; }
body { background:var(--soft-gray); color:var(--black); }
.mgr-card { background:var(--white); border:1px solid var(--border-subtle); border-radius:14px; padding:18px 20px; margin-top:14px; box-shadow:0 2px 10px rgba(0,0,0,.03); }
.status-chip { display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:6px; font-size:11px; border:1px solid var(--border-subtle); background:var(--soft-gray); color:#555555; }
.status-chip.ok { color:var(--navy); border-color:var(--navy); }
.status-chip.warn { color:var(--burgundy); border-color:var(--burgundy); }
.btn-burgundy { background:var(--burgundy); color:var(--white); border:0; border-radius:8px; padding:7px 14px; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; text-decoration:none; }
.btn-neutral { background:var(--soft-gray); color:var(--navy); border:1px solid var(--border-subtle); border-radius:8px; padding:7px 14px; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; text-decoration:none; }
.teacher-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px; margin-top:14px; }
.sub-chip { font-size:11px; color:#555555; background:var(--soft-gray); border:1px solid var(--border-subtle); border-radius:999px; padding:2px 9px; display:inline-flex; align-items:center; }
#toast { position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:var(--navy); color:var(--white); padding:10px 18px; border-radius:10px; font-size:13px; display:none; z-index:1200; }
</style>
<script>try{document.documentElement.setAttribute('data-theme','light');localStorage.setItem('ngis-theme','light');}catch(e){}</script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/protect.js"></script>
<script src="_auth-bootstrap.js"></script>
</head>
<body data-role="principal" data-portal="principal">
<main class="main">
  <div id="heroBanner"></div>

  <!-- Mandatory Mobile Hamburger Bar (AGENTS.md rule) -->
  <div class="lg:hidden bg-white border-b border-[#E5E5E8] px-4 py-2.5 flex items-center gap-2.5 sticky top-0 z-30 shadow-xs">
    <button type="button" class="hamburger-btn mobile-hamburger-btn p-2 rounded-xl text-slate-700 hover:bg-slate-100 active:scale-95 transition-all" data-action="toggle-sidebar" aria-label="Open menu" aria-expanded="false" title="Open navigation">
      <i class="ph ph-list text-xl"></i>
    </button>
    <span class="text-sm font-medium text-[#202F63]">Faculty Oversight</span>
  </div>

  <div class="page" style="max-width:1240px;margin:0 auto;padding:24px 20px 48px">
    <div class="flex between center flex-wrap gap-4 anim-up">
      <div>
        <h2 style="font-size:22px;color:var(--navy);margin:0 0 4px">Faculty Oversight</h2>
        <p style="font-size:13.5px;color:#555555;margin:0">Live submission monitoring for every teacher — pending gradebook records counted straight from the academic database.</p>
      </div>
      <div class="flex gap-2 items-center">
        <span class="status-chip warn" id="pendingBanner">—</span>
        <a class="btn-burgundy" href="principal-approvals.html?category=grades"><span class="material-symbols-outlined" style="font-size:16px">verified</span> Review Submissions</a>
      </div>
    </div>

    <div class="mgr-card anim-up-2">
      <div class="flex items-center gap-2 flex-wrap">
        <input id="searchInput" type="search" placeholder="Search teacher, department or class…" class="text-xs px-3 py-2 rounded-lg border border-[#E5E5E8] flex-1 min-w-[220px] outline-none focus:border-[#202F63]">
        <button class="btn-neutral text-xs" onclick="loadTeachers()"><span class="material-symbols-outlined" style="font-size:15px">refresh</span> Reload</button>
      </div>
      <div class="teacher-grid" id="teacherGrid">
        <div class="text-slate-400 text-sm p-4">Loading faculty roster and live submission counts…</div>
      </div>
    </div>
  </div>
</main>
<div id="toast"></div>

<script>window.PAGE={"role":"principal","active":"teachers"};</script>
<script>
window.HERO_CONFIG = {
  role: 'principal', active: 'teachers', isDashboard: false,
  name: 'Dr. Ly Bunheng', id: 'PRN-2024-002', grade: 'Executive Governance',
  avatar: 'https://images.pexels.com/photos/3184339/pexels-photo-3184339.jpeg?auto=compress&cs=tinysrgb&w=160',
  avatarSm: 'https://images.pexels.com/photos/3184339/pexels-photo-3184339.jpeg?auto=compress&cs=tinysrgb&w=80',
  homeLink: '../../index.html', signOutLink: '../../index.html',
  profileLink: 'principal-profile.html', notifLink: 'principal.html', notifCount: 0,
  title: 'Faculty Oversight',
  greeting: 'Monitor teacher submissions, workload and academic reporting.',
  ddRows: []
};
</script>
<script src="../../assets/js/hero.js"></script>
<script src="../../assets/js/layout.js"></script>
<script>
let teachers = [];

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2400);
}

async function loadTeachers() {
  const grid = document.getElementById('teacherGrid');
  try {
    const res = await NGISAuth.api('/api/principal/roster/teachers');
    teachers = res.data || [];
    const totalPending = teachers.reduce((a, t) => a + (t.pendingGradeRecords || 0), 0);
    document.getElementById('pendingBanner').textContent = totalPending + ' pending grade records school-wide';
    renderTeachers();
  } catch (err) {
    grid.innerHTML = `<div style="color:#92243D" class="p-4 text-sm">Could not load faculty: ${err.message}</div>`;
  }
}

function renderTeachers() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const rows = teachers.filter(t => !q
    || String(t.name).toLowerCase().includes(q)
    || String(t.department || '').toLowerCase().includes(q)
    || (t.classes || []).some(c => String(c).toLowerCase().includes(q)));
  const grid = document.getElementById('teacherGrid');
  if (!rows.length) { grid.innerHTML = '<div class="text-slate-400 p-4 text-sm">No faculty match this search.</div>'; return; }
  grid.innerHTML = rows.map(t => {
    const pending = t.pendingGradeRecords || 0;
    const published = t.publishedGradeRecords || 0;
    return `
    <div class="mgr-card" style="margin-top:0" data-id="${t.id}">
      <div class="flex between start center gap-2">
        <div>
          <div style="font-size:15px;color:var(--navy)" class="font-medium">${t.name}</div>
          <div class="text-xs text-slate-500 mt-0.5">${t.department || 'General'} · ${t.email || ''}</div>
        </div>
        <span class="status-chip ${pending ? 'warn' : 'ok'}">${pending ? pending + ' pending' : 'Up to date'}</span>
      </div>
      <div class="flex flex-wrap gap-1.5 mt-3">
        ${(t.classes || []).map(c => `<span class="sub-chip">Class ${c}</span>`).join('')}
        ${(t.subjects || []).slice(0, 3).map(s => `<span class="sub-chip">${s}</span>`).join('')}
      </div>
      <div class="grid grid-cols-2 gap-2 mt-3 text-xs">
        <div class="p-2.5 rounded-lg bg-[#F3F3F5] border border-[#E5E5E8]"><span class="font-medium" style="color:var(--navy);font-size:15px">${published}</span><div class="text-slate-500">Published grade records</div></div>
        <div class="p-2.5 rounded-lg bg-[#F3F3F5] border border-[#E5E5E8]"><span class="font-medium" style="color:${pending ? '#92243D' : '#202F63'};font-size:15px">${pending}</span><div class="text-slate-500">Awaiting your clearance</div></div>
      </div>
      <div class="flex gap-2 mt-3">
        ${pending ? `<a class="btn-burgundy text-xs" style="padding:5px 12px" href="principal-approvals.html?category=grades">Review their submissions</a>` : ''}
        <a class="btn-neutral text-xs" style="padding:5px 12px" href="principal-activity.html?actor=${encodeURIComponent(t.id)}">Action history</a>
      </div>
    </div>`;
  }).join('');
}

document.getElementById('searchInput').addEventListener('input', renderTeachers);
document.addEventListener('DOMContentLoaded', loadTeachers);
</script>
</body>
</html>
