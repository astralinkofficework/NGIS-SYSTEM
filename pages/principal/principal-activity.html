<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>NGIS — Management Action History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500&family=Inter:wght@300;400;500&family=Kantumruy+Pro:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/app.css?v=3.0">
<link rel="stylesheet" href="../../assets/css/hero.css">
<link rel="stylesheet" href="../../assets/css/interactions.css">
<link rel="stylesheet" href="../../assets/css/design-system.css">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
/* CRITICAL RULE: NO BOLD FONTS (AGENTS.md) */
*, h1, h2, h3, h4, h5, h6, b, strong, th, td { font-weight: 400 !important; }
.font-medium, .badge, th { font-weight: 500 !important; }
:root { --navy:#202F63; --burgundy:#92243D; --white:#FFFFFF; --black:#000000; --soft-gray:#F3F3F5; --border-subtle:#E5E5E8; }
body { background:var(--soft-gray); color:var(--black); }
.mgr-card { background:var(--white); border:1px solid var(--border-subtle); border-radius:14px; padding:18px 20px; margin-top:14px; box-shadow:0 2px 10px rgba(0,0,0,.03); }
.mgr-table { width:100%; border-collapse:collapse; font-size:13px; }
.mgr-table th { text-align:left; color:#555555; font-size:11px; text-transform:uppercase; letter-spacing:.04em; padding:8px 10px; border-bottom:1px solid var(--border-subtle); }
.mgr-table td { padding:9px 10px; border-bottom:1px solid #F0F0F3; vertical-align:top; }
.status-chip { display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:6px; font-size:11px; font-weight:500; border:1px solid var(--border-subtle); background:var(--soft-gray); color:#555555; }
.status-chip.ok { color:var(--navy); border-color:var(--navy); }
.status-chip.warn { color:var(--burgundy); border-color:var(--burgundy); }
.btn-burgundy { background:var(--burgundy); color:var(--white); border:0; border-radius:8px; padding:7px 14px; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; text-decoration:none; }
.btn-neutral { background:var(--soft-gray); color:var(--navy); border:1px solid var(--border-subtle); border-radius:8px; padding:7px 14px; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; text-decoration:none; }
.actor-tag { font-size:11px; padding:2px 9px; border-radius:999px; border:1px solid var(--border-subtle); background:var(--soft-gray); color:#555555; }
.actor-tag.principal, .actor-tag.admin { color:var(--navy); border-color:var(--navy); }
.actor-tag.teacher, .actor-tag.student { color:var(--burgundy); border-color:var(--burgundy); }
.empty-row { color:#77777F; }
#actorBanner { display:none; }
#actorBanner.show { display:inline-flex; }
</style>
<script>try{document.documentElement.setAttribute('data-theme','light');localStorage.setItem('ngis-theme','light');}catch(e){}</script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/protect.js"></script>
<script src="_auth-bootstrap.js"></script>
</head>
<body data-role="principal" data-portal="principal">
<main class="main">
  <div id="heroBanner"></div>

  <!-- Mandatory Mobile Hamburger Bar (AGENTS.md rule) -->
  <div class="lg:hidden bg-white border-b border-[#E5E5E8] px-4 py-2.5 flex items-center gap-2.5 sticky top-0 z-30 shadow-xs">
    <button type="button" class="hamburger-btn mobile-hamburger-btn p-2 rounded-xl text-slate-700 hover:bg-slate-100 active:scale-95 transition-all" data-action="toggle-sidebar" aria-label="Open menu" aria-expanded="false" title="Open navigation">
      <i class="ph ph-list text-xl"></i>
    </button>
    <span class="text-sm font-medium text-[#202F63]">Activity History</span>
  </div>

  <div class="page" style="max-width:1240px;margin:0 auto;padding:24px 20px 48px">
    <div class="flex between center flex-wrap gap-4 anim-up">
      <div>
        <h2 style="font-size:22px;color:var(--navy);margin:0 0 4px">Management Action History</h2>
        <p style="font-size:13.5px;color:#555555;margin:0">Permanent audit trail read directly from the academic database — every approval, correction and override with its reason, actor and timestamp.</p>
      </div>
      <span class="status-chip ok" id="logCount">Loading…</span>
    </div>

    <div class="mgr-card anim-up-2">
      <div class="flex items-center gap-2 flex-wrap">
        <input id="searchInput" type="search" placeholder="Search action, reason or record id…" class="text-xs px-3 py-2 rounded-lg border border-[#E5E5E8] flex-1 min-w-[220px] outline-none focus:border-[#202F63]">
        <select id="roleFilter" class="text-xs px-3 py-2 rounded-lg border border-[#E5E5E8] bg-white">
          <option value="all">All actors</option>
          <option value="principal">Principal</option>
          <option value="admin">Admin</option>
          <option value="teacher">Teacher</option>
          <option value="student">Student</option>
        </select>
        <select id="limitFilter" class="text-xs px-3 py-2 rounded-lg border border-[#E5E5E8] bg-white">
          <option value="25">25 rows</option>
          <option value="50">50 rows</option>
          <option value="100">100 rows</option>
          <option value="200">200 rows</option>
        </select>
        <button class="btn-burgundy text-xs" onclick="loadLog()"><span class="material-symbols-outlined" style="font-size:15px">search</span> Query</button>
      </div>
      <div id="actorBanner" class="flex items-center gap-2 mt-3">
        <span class="status-chip warn" id="actorBannerText">Filtered by person</span>
        <button class="btn-neutral text-xs" onclick="clearActorFilter()">Clear person filter ✕</button>
      </div>
      <div style="overflow-x:auto" class="mt-3">
        <table class="mgr-table">
          <thead><tr>
            <th>When</th><th>Actor</th><th>Action</th><th>Record</th><th>Reason</th><th>Details</th>
          </tr></thead>
          <tbody id="logBody"><tr><td colspan="6" class="empty-row">Loading the management audit trail…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script>window.PAGE={"role":"principal","active":"activity"};</script>
<script>
window.HERO_CONFIG = {
  role: 'principal', active: 'activity', isDashboard: false,
  name: 'Dr. Ly Bunheng', id: 'PRN-2024-002', grade: 'Executive Governance',
  avatar: 'https://images.pexels.com/photos/3184339/pexels-photo-3184339.jpeg?auto=compress&cs=tinysrgb&w=160',
  avatarSm: 'https://images.pexels.com/photos/3184339/pexels-photo-3184339.jpeg?auto=compress&cs=tinysrgb&w=80',
  homeLink: '../../index.html', signOutLink: '../../index.html',
  profileLink: 'principal-profile.html', notifLink: 'principal.html', notifCount: 0,
  title: 'Management Action History',
  greeting: 'Every decision, correction and override — preserved forever with its reason.',
  ddRows: []
};
</script>
<script src="../../assets/js/hero.js"></script>
<script src="../../assets/js/layout.js"></script>
<script>
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let actorFilter = new URLSearchParams(location.search).get('actor') || '';

function actionChip(action) {
  const a = String(action || '').toUpperCase();
  if (a.includes('REJECT')) return `<span class="status-chip warn">${esc(action)}</span>`;
  if (a.includes('APPROVE') || a.includes('PUBLISH') || a.includes('CERTIF')) return `<span class="status-chip ok">${esc(action)}</span>`;
  return `<span class="status-chip">${esc(action)}</span>`;
}

function prettyDetails(detailsJson) {
  try {
    const d = JSON.parse(detailsJson || '{}');
    const keys = Object.keys(d);
    if (!keys.length) return '<span class="text-slate-400">—</span>';
    return `<div class="text-[11px] text-slate-500 space-y-0.5">${keys.slice(0, 5).map(k => {
      const v = typeof d[k] === 'object' ? JSON.stringify(d[k]) : String(d[k]);
      return `<div><span style="color:var(--navy)">${esc(k)}:</span> ${esc(v.length > 90 ? v.slice(0, 90) + '…' : v)}</div>`;
    }).join('')}</div>`;
  } catch (e) { return '<span class="text-slate-400">—</span>'; }
}

async function loadLog() {
  const body = document.getElementById('logBody');
  const params = new URLSearchParams();
  params.set('limit', document.getElementById('limitFilter').value);
  const role = document.getElementById('roleFilter').value;
  if (role && role !== 'all') params.set('role', role);
  if (actorFilter) params.set('actor', actorFilter);
  const search = document.getElementById('searchInput').value.trim();
  if (search) params.set('search', search);
  document.getElementById('actorBanner').classList.toggle('show', !!actorFilter);
  if (actorFilter) document.getElementById('actorBannerText').textContent = 'Filtered by person: ' + actorFilter;
  body.innerHTML = '<tr><td colspan="6" class="empty-row">Querying the audit database…</td></tr>';
  try {
    const res = await NGISAuth.api(`/api/principal/audit?${params}`);
    const rows = res.data || [];
    document.getElementById('logCount').textContent = rows.length + ' event(s) shown';
    body.innerHTML = rows.length ? rows.map(e => `
      <tr>
        <td class="text-[11px] text-slate-500 whitespace-nowrap">${esc(e.created_at)}</td>
        <td><span class="actor-tag ${esc(e.actor_role)}">${esc(e.actor_role)}</span><div class="text-[11px] text-slate-500 mt-1">${esc(e.actor_id)}</div></td>
        <td>${actionChip(e.action)}</td>
        <td class="text-[11px]"><span style="color:var(--navy)">${esc(e.entity_type)}</span><div class="text-slate-500">${esc(e.entity_id)}</div></td>
        <td class="text-xs" style="max-width:260px">${esc(e.reason || '—')}</td>
        <td style="max-width:300px">${prettyDetails(e.details_json)}</td>
      </tr>`).join('')
      : '<tr><td colspan="6" class="empty-row">No audit events match these filters.</td></tr>';
  } catch (err) {
    body.innerHTML = `<tr><td colspan="6" style="color:#92243D">Could not load audit history: ${esc(err.message)}</td></tr>`;
  }
}

function clearActorFilter() {
  actorFilter = '';
  const url = new URL(location.href);
  url.searchParams.delete('actor');
  history.replaceState(null, '', url);
  loadLog();
}

document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') loadLog(); });
document.getElementById('roleFilter').addEventListener('change', loadLog);
document.getElementById('limitFilter').addEventListener('change', loadLog);
document.addEventListener('DOMContentLoaded', loadLog);
</script>
</body>
</html>
