  <!-- Key Task Metrics -->
  <div class="grid g-4 mt16 anim-up">

    </div>
    <div class="stat">
      <div class="stat-top"><div class="stat-ico t-amber"><span class="material-symbols-outlined fill">assignment</span></div></div>
      <div class="stat-val" id="statPending">—</div>
      <div class="stat-label">Pending Submissions</div>
    </div>
    <div class="stat">
      <div class="stat-top"><div class="stat-ico t-green"><span class="material-symbols-outlined fill">assignment_turned_in</span></div></div>
      <div class="stat-val" id="statGraded">—</div>
      <div class="stat-label">Graded by Faculty</div>
    </div>
    <div class="stat">
      <div class="stat-top"><div class="stat-ico t-blue"><span class="material-symbols-outlined fill">grade</span></div></div>
      <div class="stat-val" id="statAvgScore">—</div>
      <div class="stat-label">Avg Grade Score</div>
    </div>
  </div>

  <!-- Assignment Tracker Card -->
  <div class="card mt16 anim-up-2">
    <div class="card-head">
      <div>
        <h3 id="asgnTableTitle">Child Assignment Tracker</h3>
        <div class="sub" id="asgnTableSub">Live assignments and coursework status</div>
      </div>
      <div class="flex gap8">
        <select class="select" id="filterSubject" style="width:auto">
          <option value="">All Subjects</option>
          <option value="Advanced Mathematics">Mathematics</option>
          <option value="Physics & Lab">Physics</option>
          <option value="English Literature">English</option>
        </select>
      </div>
    </div>
    <div class="card-pad" id="assignmentsListContainer">
      <p class="muted">Loading coursework…</p>
    </div>
  </div>

</div>

<script>
(function () {
  const tabsContainer = document.getElementById('childrenTabs');
  const tableTitle = document.getElementById('asgnTableTitle');
  const tableSub = document.getElementById('asgnTableSub');
  const listContainer = document.getElementById('assignmentsListContainer');
  const subjectFilter = document.getElementById('filterSubject');

  let currentStudentId = null;
  let currentStudentName = '';
  let rawAssignments = [];

  function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function getStatusBadge(status) {
    status = (status || 'pending').toLowerCase();
    if (status === 'graded') return '<span class="badge green">Graded</span>';
    if (status === 'submitted') return '<span class="badge blue">Submitted</span>';
    if (status === 'late') return '<span class="badge red">Late</span>';
    return '<span class="badge amber">Pending Submission</span>';
  }

  function renderTable(items) {
    if (!items.length) {
      listContainer.innerHTML = `<p class="muted">No coursework found for ${esc(currentStudentName)}.</p>`;
      return;
    }

    listContainer.innerHTML = `
      <div class="tbl-wrap">
        <table class="tbl">
          <thead>
            <tr>
              <th>Assignment Title</th>
              <th>Subject</th>
              <th>Due Date</th>
              <th>Status</th>
              <th>Score</th>
              <th>Teacher Feedback</th>
            </tr>
          </thead>
          <tbody>
            ${items.map(a => `
              <tr>
                <td>
                  <span style="font-weight:600;font-size:13.5px">${esc(a.title)}</span>
                  <div class="faint" style="font-size:11px">${esc(a.description ? a.description.slice(0, 90) + '…' : '')}</div>
                </td>
                <td><span class="badge blue">${esc(a.subject_name || 'General')}</span></td>
                <td class="faint mono" style="font-size:12px">${esc(a.due_date || a.dueDate || '—')}</td>
                <td>${getStatusBadge(a.status)}</td>
                <td class="num" style="font-weight:700">
                  ${a.score != null ? `<span style="color:var(--success)">${a.score}/${a.maxScore || 100}</span>` : '<span class="faint">—</span>'}
                </td>
                <td style="font-size:12px;max-width:240px">
                  ${a.feedback ? `<div style="color:var(--text);font-style:italic">"${esc(a.feedback)}"</div>` : '<span class="faint">Awaiting review</span>'}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  async function loadStudentAssignments(studentId, studentName) {
    currentStudentId = studentId;
    currentStudentName = studentName;
    tableTitle.textContent = `${studentName}'s Coursework Tracker`;
    tableSub.textContent = `Enrolled academic tasks & verified teacher evaluations`;
    listContainer.innerHTML = `<p class="muted">Loading coursework for ${esc(studentName)}…</p>`;

    try {
      const res = await NGISAuth.api(`/api/parent/children/${encodeURIComponent(studentId)}/assignments`);
      rawAssignments = res.data || [];

      // Update KPIs
      const graded = rawAssignments.filter(a => a.status === 'graded');
      const pending = rawAssignments.filter(a => a.status === 'pending');
      document.getElementById('statGraded').textContent = graded.length;
      document.getElementById('statPending').textContent = pending.length;
      document.getElementById('statDueSoon').textContent = pending.length > 0 ? '1 Due Soon' : 'None';

      if (graded.length > 0) {
        const sum = graded.reduce((acc, curr) => acc + (Number(curr.score) || 0), 0);
        document.getElementById('statAvgScore').textContent = Math.round(sum / graded.length) + '%';
      } else {
        document.getElementById('statAvgScore').textContent = '—';
      }

      applyFilter();
    } catch (err) {
      listContainer.innerHTML = `<p style="color:#b91c1c">Failed to load coursework: ${esc(err.message)}</p>`;
    }
  }

  function applyFilter() {
    const subj = subjectFilter.value;
    let filtered = rawAssignments;
    if (subj) {
      filtered = filtered.filter(a => a.subject_name === subj);
    }
    renderTable(filtered);
  }

  subjectFilter.addEventListener('change', applyFilter);

  // Initialize Child tabs
  const checkChildren = setInterval(() => {
    if (!window.NGIS_CHILDREN || !window.NGIS_CHILDREN.length) return;
    clearInterval(checkChildren);

    const children = window.NGIS_CHILDREN;
    tabsContainer.innerHTML = children.map((c, idx) => `
      <button class="btn btn-sm ${idx === 0 ? 'btn-primary' : 'btn-ghost'}" data-id="${c.id}" data-name="${c.name || (c.first_name + ' ' + c.last_name)}">
        <span class="material-symbols-outlined" style="font-size:16px">person</span>
        <span>${esc(c.name || (c.first_name + ' ' + c.last_name))} (${esc(c.grade || c.class || 'Student')})</span>
      </button>
    `).join('');

    tabsContainer.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        tabsContainer.querySelectorAll('button').forEach(b => {
          b.className = 'btn btn-sm btn-ghost';
        });
        btn.className = 'btn btn-sm btn-primary';
        loadStudentAssignments(btn.getAttribute('data-id'), btn.getAttribute('data-name'));
      });
    });

    // Auto-load first child
    const first = children[0];
    loadStudentAssignments(first.id, first.name || (first.first_name + ' ' + first.last_name));
  }, 60);

})();
</script>
