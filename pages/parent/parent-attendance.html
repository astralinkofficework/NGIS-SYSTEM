<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NGIS — Child Attendance</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/hero.css">
<script>try{var _t=localStorage.getItem('ngis-theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>















<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/protect.js"></script>
<script src="_auth-bootstrap.js"></script>
</head>
<body>
<main class="main">
<div id="heroBanner"></div>
<div class="page">

  <section class="mt16 anim-up">
    <div class="flex gap8 wrap" id="childrenTabs"><span class="muted">Loading children…</span></div>
  </section>

  <div class="grid g-4 mt16 anim-up" style="margin-bottom:16px">
    <div class="stat"><div class="stat-top"><div class="stat-ico t-green"><span class="material-symbols-outlined fill">check_circle</span></div></div><div class="stat-val" id="sPresent">—</div><div class="stat-label">Present</div></div>
    <div class="stat"><div class="stat-top"><div class="stat-ico t-amber"><span class="material-symbols-outlined fill">schedule</span></div></div><div class="stat-val" id="sLate">—</div><div class="stat-label">Late</div></div>
    <div class="stat"><div class="stat-top"><div class="stat-ico t-red"><span class="material-symbols-outlined fill">cancel</span></div></div><div class="stat-val" id="sAbsent">—</div><div class="stat-label">Absent</div></div>
    <div class="stat"><div class="stat-top"><div class="stat-ico t-blue"><span class="material-symbols-outlined fill">percent</span></div></div><div class="stat-val" id="sRate">—</div><div class="stat-label">Rate</div></div>
  </div>

  <div class="card anim-up-2">
    <div class="card-head"><div><h3 id="title">Attendance</h3></div></div>
    <div class="card-pad" id="list"><p class="muted">Select a child.</p></div>
  </div>

</div>
</main>
<script>window.PAGE={"role":"parent","active":"attendance"};</script>
<script>
window.HERO_CONFIG = {
  role: 'parent', active: 'attendance', name: 'Parent', id: 'Guardian', grade: 'Parent',
  avatar: 'https://images.pexels.com/photos/2182970/pexels-photo-2182970.jpeg?auto=compress&cs=tinysrgb&w=160',
  avatarSm: 'https://images.pexels.com/photos/2182970/pexels-photo-2182970.jpeg?auto=compress&cs=tinysrgb&w=80',
  homeLink: '../../index.html', signOutLink: '../../index.html',
  profileLink: 'parent-profile.html', notifLink: 'parent-notifications.html', chatLink: '../shared/chat.html',
  notifCount: 0, title: 'Attendance', greeting: 'Track your children\'s attendance.',
  breadcrumbs: [{ label: 'Attendance' }], ddRows: []
};
</script>
<script src="../../assets/js/hero.js"></script>
<script src="../../assets/js/layout.js"></script>
<script>
(function () {
  function esc(s) { return String(s||'').replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>'); }
  function badge(status) {
    const colors = { present: 'green', late: 'amber', absent: 'red', excused: 'blue' };
    return `<span class="badge ${colors[status]||'blue'}">${esc(status)}</span>`;
  }

  async function loadAttendance(studentId, name) {
    document.getElementById('title').textContent = (name || 'Child') + "'s Attendance";
    const el = document.getElementById('list');
    el.innerHTML = '<p class="muted">Loading…</p>';
    try {
      const res = await NGISAuth.api('/api/attendance?studentId=' + encodeURIComponent(studentId));
      const rows = res.data || [];
      const m = res.meta || {};
      document.getElementById('sPresent').textContent = m.present ?? 0;
      document.getElementById('sLate').textContent = m.late ?? 0;
      document.getElementById('sAbsent').textContent = m.absent ?? 0;
      document.getElementById('sRate').textContent = m.rate != null ? m.rate + '%' : '—';

      if (!rows.length) { el.innerHTML = '<p class="muted">No attendance records yet.</p>'; return; }

      el.innerHTML = `
        <div class="tbl-wrap">
          <table class="tbl">
            <thead><tr><th>Date</th><th>Status</th><th>Notes</th></tr></thead>
            <tbody>
              ${rows.map(r => `<tr>
                <td class="mono" style="font-size:13px">${esc(r.date)}</td>
                <td>${badge(r.status)}</td>
                <td class="faint" style="font-size:12px">${esc(r.notes || '')}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    } catch (err) {
      el.innerHTML = `<p style="color:#b91c1c">${esc(err.message)}</p>`;
    }
  }

  const check = setInterval(() => {
    if (!window.NGIS_CHILDREN) return;
    clearInterval(check);
    const children = window.NGIS_CHILDREN;
    const tabs = document.getElementById('childrenTabs');
    if (!children.length) { tabs.innerHTML = '<span class="muted">No children linked.</span>'; return; }
    tabs.innerHTML = children.map((c, i) =>
      `<button class="child-tab ${i===0?'on':''}" data-id="${c.id}" data-name="${esc(c.first_name||'')}">${esc((c.first_name||'') + ' · ' + (c.grade||''))}</button>`
    ).join('');
    loadAttendance(children[0].id, children[0].first_name);
    tabs.querySelectorAll('.child-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        tabs.querySelectorAll('.child-tab').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        loadAttendance(btn.dataset.id, btn.dataset.name);
      });
    });
  }, 100);
})();
</script>
</body>
</html>
