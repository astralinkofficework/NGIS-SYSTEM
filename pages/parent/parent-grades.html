<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>NGIS — Child Grades</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/hero.css">
<script>try{var _t=localStorage.getItem('ngis-theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>















<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/protect.js"></script>
<script src="_auth-bootstrap.js"></script>
</head>
<body>
<main class="main">
<div id="heroBanner"></div>
<div class="page">

  <section class="mt16 anim-up">
    <div class="flex gap8 wrap" id="childrenTabs">
      <span class="muted">Loading children…</span>
    </div>
  </section>

  <div class="card mt16 anim-up-2">
    <div class="card-head">
      <div><h3 id="gradesTitle">Child Grades</h3><div class="sub">Scores from the connected gradebook</div></div>
    </div>
    <div class="card-pad" id="gradesList">
      <p class="muted">Select a child to view grades.</p>
    </div>
  </div>

</div>
</main>
<script>window.PAGE={"role":"parent","active":"grades"};</script>
<script>
window.HERO_CONFIG = {
  role: 'parent',
  active: 'grades',
  name: 'Parent',
  id: 'Guardian',
  grade: 'Parent',
  avatar: 'https://images.pexels.com/photos/2182970/pexels-photo-2182970.jpeg?auto=compress&cs=tinysrgb&w=160',
  avatarSm: 'https://images.pexels.com/photos/2182970/pexels-photo-2182970.jpeg?auto=compress&cs=tinysrgb&w=80',
  homeLink: '../../index.html',
  signOutLink: '../../index.html',
  profileLink: 'parent-profile.html',
  notifLink: 'parent-notifications.html',
  chatLink: '../shared/chat.html',
  notifCount: 0,
  title: 'Grades',
  greeting: 'View your children\'s assessment scores.',
  breadcrumbs: [{ label: 'Grades' }],
  ddRows: []
};
</script>
<script src="../../assets/js/hero.js"></script>
<script src="../../assets/js/layout.js"></script>
<script>
(function () {
  function esc(s) {
    return String(s || '').replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>');
  }

  async function loadGrades(studentId, name) {
    const el = document.getElementById('gradesList');
    document.getElementById('gradesTitle').textContent = (name || 'Child') + "'s Grades";
    el.innerHTML = '<p class="muted">Loading…</p>';
    try {
      const res = await NGISAuth.api('/api/grades?studentId=' + encodeURIComponent(studentId));
      const grades = res.data || [];
      if (!grades.length) {
        el.innerHTML = '<p class="muted">No grades recorded yet for this child.</p>';
        return;
      }
      el.innerHTML = `
        <div class="tbl-wrap">
          <table class="tbl">
            <thead><tr><th>Assessment</th><th>Subject</th><th>Score</th><th>Letter</th><th>Comments</th></tr></thead>
            <tbody>
              ${grades.map(g => `
                <tr>
                  <td><b>${esc(g.assessment_title)}</b></td>
                  <td>${esc(g.subject_name || g.subject_id)}</td>
                  <td class="num">${g.score}/${g.max_score} (${Number(g.percentage).toFixed(0)}%)</td>
                  <td><span class="badge green">${esc(g.letter_grade || '—')}</span></td>
                  <td class="faint" style="font-size:12px">${esc(g.comments || '')}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    } catch (err) {
      el.innerHTML = `<p style="color:#b91c1c">${esc(err.message)}</p>`;
    }
  }

  const check = setInterval(() => {
    if (!window.NGIS_CHILDREN) return;
    clearInterval(check);
    const children = window.NGIS_CHILDREN;
    const tabs = document.getElementById('childrenTabs');
    if (!children.length) {
      tabs.innerHTML = '<span class="muted">No children linked.</span>';
      return;
    }
    tabs.innerHTML = children.map((c, i) => {
      const label = `${c.first_name || ''} · ${c.grade || ''}`;
      return `<button class="child-tab ${i===0?'on':''}" data-id="${c.id}" data-name="${esc(c.first_name||'')}">${esc(label)}</button>`;
    }).join('');

    loadGrades(children[0].id, children[0].first_name);

    tabs.querySelectorAll('.child-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        tabs.querySelectorAll('.child-tab').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        loadGrades(btn.dataset.id, btn.dataset.name);
      });
    });
  }, 100);
})();
</script>
</body>
</html>
