<!doctype html>
<html lang="en" data-theme="light" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NGIS — My Examination Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Khmer:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="../../assets/css/app.css?v=3.2">
  <link rel="stylesheet" href="../../assets/css/hero.css">
  <link rel="stylesheet" href="../../assets/css/interactions.css">
  <link rel="stylesheet" href="../../assets/css/design-system.css">
  <link rel="stylesheet" href="../../assets/css/exams-simple.css?v=1.1">
  <script>try{document.documentElement.setAttribute('data-theme','light');localStorage.setItem('ngis-theme','light');}catch(e){}</script>
</head>
<body data-role="student" data-portal="student" class="min-h-screen bg-[#F7F9F7] font-sans text-slate-800 antialiased flex flex-col" data-shared-page="exams">
  <main class="main flex-1 min-w-0 flex flex-col">
    <header id="heroBanner" role="banner"></header>
    <header id="mobileMainAppbar" class="lg:hidden bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between sticky top-0 z-30 no-print">
      <div class="flex items-center gap-3 min-w-0">
        <button type="button" class="hamburger-btn mobile-hamburger-btn p-1.5 -ml-1 text-slate-700 hover:bg-slate-100 rounded-lg active:scale-95 transition flex items-center justify-center min-w-[38px] min-h-[38px]" data-action="toggle-sidebar" aria-label="Open menu" aria-expanded="false" title="Open navigation">
          <i class="ph-bold ph-list text-xl"></i>
        </button>
        <div class="min-w-0 truncate"><h1 class="text-sm font-medium text-slate-900 leading-tight truncate">My Examination Schedule</h1></div>
      </div>
      <div class="flex items-center gap-2 flex-shrink-0">
        <span id="examsPortalChip" class="px-2.5 py-0.5 rounded-full bg-emerald-50 border border-emerald-200 text-[11px] font-medium text-[#0F5132]">Student</span>
      </div>
    </header>
    <div id="examsWorkspace"></div>
  </main>

  <script>
    (function () {
      var p = new URLSearchParams(window.location.search);

      // Resolve the viewing portal: an explicit session always wins, then the
      // ?portal=/?role= hint, then the sticky active portal, then directory
      // context. The ?portal= value is only a UI hint — it never grants access.
      var norm = function (r) {
        r = String(r || '').toLowerCase();
        if (r === 'super_admin') r = 'superadmin';
        if (r === 'editor') r = 'admin';
        return ['student', 'teacher', 'admin', 'principal', 'staff', 'superadmin'].indexOf(r) !== -1 ? r : '';
      };
      var explicit = false;
      var sessionRole = '';
      try {
        var rawUser = localStorage.getItem('ngis_user');
        if (rawUser) {
          var u = JSON.parse(rawUser);
          if (u && u.role) {
            sessionRole = norm(u.portal || u.role);
            explicit = localStorage.getItem('ngis_session_mode') !== 'passive';
          }
        }
      } catch (e) {}
      var reqRole = norm(p.get('portal') || p.get('role'));
      var role = (explicit && sessionRole) || reqRole ||
        norm(localStorage.getItem('ngis_active_portal')) || 'student';

      window.PAGE = { role: role, active: 'exams' };
      document.body.setAttribute('data-role', role);
      document.body.setAttribute('data-portal', role);

      var dept = (p.get('dept') || p.get('subject') || '').toLowerCase();
      var deptTitles = {
        english: 'English Literature', math: 'Mathematics', maths: 'Mathematics',
        science: 'Science', physics: 'Physics', khmer: 'Khmer Literature',
        chinese: 'Chinese Language', history: 'World History', art: 'Fine Arts', ict: 'ICT'
      };
      var deptName = deptTitles[dept] || (dept ? dept.charAt(0).toUpperCase() + dept.slice(1) : '');
      var label = deptName ? deptName + ' ' : '';

      // Back navigation returns to the active portal's own departments hub.
      var deptLink = (role === 'admin' || role === 'superadmin')
        ? '../admin/admin-departments.html'
        : (role === 'principal')
          ? '../principal/principal-departments.html'
          : (role === 'teacher')
            ? '../teacher/teacher-departments.html'
            : ('departments.html?portal=' + encodeURIComponent(role));

      var isAdminFamily = (role === 'admin' || role === 'superadmin' || role === 'staff');
      window.HERO_CONFIG = {
        role: role,
        title: (label || 'My ') + 'Examination Schedule',
        greeting: deptName
          ? 'Published ' + deptName + ' examinations for your enrolled classes only.'
          : 'Your published examination calendar — subject, date and time only.',
        breadcrumbs: deptName
          ? [{ label: 'Academic Departments', href: deptLink }, { label: deptName + ' Examinations' }]
          : [{ label: 'Examinations' }],
        profileLink: isAdminFamily ? '../admin/admin-settings.html' : role === 'principal' ? '../principal/principal-profile.html' : role === 'teacher' ? '../teacher/teacher-profile.html' : 'student-profile.html',
        notifLink: isAdminFamily ? '../admin/admin-notifications.html' : role === 'principal' ? '../principal/principal-profile.html' : role === 'teacher' ? '../shared/announcements.html?portal=teacher' : 'student-notifications.html',
        notifCount: 3
      };
      // Student persona stays identical to the published student view.
      if (role === 'student') {
        window.HERO_CONFIG.name = 'Nrinphouneta Hok';
        window.HERO_CONFIG.id = 'Student ID: 2026-STD-0142';
        window.HERO_CONFIG.grade = 'Grade 10';
        window.HERO_CONFIG.avatar = 'https://images.pexels.com/photos/3785079/pexels-photo-3785079.jpeg?auto=compress&cs=tinysrgb&w=160';
        window.HERO_CONFIG.avatarSm = 'https://images.pexels.com/photos/3785079/pexels-photo-3785079.jpeg?auto=compress&cs=tinysrgb&w=80';
      }
      document.title = 'NGIS — ' + (label || 'My ') + 'Examination Schedule';

      var chip = document.getElementById('examsPortalChip');
      if (chip) chip.textContent = role === 'superadmin' ? 'Super Admin' : role.charAt(0).toUpperCase() + role.slice(1);
    })();
  </script>
  <script src="../../assets/js/hero.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="../../assets/js/exams-simple.js?v=1.3"></script>
</body>
</html>
