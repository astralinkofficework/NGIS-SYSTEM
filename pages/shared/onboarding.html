<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>NGIS — Academic Onboarding &amp; Setup</title>
  <meta name="description" content="New Gateway International School student and faculty orientation walkthrough."/>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <link rel="stylesheet" href="../../assets/css/app.css">
  <link rel="stylesheet" href="../../assets/css/design-tokens.css">
  <link rel="stylesheet" href="../../assets/css/ui-states.css">
  <link rel="stylesheet" href="../../assets/css/design-system.css">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #F7F9F7;
      color: #000000;
      font-family: 'Manrope', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .ngis-onboarding-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
  </style>

<!-- NGIS global action-icon engine -->
<link rel="stylesheet" href="../../assets/css/action-icons.css">
<script src="../../assets/js/action-icons.js" defer></script>
</head>
<body>

<header class="sr-only">
  <h1>Academic Onboarding &amp; Setup</h1>
</header>

<div id="onboardingContainer"></div>

<!-- Component Scripts -->
<script src="../../assets/js/error-messages.js"></script>
<script src="../../assets/components/onboarding-layout.js"></script>
<script src="../../assets/components/primary-button.js"></script>
<script src="../../assets/js/ui-states.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const root = "../../";
  
  const steps = [
    {
      badge: "Welcome",
      title: "Welcome to NGIS Connected ERP",
      description: "Welcome to New Gateway International School. Let's verify your academic identity and set up your institutional preferences in a few simple steps.",
      content: `
        <div style="background:#FFFFFF; border:1px solid #E1E9E3; border-radius:12px; padding:20px; display:flex; flex-direction:column; gap:16px;">
          <div style="display:flex; align-items:center; gap:16px;">
            <div style="width:48px; height:48px; border-radius:12px; background:#F7F9F7; border:1px solid #E1E9E3; display:grid; place-items:center; color:#29352E; font-size:24px;">
              <i class="ph ph-identification-badge"></i>
            </div>
            <div>
              <div style="font-size:15px; font-weight:500; color:#000000;">Sok Panha Heng</div>
              <div style="font-size:12.5px; color:#176B45;">Institutional ID: NGIS-FAC-2026-09</div>
            </div>
          </div>
          <div style="border-top:1px solid #F7F9F7; padding-top:14px; font-size:13px; color:#176B45; line-height:1.5;">
            Your credentials have been provisioned by the Campus IT Registry. Your academic roles and permissions are active.
          </div>
        </div>
      `
    },
    {
      badge: "Campus Selection",
      title: "Confirm Your Primary Campus",
      description: "Choose your primary campus location for schedule syncing and campus announcements.",
      content: `
        <div style="display:flex; flex-direction:column; gap:12px;">
          <label style="display:flex; align-items:center; gap:14px; padding:16px; background:#FFFFFF; border:1px solid #E1E9E3; border-radius:12px; cursor:pointer;">
            <input type="radio" name="campus" value="sen-sok" checked style="accent-color:#29352E; width:18px; height:18px;">
            <div>
              <div style="font-size:14px; font-weight:500; color:#000000;">Sen Sok Main Campus</div>
              <div style="font-size:12px; color:#176B45;">Building A &amp; B · International High School Division</div>
            </div>
          </label>
          <label style="display:flex; align-items:center; gap:14px; padding:16px; background:#FFFFFF; border:1px solid #E1E9E3; border-radius:12px; cursor:pointer;">
            <input type="radio" name="campus" value="depo" style="accent-color:#29352E; width:18px; height:18px;">
            <div>
              <div style="font-size:14px; font-weight:500; color:#000000;">Depo Branch Campus</div>
              <div style="font-size:12px; color:#176B45;">Primary &amp; Junior High Facilities</div>
            </div>
          </label>
          <label style="display:flex; align-items:center; gap:14px; padding:16px; background:#FFFFFF; border:1px solid #E1E9E3; border-radius:12px; cursor:pointer;">
            <input type="radio" name="campus" value="bak-touk" style="accent-color:#29352E; width:18px; height:18px;">
            <div>
              <div style="font-size:14px; font-weight:500; color:#000000;">Bak Touk Campus</div>
              <div style="font-size:12px; color:#176B45;">Senior Secondary &amp; Exam Testing Center</div>
            </div>
          </label>
        </div>
      `
    },
    {
      badge: "Preferences",
      title: "Notification &amp; Security Preferences",
      description: "Choose how you receive official notices and alerts.",
      content: `
        <div style="background:#FFFFFF; border:1px solid #E1E9E3; border-radius:12px; padding:20px; display:flex; flex-direction:column; gap:16px;">
          <label style="display:flex; align-items:center; justify-content:space-between; cursor:pointer;">
            <div>
              <div style="font-size:13.5px; font-weight:500; color:#000000;">Emergency Campus Broadcasts</div>
              <div style="font-size:12px; color:#176B45;">Urgent weather, safety, and school schedule updates.</div>
            </div>
            <input type="checkbox" checked style="accent-color:#29352E; width:18px; height:18px;">
          </label>
          <div style="height:1px; background:#F7F9F7;"></div>
          <label style="display:flex; align-items:center; justify-content:space-between; cursor:pointer;">
            <div>
              <div style="font-size:13.5px; font-weight:500; color:#000000;">Daily Digest &amp; Timetable Alerts</div>
              <div style="font-size:12px; color:#176B45;">Morning reminder of classes and room assignments.</div>
            </div>
            <input type="checkbox" style="accent-color:#29352E; width:18px; height:18px;">
          </label>
        </div>
      `
    },
    {
      badge: "Ready",
      title: "All Set!",
      description: "Your workspace is fully configured and ready for the 2025–2026 academic year.",
      completeText: "Enter Dashboard",
      content: `
        <div style="background:#FFFFFF; border:1px solid #E1E9E3; border-radius:12px; padding:32px 24px; text-align:center;">
          <div style="width:56px; height:56px; border-radius:50%; background:#F7F9F7; color:#29352E; border:1px solid #E1E9E3; display:grid; place-items:center; font-size:28px; margin:0 auto 16px;">
            <i class="ph ph-check"></i>
          </div>
          <h2 style="font-size:18px; font-weight:500; color:#000000; margin-bottom:8px;">Configuration Complete</h2>
          <p style="font-size:13.5px; color:#176B45; max-width:400px; margin:0 auto; line-height:1.55;">
            You can modify these options anytime from System Settings. Tap below to launch your main dashboard.
          </p>
        </div>
      `
    }
  ];

  window.NGISOnboarding.init(document.getElementById("onboardingContainer"), {
    steps: steps,
    onComplete: function () {
      window.location.href = root + "index.html";
    },
    onSkip: function () {
      window.location.href = root + "index.html";
    }
  });
});
</script>

</body>
</html>
