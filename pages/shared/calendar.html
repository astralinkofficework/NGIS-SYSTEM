<body data-page="calendar" class="bg-[#F8FAFC] text-slate-800 font-sans antialiased min-h-screen flex flex-col">

      </button>

        <img src="../../assets/images/logo.png" alt="NGIS" class="w-7 h-7 object-contain" onerror="this.onerror=null;this.src='../../assets/images/logo.png'">

      </div>
    </div>
    <div class="flex items-center gap-2">
      <a href="calendar.html" class="p-2 text-[#176B45] hover:bg-[#F0FDF4] rounded-lg transition" aria-label="Calendar">
        <span data-ngis-icon="calendar"></span>
      </a>
    </div>
  </div>

  <!-- Calendar Content Workspace -->
  <div class="cal-workspace">

    <!-- Top Shared Academic Header -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-5 bg-white p-4 sm:p-5 rounded-2xl border border-[#E1E9E3] shadow-sm">
      <div class="flex items-start sm:items-center gap-3">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center text-[#176B45] shrink-0 border border-[#E1E9E3] bg-[#F8FAFC]">
          <span data-ngis-icon="calendar"></span>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-medium text-[#29352E] tracking-tight">School Academic Calendar</h1>
          <p class="text-xs sm:text-sm text-[#64746A]">Academic Year 2025–2026 · Official school term schedules, holidays, and milestones.</p>
        </div>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium text-[#176B45] bg-[#F0FDF4] border border-[#BBF7D0]">
          Official Schedule
        </span>
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium text-[#64746A] bg-[#F1F5F9] border border-[#E1E9E3]" id="calendarRoleBadge">
          Student View
        </span>
      </div>
    </div>

    <!-- Mount Point for the Academic Calendar Engine -->
    <div id="academicCalendarApp"></div>

  </div><!-- /.cal-workspace -->

</main>

<!-- Scripts -->
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/protect.js"></script>
<script>
(function () {
  function normRole(r) {
    r = String(r || '').trim().toLowerCase();
    if (r === 'super_admin') return 'superadmin';
    if (r === 'editor') return 'admin';
    return r;
  }

  var p = new URLSearchParams(window.location.search);
  var saved = window.NGISAuth ? NGISAuth.getUser() : null;
  var explicit = window.NGISAuth && NGISAuth.hasExplicitSession();
  var reqRole = normRole(p.get('portal') || p.get('role'));
  var sessionRole = (explicit && saved && (saved.portal || saved.role)) ? normRole(saved.portal || saved.role) : '';
  var storedRole = '';
  try { storedRole = normRole(localStorage.getItem('ngis_active_portal')); } catch (e) {}

  var role = sessionRole || reqRole || (window.NGISAuth ? normRole(NGISAuth.getRole()) : '') || storedRole || 'student';

  document.body.setAttribute('data-role', role);
  document.body.setAttribute('data-portal', role);

  window.PAGE = { role: role, active: 'calendar' };
  window.CALENDAR_ROLE = role;

  var canManage = ['admin', 'superadmin', 'principal'].indexOf(role) !== -1;
  window.CALENDAR_CAN_MANAGE = canManage;

  var badgeEl = document.getElementById('calendarRoleBadge');
  if (badgeEl) {
    badgeEl.textContent = role.charAt(0).toUpperCase() + role.slice(1) + ' View';
  }
  var brandEl = document.getElementById('mobileBrandText');
  if (brandEl) {
    brandEl.textContent = 'NGIS ' + (role.charAt(0).toUpperCase() + role.slice(1));
  }

  window.HERO_CONFIG = {
    role: role,
    active: 'calendar',
    title: 'School Academic Calendar',
    greeting: 'Official institutional schedule for classes, exams, holidays, and campus events.',
    breadcrumbs: [
      { label: 'Calendar' }
    ]
  };
})();
</script>
<script src="../../assets/js/hero.js"></script>
<script src="../../assets/js/layout.js"></script>
<script src="../../assets/js/academic-calendar.js?v=1.0"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (window.NGISAcademicCalendar) {
      window.NGIS_CALENDAR_INSTANCE = new window.NGISAcademicCalendar({
        container: '#academicCalendarApp',
        role: window.CALENDAR_ROLE || 'student',
        canManage: !!window.CALENDAR_CAN_MANAGE,
        initialDate: '2026-11-21',
        initialView: 'month'
      });
    }
  });
</script>
