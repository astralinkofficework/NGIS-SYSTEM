<script>
(function () {
  try { var _t = localStorage.getItem('ngis-theme'); if (_t) document.documentElement.setAttribute('data-theme', _t); } catch (e) {}
  function normRole(r) {
    r = String(r || '').trim().toLowerCase();
    if (r === 'super_admin') return 'superadmin';
    if (r === 'editor') return 'admin';
    return r;
  }
  var p = new URLSearchParams(window.location.search);
  var saved = window.NGISAuth ? NGISAuth.getUser() : null;
  var explicit = window.NGISAuth && NGISAuth.hasExplicitSession();
  var reqRole = normRole(p.get('portal') || p.get('role'));
  var sessionRole = (explicit && saved && (saved.portal || saved.role)) ? normRole(saved.portal || saved.role) : '';
  var storedRole = '';
  try { storedRole = normRole(localStorage.getItem('ngis_active_portal')); } catch (e) {}

  /* This page is a shared, role-agnostic shell used by every portal. The
     authenticated session owns the identity; a ?portal= hint merely selects a
     UI context the session is allowed to serve and never grants permissions.
     layout.js and hero.js independently reconcile the same signals (including
     the admin-preview rules), so this value is a hint, not the authority.
     A shared page must never silently fall back to the Admin portal. */
  var role = sessionRole
    || reqRole
    || (window.NGISAuth ? normRole(NGISAuth.getRole()) : '')
    || storedRole
    || 'student';
  window.PAGE = { role: role, active: role === 'staff' ? 'staff-announcements' : 'announcements' };
  if (saved) window.CURRENT_USER = saved;

  // Managers may publish; readers may not. Publishing rights are decided by the
  // backend identity, never by this UI hint — the button is a convenience only.
  window.ANN_IS_MANAGER = ['admin', 'superadmin', 'staff'].indexOf(role) !== -1;

  window.HERO_CONFIG = {
    role: role,
    title: 'Announcements',
    greeting: 'Your school newsroom — stay informed.',
    breadcrumbs: [{ label: 'Announcements' }]
  };
})();
</script>

<!-- ══ PORTAL ENGINE ══════════════════════════════════════════ -->
<script>
/* ── DATA ─────────────────────────────────────────────────── */
/* Announcements are served by ONE backend (/api/news) shared by every portal.
   Nothing is hardcoded here, and audience visibility is enforced server-side:
   the client only renders what the authenticated viewer is allowed to see. */
var ARTICLES = [];
var ARTICLES_LOADED = false;
var FALLBACK_IMG = 'https://images.pexels.com/photos/6238050/pexels-photo-6238050.jpeg?auto=compress&cs=tinysrgb&w=900';

var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function fmtDate(d) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d || ''));
  if (!m) return String(d || '');
  return MONTHS[parseInt(m[2], 10) - 1] + ' ' + parseInt(m[3], 10) + ', ' + m[1];
}
/* Robust timestamp for sorting — accepts ISO dates and display strings. */
function dateTsOf(d) {
  var t = Date.parse(String(d || ''));
  return isNaN(t) ? 0 : t;
}
function initialsOf(n) {
  var p = String(n || '').trim().split(/\s+/).filter(Boolean);
  if (!p.length) return 'NG';
  return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
}
function readTimeOf(t) {
  var w = String(t || '').split(/\s+/).filter(Boolean).length;
  return Math.max(1, Math.round(w / 200)) + ' min read';
}
function sanitizeHtml(s) {
  return String(s || '')
    .replace(/<script[\s\S]*?<\/script>/gi, '')
    .replace(/\son\w+\s*=\s*"[^"]*"/gi, '');
}
function toHtml(t) {
  var s = String(t == null ? '' : t).trim();
  if (!s) return '';
  if (/<[a-z][\s\S]*>/i.test(s)) return sanitizeHtml(s);
  return s.split(/\n{2,}/).map(function (p) {
    return '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>';
  }).join('');
}
function audienceLabel(a) {
  if (Array.isArray(a)) return a.join(', ');
  return a || 'all';
}
/* Map a backend news record onto the reader's article model. */
function mapNews(n) {
  if (!n || !n.id) return null;
  var body = n.content || n.message || n.body || '';
  var summary = n.summary || n.message || body;
  var d = String(n.date || n.created_at || '').slice(0, 10);
  var img = n.image || n.cover_image || FALLBACK_IMG;
  var author = n.author || n.author_name || 'NGIS Administration';
  return {
    id: n.id,
    category: n.category || 'general',
    title: n.title || 'Untitled announcement',
    subtitle: n.summary || summary,
    desc: summary,
    content: toHtml(body),
    attachments: n.attachments || [],
    author: author,
    authorRole: n.author_role || ((n.target_department && n.target_department !== 'all') ? n.target_department : 'School Administration'),
    authorInit: initialsOf(author),
    date: fmtDate(d),
    dateTs: dateTsOf(d),
    readTime: readTimeOf(body),
    views: n.views || 0,
    img: img,
    thumb: img,
    isNew: false,
    isUnread: false,
    importance: n.priority || 'info',
    isPinned: !!n.pinned,
    audience: audienceLabel(n.audience)
  };
}
/* Load the shared feed. The server decides visibility (published, in-window,
   audience-appropriate); the client only renders the authorised payload. */
function loadArticles() {
  var url = '/api/news';
  var apply = function (res) {
    var list = (res && res.data) ? res.data : (Array.isArray(res) ? res : []);
    ARTICLES = list.map(mapNews).filter(Boolean);
    ARTICLES_LOADED = true;
    renderPortal();
  };
  var fail = function () { ARTICLES = []; ARTICLES_LOADED = true; renderPortal(); };
  try {
    if (window.NGISAuth && typeof NGISAuth.api === 'function') {
      NGISAuth.api(url).then(apply).catch(fail);
    } else {
      fetch(url, { headers: { 'Accept': 'application/json' } })
        .then(function (r) { return r.json(); }).then(apply).catch(fail);
    }
  } catch (e) { fail(); }
}

var CATS = {
  'school-news':  { label: 'School News' },
  'academic':     { label: 'Academic' },
  'events':       { label: 'Events' },
  'sports':       { label: 'Sports' },
  'achievements': { label: 'Achievements' },
  'clubs':        { label: 'Clubs' },
  'holidays':     { label: 'Holidays' },
  'exams':        { label: 'Exams' }
};

/* ── State ─────────────────────────────────────────────────── */
var S = { cat: 'all', query: '', sort: 'latest', bm: {}, perPage: 8, curId: -1 };
try { S.bm = JSON.parse(localStorage.getItem('ngis-ann-bm') || '{}'); } catch(e) {}
function saveBm() { try { localStorage.setItem('ngis-ann-bm', JSON.stringify(S.bm)); } catch(e) {} }

/* ── Filter + sort ─────────────────────────────────────────── */
function getFiltered() {
  var q = S.query.toLowerCase().trim();
  var list = ARTICLES.slice();
  if (S.cat !== 'all') list = list.filter(function(a){ return a.category === S.cat; });
  if (q) list = list.filter(function(a){
    return a.title.toLowerCase().indexOf(q) !== -1 ||
           a.desc.toLowerCase().indexOf(q) !== -1 ||
           a.author.toLowerCase().indexOf(q) !== -1;
  });
  if (S.sort === 'popular') list.sort(function(a,b){ return b.views - a.views; });
  else if (S.sort === 'oldest') list.sort(function(a,b){ return a.dateTs - b.dateTs; });
  else if (S.sort === 'pinned') list.sort(function(a,b){ return (b.isPinned?1:0)-(a.isPinned?1:0); });
  else list.sort(function(a,b){ return b.dateTs - a.dateTs; });
  return list;
}

/* ── Hero render ───────────────────────────────────────────── */
function renderHero(feat, sec1, sec2) {
  var wrap = document.getElementById('annHeroWrap');
  if (!feat) { wrap.innerHTML = ''; return; }
  var cfg = CATS[feat.category] || {};
  var bm = S.bm[feat.id] ? 'bm-on' : '';
  wrap.innerHTML =
    '<div class="ann-hero-section ann-hero-anim">' +
    '<div class="ann-hero-main" onclick="openArticle('+feat.id+')">' +
      '<img class="ann-hero-main-img" src="'+feat.img+'" alt="'+esc(feat.title)+'" loading="eager">' +
      '<div class="ann-hero-main-overlay"></div>' +
      (feat.isNew ? '<div class="ann-hero-new-badge">New</div>' : '') +
      '<div class="ann-hero-main-content">' +
        '<div class="ann-hero-cat-tag">'+esc(cfg.label||feat.category)+'</div>' +
        '<div class="ann-hero-main-stats">' +
          '<span class="ann-hero-stat"><span class="mi">schedule</span>'+esc(feat.readTime)+'</span>' +
          '<span class="ann-hero-stat"><span class="mi">calendar_today</span>'+esc(feat.date)+'</span>' +
          '<span class="ann-hero-stat"><span class="mi">visibility</span>'+fmtV(feat.views)+' views</span>' +
        '</div>' +
        '<h2 class="ann-hero-main-title">'+esc(feat.title)+'</h2>' +
        '<p class="ann-hero-main-desc">'+esc(feat.desc)+'</p>' +
        '<div class="ann-hero-main-footer">' +
          '<div class="ann-hero-author">' +
            '<div class="ann-hero-ava">'+esc(feat.authorInit)+'</div>' +
            '<div><div class="ann-hero-author-name">'+esc(feat.author)+'</div><div class="ann-hero-author-role">'+esc(feat.authorRole)+'</div></div>' +
          '</div>' +
          '<div class="ann-hero-acts">' +
            '<button class="ann-read-story-btn" onclick="event.stopPropagation();openArticle('+feat.id+')"><span class="mi">article</span>Read Story</button>' +
            '<button class="ann-hero-ic-btn '+bm+'" onclick="event.stopPropagation();toggleBmHero(this,'+feat.id+')" title="Bookmark"><span class="mi">bookmark</span></button>' +
            '<button class="ann-hero-ic-btn" onclick="event.stopPropagation();shareArt('+feat.id+')" title="Share"><span data-ngis-icon="share"></span></button>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="ann-hero-stack">' +
    (sec1 ? renderHeroSec(sec1) : '') +
    (sec2 ? renderHeroSec(sec2) : '') +
    '</div>' +
    '</div>';
}
function renderHeroSec(a) {
  var cfg = CATS[a.category] || {};
  return '<div class="ann-hero-sec" onclick="openArticle('+a.id+')">' +
    '<img class="ann-hero-sec-img" src="'+a.img+'" alt="'+esc(a.title)+'" loading="eager">' +
    '<div class="ann-hero-sec-content">' +
      '<span class="ann-hero-sec-cat">'+esc(cfg.label||a.category)+'</span>' +
      '<div class="ann-hero-sec-title">'+esc(a.title)+'</div>' +
      '<div class="ann-hero-sec-meta">' +
        '<span><span class="mi">calendar_today</span>'+esc(a.date)+'</span>' +
        '<span><span class="mi">schedule</span>'+esc(a.readTime)+'</span>' +
      '</div>' +
    '</div>' +
  '</div>';
}

/* ── Card grid ─────────────────────────────────────────────── */
function renderMagazine(list) {
  var grid    = document.getElementById('annMagGrid');
  var count   = document.getElementById('annCount');
  var loadBtn = document.getElementById('annLoadMore');

  if (!list.length) {
    grid.innerHTML = '<div class="ann-card-grid"><div class="ann-empty"><span class="mi">search_off</span><h3>No announcements found</h3><p>Try a different category or search term.</p></div></div>';
    loadBtn.style.display = 'none';
    count.textContent = '0 announcements';
    return;
  }

  count.textContent = list.length + ' announcement' + (list.length !== 1 ? 's' : '');
  var vis = list.slice(0, S.perPage);
  var html = '<div class="ann-card-grid">';
  for (var i = 0; i < vis.length; i++) {
    html += renderCard(vis[i], i);
  }
  html += '</div>';
  grid.innerHTML = html;
  loadBtn.style.display = list.length > S.perPage ? 'inline-flex' : 'none';
}

function renderCard(a, idx) {
  if (!a) return '';
  var cfg = CATS[a.category] || {};
  var bm  = S.bm[a.id] ? 'bm-on' : '';
  var uCls = a.isUnread ? ' unread-card' : '';
  return '<div class="ann-card'+uCls+' ann-up-'+Math.min(idx,7)+'" onclick="openArticle('+a.id+')">' +
    '<div class="ann-card-img-wrap">' +
      '<img src="'+a.thumb+'" alt="'+esc(a.title)+'" loading="lazy">' +
    '</div>' +
    '<div class="ann-card-body">' +
      '<div class="ann-card-cat">'+esc(cfg.label||a.category)+'</div>' +
      '<h3 class="ann-card-title">'+esc(a.title)+'</h3>' +
      '<p class="ann-card-desc">'+esc(a.desc)+'</p>' +
      '<div class="ann-card-footer">' +
        '<div class="ann-card-meta-row">' +
          '<span class="ann-card-stat"><span class="mi">calendar_today</span>'+esc(a.date)+'</span>' +
          '<span class="ann-card-stat"><span class="mi">schedule</span>'+esc(a.readTime)+'</span>' +
        '</div>' +
        '<div class="ann-card-acts">' +
          '<button class="ann-ic-btn '+bm+'" onclick="event.stopPropagation();toggleBmCard(this,'+a.id+')" title="Bookmark"><span class="mi">bookmark</span></button>' +
          '<button class="ann-ic-btn" onclick="event.stopPropagation();shareArt('+a.id+')" title="Share"><span data-ngis-icon="share"></span></button>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

/* ── Ticker (latest / pinned headlines) ────────────────────── */
function renderTicker() {
  var track = document.getElementById('annTickerTrack');
  if (!track) return;
  var picks = ARTICLES.slice().sort(function(a,b){
    return (b.isPinned?1:0)-(a.isPinned?1:0) || (b.importance==='urgent'?1:0)-(a.importance==='urgent'?1:0) || b.dateTs-a.dateTs;
  }).slice(0, 6);
  if (!picks.length) {
    track.innerHTML = '<span class="ann-ticker-item">No announcements published yet.</span>';
    return;
  }
  var html = picks.map(function(a){
    return '<span class="ann-ticker-item" onclick="openArticle('+a.id+')">'+esc(a.title)+'</span>';
  }).join('');
  /* duplicate once for a seamless -50% marquee loop */
  track.innerHTML = html + html;
}

/* ── Sidebar widgets ───────────────────────────────────────── */
function widgetEmpty(msg) {
  return '<div class="ann-widget-empty">'+esc(msg)+'</div>';
}
function renderWidgets() {
  /* Important Notices — pinned / urgent / important items */
  var notices = ARTICLES.filter(function(a){
    return a.isPinned || a.importance === 'urgent' || a.importance === 'important';
  }).sort(function(a,b){ return (b.isPinned?1:0)-(a.isPinned?1:0) || b.dateTs-a.dateTs; }).slice(0, 4);
  var nEl = document.getElementById('annNoticesBd');
  if (nEl) nEl.innerHTML = notices.length ? notices.map(function(a){
    return '<div class="ann-notice-item" onclick="openArticle('+a.id+')">' +
      '<div class="ann-notice-mark"></div>' +
      '<div><div class="ann-notice-t">'+esc(a.title)+'</div>' +
      '<div class="ann-notice-s">'+esc(a.date)+'</div></div></div>';
  }).join('') : widgetEmpty('No urgent notices.');

  /* Upcoming Events — events category */
  var events = ARTICLES.filter(function(a){ return a.category === 'events'; })
    .sort(function(a,b){ return b.dateTs-a.dateTs; }).slice(0, 4);
  var eEl = document.getElementById('annEventsBd');
  if (eEl) eEl.innerHTML = events.length ? events.map(function(a){
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(a.dateTs));
    var day = m ? m[3] : '--';
    var mon = m ? MONTHS[parseInt(m[2],10)-1] : '';
    return '<div class="ann-ev-item" onclick="openArticle('+a.id+')">' +
      '<div class="ann-ev-date"><span class="ann-ev-day">'+day+'</span><span class="ann-ev-mon">'+mon+'</span></div>' +
      '<div><div class="ann-ev-t">'+esc(a.title)+'</div>' +
      '<div class="ann-ev-s">'+esc(a.date)+'</div></div></div>';
  }).join('') : widgetEmpty('No upcoming events.');

  /* Trending — most viewed */
  var trending = ARTICLES.slice().sort(function(a,b){ return b.views-a.views; }).slice(0, 4);
  var tEl = document.getElementById('annTrendingBd');
  if (tEl) tEl.innerHTML = trending.length ? trending.map(function(a, i){
    return '<div class="ann-pop-item" onclick="openArticle('+a.id+')">' +
      '<div class="ann-pop-num">'+(i+1)+'</div>' +
      '<div><div class="ann-pop-t">'+esc(a.title)+'</div>' +
      '<div class="ann-pop-s">'+fmtV(a.views)+' views</div></div></div>';
  }).join('') : widgetEmpty('Nothing trending yet.');
}

/* ── Portal render ─────────────────────────────────────────── */
function renderPortal() {
  if (!ARTICLES_LOADED) return;
  var filtered = getFiltered();
  renderHero(filtered[0]||null, filtered[1]||null, filtered[2]||null);
  renderMagazine(filtered.slice(3));
  renderTicker();
  renderWidgets();
}

/* ── Open article ──────────────────────────────────────────── */
function openArticle(id) {
  var a = ARTICLES.find(function(x){ return x.id === id; });
  if (!a) return;
  S.curId = id;
  a.isUnread = false;
  var cfg = CATS[a.category] || {};

  document.getElementById('artHeroImg').src = a.img;
  document.getElementById('artHeroImg').alt = a.title;
  document.getElementById('artCatLabel').textContent = cfg.label || a.category;
  document.getElementById('artTitle').textContent = a.title;
  document.getElementById('artSubtitle').textContent = a.subtitle || a.desc;

  document.getElementById('artMeta').innerHTML =
    '<div class="art-author">' +
      '<div class="art-author-ava">'+esc(a.authorInit)+'</div>' +
      '<div><div class="art-author-name">'+esc(a.author)+'</div><div class="art-author-role">'+esc(a.authorRole)+'</div></div>' +
    '</div>' +
    '<span class="art-meta-stat"><span class="mi">calendar_today</span>'+esc(a.date)+'</span>' +
    '<span class="art-meta-stat"><span class="mi">schedule</span>'+esc(a.readTime)+'</span>' +
    '<span class="art-meta-stat"><span class="mi">visibility</span>'+fmtV(a.views)+' views</span>';

  var bm = S.bm[id];
  document.getElementById('artActions').innerHTML =
    '<button class="art-action-btn art-btn-ghost '+(bm?'bm-on':'')+'" id="artBmBtn" onclick="toggleArtBookmark()"><span class="mi">bookmark</span>'+(bm?'Bookmarked':'Bookmark')+'</button>' +
    '<button class="art-action-btn art-btn-ghost" onclick="shareCurrentArticle()"><span data-ngis-icon="share"></span>Share</button>' +
    '<button class="art-action-btn art-btn-ghost" onclick="window.print()"><span data-ngis-icon="print"></span>Print</button>';

  var attachHtml = '';
  if (a.attachments && a.attachments.length) {
    attachHtml = '<div class="art-attach-section">' +
      '<div class="art-attach-title"><span class="mi">folder_open</span>Downloads</div>' +
      '<div class="art-attach-list">' +
      a.attachments.map(function(f){
        return '<div class="art-attach">' +
          '<div class="art-attach-icon aai-'+esc(f.type)+'">'+f.type.toUpperCase()+'</div>' +
          '<span class="art-attach-name">'+esc(f.name)+'</span>' +
          '<span class="art-attach-size">'+esc(f.size)+'</span>' +
          '<div class="art-attach-dl"><span data-ngis-icon="download"></span></div>' +
        '</div>';
      }).join('') +
      '</div></div>';
  }
  document.getElementById('artContent').innerHTML = a.content + attachHtml;

  /* Related */
  var related = ARTICLES.filter(function(x){ return x.id !== id; }).slice(0, 3);
  document.getElementById('artRelated').innerHTML = related.length ?
    '<div class="art-related-section">' +
    '<div class="art-related-title">Related Announcements</div>' +
    '<div class="art-related-grid">' +
    related.map(function(r){
      var rc = CATS[r.category] || {};
      return '<div class="art-rel-card" onclick="openArticle('+r.id+')">' +
        '<img class="art-rel-img" src="'+r.thumb+'" alt="'+esc(r.title)+'" loading="lazy">' +
        '<div class="art-rel-body">' +
          '<div class="art-rel-cat">'+esc(rc.label||r.category)+'</div>' +
          '<div class="art-rel-t">'+esc(r.title)+'</div>' +
          '<div class="art-rel-s">'+esc(r.date)+'</div>' +
        '</div></div>';
    }).join('') +
    '</div></div>' : '';

  /* Prev / Next */
  var ids = ARTICLES.map(function(x){ return x.id; });
  var pos = ids.indexOf(id);
  var prev = pos > 0 ? ARTICLES[pos-1] : null;
  var next = pos < ARTICLES.length-1 ? ARTICLES[pos+1] : null;
  document.getElementById('artPrevNext').innerHTML =
    '<div class="art-prevnext">' +
    (prev?'<div class="art-nav-card" onclick="openArticle('+prev.id+')"><div class="art-nav-arrow"><span data-ngis-icon="chevronLeft"></span></div><div><div class="art-nav-lbl">Previous</div><div class="art-nav-t">'+esc(prev.title)+'</div></div></div>':'<div></div>') +
    (next?'<div class="art-nav-card next" onclick="openArticle('+next.id+')"><div><div class="art-nav-lbl">Next Page</div><div class="art-nav-t">'+esc(next.title)+'</div></div><div class="art-nav-arrow"><span data-ngis-icon="chevronRight"></span></div></div>':'<div></div>') +
    '</div>';

  var ftBm = document.getElementById('artFtBm');
  if (ftBm) ftBm.classList.toggle('bm-on', !!S.bm[id]);

  document.getElementById('annPortal').style.display = 'none';
  document.getElementById('annArticle').style.display = 'block';
  document.getElementById('artProgressBar').style.width = '0';
  document.getElementById('artFloatTools').classList.remove('visible');
  window.scrollTo(0, 0);
  startProgress();

  try { history.pushState({art: id}, '', '#/article/'+id); } catch(e) {}
  renderPortal();
}

/* ── Back to portal ────────────────────────────────────────── */
function backToPortal() {
  stopProgress();
  document.getElementById('annPortal').style.display = '';
  document.getElementById('annArticle').style.display = 'none';
  document.getElementById('artProgressBar').style.width = '0';
  document.getElementById('artFloatTools').classList.remove('visible');
  S.curId = -1;
  try { history.pushState({}, '', location.pathname + location.search); } catch(e) {}
}

/* ── Reading progress ──────────────────────────────────────── */
var _raf = null;
function startProgress() {
  stopProgress();
  function tick() {
    var art = document.getElementById('artContent');
    if (!art) return;
    var rect = art.getBoundingClientRect();
    var pct = Math.min(100, Math.max(0, (-rect.top / art.offsetHeight) * 100));
    document.getElementById('artProgressBar').style.width = pct + '%';
    if (pct > 5) document.getElementById('artFloatTools').classList.add('visible');
    _raf = requestAnimationFrame(tick);
  }
  _raf = requestAnimationFrame(tick);
}
function stopProgress() { if (_raf) { cancelAnimationFrame(_raf); _raf = null; } }

/* ── Bookmarks ─────────────────────────────────────────────── */
function toggleBmHero(btn, id) {
  S.bm[id] = !S.bm[id]; if (!S.bm[id]) delete S.bm[id];
  saveBm(); btn.classList.toggle('bm-on', !!S.bm[id]);
  if (window.toast) window.toast(S.bm[id]?'Bookmarked':'Removed','success');
}
function toggleBmCard(btn, id) {
  S.bm[id] = !S.bm[id]; if (!S.bm[id]) delete S.bm[id];
  saveBm(); btn.classList.toggle('bm-on', !!S.bm[id]);
  if (window.toast) window.toast(S.bm[id]?'Bookmarked':'Removed','success');
}
function toggleArtBookmark() {
  var id = S.curId; if (id < 0) return;
  S.bm[id] = !S.bm[id]; if (!S.bm[id]) delete S.bm[id];
  saveBm();
  var btn = document.getElementById('artBmBtn');
  if (btn) { btn.classList.toggle('bm-on', !!S.bm[id]); btn.innerHTML='<span class="mi">bookmark</span>'+(S.bm[id]?'Bookmarked':'Bookmark'); }
  var ftBm = document.getElementById('artFtBm');
  if (ftBm) ftBm.classList.toggle('bm-on', !!S.bm[id]);
  if (window.toast) window.toast(S.bm[id]?'Bookmarked':'Removed','success');
}
function toggleFloatBookmark() { toggleArtBookmark(); }

/* ── Share / Link / Scroll ─────────────────────────────────── */
function shareArt(id) {
  var a = ARTICLES.find(function(x){ return x.id===id; });
  if (navigator.share && a) navigator.share({ title: a.title, text: a.desc }).catch(function(){});
  else if (window.toast) window.toast('Link copied to clipboard','success');
}
function shareCurrentArticle() { shareArt(S.curId); }
function copyLink() {
  try { navigator.clipboard.writeText(window.location.href); } catch(e) {}
  if (window.toast) window.toast('Link copied to clipboard','success');
}
function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

/* ── Util ──────────────────────────────────────────────────── */
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtV(n) {
  if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'')+'k';
  return String(n);
}

/* ── Init ──────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', function() {
  /* Manager-only publishing affordance. This is a convenience shortcut; the
     backend still authorises every publishing request, so hiding it for
     readers is cosmetic, not the security boundary. */
  var mg = document.getElementById('annManageBtn');
  if (mg && window.ANN_IS_MANAGER) mg.hidden = false;

  renderPortal();   /* keeps loading placeholders visible until data arrives */
  loadArticles();   /* ONE shared backend feed for every portal */

  var st;
  document.getElementById('annSearch').addEventListener('input', function(e) {
    clearTimeout(st);
    var v = e.target.value;
    st = setTimeout(function(){ S.query = v; S.perPage = 8; renderPortal(); }, 230);
  });

  document.getElementById('annSort').addEventListener('change', function(e) {
    S.sort = e.target.value; renderPortal();
  });

  var drawer = document.getElementById('annFilterDrawer');
  var ftBtn  = document.getElementById('annFilterToggle');
  ftBtn.addEventListener('click', function() {
    var open = drawer.classList.toggle('open');
    ftBtn.setAttribute('aria-expanded', String(open));
  });

  document.getElementById('annCatNav').addEventListener('click', function(e) {
    var btn = e.target.closest('.ann-cat-pill');
    if (!btn) return;
    document.querySelectorAll('.ann-cat-pill').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    S.cat = btn.dataset.cat; S.perPage = 8; renderPortal();
  });

  document.getElementById('annLoadMore').addEventListener('click', function() {
    S.perPage += 4; renderPortal();
  });

  /* Direct deep link (#/article/:id) — wait for the async feed to arrive. */
  var hash = location.hash;
  if (hash && hash.indexOf('#/article/') === 0) {
    var id = parseInt(hash.replace('#/article/',''), 10);
    if (!isNaN(id)) {
      var tries = 0;
      var tryOpen = function () {
        if (ARTICLES_LOADED) { openArticle(id); return; }
        if (tries++ < 40) setTimeout(tryOpen, 100);
      };
      tryOpen();
    }
  }

  window.addEventListener('popstate', function(e) {
    if (!e.state || !e.state.art) backToPortal();
    else openArticle(e.state.art);
  });
});
</script>
