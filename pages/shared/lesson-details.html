<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>NGIS — Lesson</title>
<meta name="description" content="Read the full lesson document, worksheet, or learning material on New Gateway International School's learning platform.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/hero.css">
<link rel="stylesheet" href="../../assets/css/interactions.css">
<link rel="stylesheet" href="../../assets/css/design-system.css">
<link rel="stylesheet" href="css/lessons.css">
<link rel="stylesheet" href="css/lesson-details.css">

<!-- NGIS global action-icon engine -->
<link rel="stylesheet" href="../../assets/css/action-icons.css?v=1.13.2">
<link rel="stylesheet" href="../../assets/css/ui-cleanup.css">
<script src="../../assets/js/action-icons.js?v=1.13.2" defer></script>
<script>try{var _t=localStorage.getItem('ngis-theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
</head>
<body data-page="lessons" class="lesson-details-page">

<main class="main">

  <!-- Shared top navigation / branding (banner body hidden via CSS) -->
  <header id="heroBanner" role="banner"></header>

  <!-- ═══════════════ LOADING SKELETON ═══════════════ -->
  <div class="ld-page" id="ldLoading" aria-busy="true" aria-label="Loading lesson">
    <div class="ld-header ld-skeleton">
      <div class="sk sk-line" style="width:120px"></div>
      <div class="sk sk-line" style="width:60%"></div>
      <div class="sk sk-line" style="width:40%"></div>
    </div>
    <div class="ld-body">
      <div class="ld-viewer-col">
        <div class="ld-viewer-card ld-skeleton" style="min-height:480px">
          <div class="sk sk-block" style="height:100%"></div>
        </div>
      </div>
      <aside class="ld-info-col ld-skeleton">
        <div class="ld-info-card">
          <div class="sk sk-line" style="width:40%"></div>
          <div class="sk sk-line" style="width:90%"></div>
          <div class="sk sk-line" style="width:80%"></div>
          <div class="sk sk-line" style="width:70%"></div>
        </div>
        <div class="ld-info-card">
          <div class="sk sk-line" style="width:50%"></div>
          <div class="sk sk-line" style="width:85%"></div>
          <div class="sk sk-line" style="width:75%"></div>
        </div>
      </aside>
    </div>
  </div>

  <!-- ═══════════════ ERROR STATE ═══════════════ -->
  <div class="ld-page" id="ldError" style="display:none" role="alert">
    <div class="ld-error-wrap">
      <div class="ld-error-card">
        <span class="material-symbols-outlined ld-error-ico">search_off</span>
        <h2 id="ldErrorTitle">Resource not found</h2>
        <p id="ldErrorText">This learning material may have been removed, unpublished, or is not available to your account.</p>
        <div class="ld-error-actions">
          <button class="ld-btn ld-btn-primary" id="ldErrorRetry" onclick="ldRetry()">
            <span data-ngis-icon="view"></span> Try Again
          </button>
          <a class="ld-btn ld-btn-ghost" id="ldErrorBack" href="lessons.html">
            <span data-ngis-icon="back"></span> Back to Library
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══════════════ LESSON CONTENT ═══════════════ -->
  <div class="ld-page" id="ldContent" style="display:none">

    <!-- Compact lesson header -->
    <header class="ld-header">
      <div class="ld-header-main">
        <div class="ld-header-left">
          <a class="ld-back-btn" id="ldBackLink" href="lessons.html">
            <span data-ngis-icon="back"></span>
            <span class="ld-back-label">Back to Library</span>
          </a>
          <div class="ld-crumb" id="ldCrumb">
            <a class="ld-crumb-link" id="ldCrumbSubject" href="lessons.html">Mathematics Library</a>
            <span class="ld-crumb-sep" aria-hidden="true">/</span>
            <span class="ld-crumb-cur" id="ldCrumbTopic">Lesson</span>
          </div>
          <h1 class="ld-title" id="ldTitle">Lesson title</h1>
          <div class="ld-meta" id="ldMeta"></div>
        </div>
        <div class="ld-header-actions">
          <button class="ld-icon-btn" id="ldBookmarkBtn" title="Save resource" aria-label="Save resource" aria-pressed="false" onclick="ldToggleBookmark()">
            <span data-ngis-icon="bookmark"></span>
          </button>
          <button class="ld-icon-btn" id="ldDownloadBtn" title="Download file" aria-label="Download file" onclick="ldDownload()">
            <span data-ngis-icon="download"></span>
          </button>
        </div>
      </div>
    </header>

    <!-- Viewer + info layout -->
    <div class="ld-body">
      <div class="ld-viewer-col">

        <!-- Document viewer card -->
        <section class="ld-viewer-card" id="ldViewerCard" aria-label="Lesson document viewer">
          <div class="ld-toolbar" id="ldToolbar">
            <div class="ld-tool-group" id="ldPageGroup">
              <button class="ld-tool-btn" id="ldPagePrev" title="Previous page" aria-label="Previous page" onclick="ldPageStep(-1)">
                <span data-ngis-icon="chevronUp"></span>
              </button>
              <span class="ld-page-indicator" id="ldPageIndicator">Page <span id="ldPageCur">1</span> of <span id="ldPageTotal">1</span></span>
              <button class="ld-tool-btn" id="ldPageNext" title="Next page" aria-label="Next page" onclick="ldPageStep(1)">
                <span data-ngis-icon="chevronDown"></span>
              </button>
            </div>
            <div class="ld-tool-sep" aria-hidden="true"></div>
            <div class="ld-tool-group" id="ldZoomGroup">
              <button class="ld-tool-btn" id="ldZoomOut" title="Zoom out" aria-label="Zoom out" onclick="ldZoom(-10)">
                <span data-ngis-icon="zoomOut"></span>
              </button>
              <button class="ld-tool-btn ld-zoom-fit" id="ldZoomFit" title="Fit to width" aria-label="Fit to width" onclick="ldZoomFit()">100%</button>
              <button class="ld-tool-btn" id="ldZoomIn" title="Zoom in" aria-label="Zoom in" onclick="ldZoom(10)">
                <span data-ngis-icon="zoomIn"></span>
              </button>
            </div>
            <div class="ld-tool-spacer"></div>
            <div class="ld-tool-group">
              <button class="ld-tool-btn" id="ldFullscreenBtn" title="Expanded reading mode" aria-label="Expanded reading mode" onclick="ldToggleFullscreen()">
                <span data-ngis-icon="expand"></span>
              </button>
              <button class="ld-tool-btn" id="ldOpenTabBtn" title="Open in new tab" aria-label="Open in new tab" onclick="ldOpenInNewTab()">
                <span data-ngis-icon="open"></span>
              </button>
              <button class="ld-tool-btn" id="ldToolDownloadBtn" title="Download file" aria-label="Download file" onclick="ldDownload()">
                <span data-ngis-icon="download"></span>
              </button>
            </div>
          </div>
          <div class="ld-viewer-body" id="ldViewerBody" tabindex="-1">
            <!-- Populated by lesson-details.js -->
          </div>
        </section>
      </div>

      <!-- Secondary information area -->
      <aside class="ld-info-col" id="ldInfoCol">
        <section class="ld-info-card">
          <h2 class="ld-info-title">About this material</h2>
          <p class="ld-desc" id="ldDesc"></p>
          <button class="ld-desc-toggle" id="ldDescToggle" style="display:none" onclick="ldToggleDesc()" aria-expanded="false">Show more</button>
          <ul class="ld-info-rows" id="ldInfoRows"></ul>
        </section>
        <section class="ld-info-card" id="ldRelatedCard" style="display:none">
          <h2 class="ld-info-title">Related materials</h2>
          <div class="ld-related-list" id="ldRelatedList"></div>
        </section>
      </aside>
    </div>

    <!-- Lesson navigation -->
    <nav class="ld-lesson-nav" aria-label="Lesson navigation">
      <button class="ld-nav-btn" id="ldPrevLesson" onclick="ldGoRelative(-1)">
        <span data-ngis-icon="back"></span>
        <span class="ld-nav-text"><span class="ld-nav-kicker">Previous</span><span class="ld-nav-name">Lesson</span></span>
      </button>
      <a class="ld-nav-home" id="ldNavHome" href="lessons.html">
        <span data-ngis-icon="dashboard"></span>
        <span>All Materials</span>
      </a>
      <button class="ld-nav-btn ld-nav-next" id="ldNextLesson" onclick="ldGoRelative(1)">
        <span class="ld-nav-text"><span class="ld-nav-kicker">Next</span><span class="ld-nav-name">Lesson</span></span>
        <span data-ngis-icon="chevronRight"></span>
      </button>
    </nav>

  </div><!-- /ldContent -->
</main><!-- /main -->

<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/protect.js"></script>
<script>
(function () {
  try { var _t = localStorage.getItem('ngis-theme'); if (_t) document.documentElement.setAttribute('data-theme', _t); } catch (e) {}
  var p = new URLSearchParams(window.location.search);
  var saved = window.NGISAuth ? NGISAuth.getUser() : null;
  var explicit = window.NGISAuth && NGISAuth.hasExplicitSession();
  var reqRole = (p.get('portal') || p.get('role') || '').toLowerCase();
  if (reqRole === 'super_admin') reqRole = 'superadmin';
  var role = explicit && saved && saved.role
    ? String(saved.portal || saved.role).toLowerCase()
    : (reqRole || (window.NGISAuth ? NGISAuth.getRole() : '') || localStorage.getItem('ngis_active_portal') || 'student').toLowerCase();
  if (role === 'super_admin') role = 'superadmin';
  if (role === 'editor') role = 'admin';

  window.PAGE = { role: role, active: 'lessons' };
  if (saved) window.CURRENT_USER = saved;
  document.body.classList.add('ready');

  var deptLink = (role === 'admin' || role === 'superadmin')
    ? '../admin/admin-departments.html'
    : (role === 'principal')
      ? '../principal/principal-departments.html'
      : (role === 'teacher')
        ? '../teacher/teacher-departments.html'
        : ('departments.html?portal=' + encodeURIComponent(role));

  var subjKey = (p.get('dept') || p.get('subject') || 'math').toLowerCase();
  var subjTitleMap = {
    math: 'Mathematics Library',
    physics: 'Physics Library',
    chemistry: 'Chemistry Library',
    biology: 'Biology Library',
    english: 'English Language Library',
    history: 'History Library',
    geography: 'Geography Library',
    cs: 'Computer Science Library'
  };
  var subjName = subjTitleMap[subjKey] || (subjKey.charAt(0).toUpperCase() + subjKey.slice(1) + ' Library');

  /* Compact top navigation + school branding; the large banner body is
     hidden via CSS so the document viewer stays the page's focus. */
  window.HERO_CONFIG = {
    role: role,
    title: subjName,
    greeting: 'Read the full learning material, save it for later, or download a copy.',
    breadcrumbs: [{ label: 'Departments', href: deptLink }, { label: subjName }]
  };
})();
</script>
<script src="../../assets/js/hero.js"></script>
<script src="../../assets/js/layout.js"></script>
<script src="js/lesson-data.js"></script>
<script src="js/lesson-details.js"></script>
</body>
</html>
