<!-- Strict Typography Guard & Unpainted Icon Surface Guard -->
<style>
  html, body {
    background: #F8FAFC;
    color: #29352E;
  }
  [data-theme="dark"] html, [data-theme="dark"] body {
    background: #0f172a;
    color: #f1f5f9;
  }
  .main { min-height: 100vh; }
  
  /* Strict Typography Guard: Maximum 500 weight across all elements */
  body, h1, h2, h3, h4, h5, h6, p, span, button, input, select, textarea, label {
    font-weight: 400;
  }
  .font-medium, h1, h2, h3, h4, h5, h6, th, dt, strong, b {
    font-weight: 500 !important;
  }

  /* Unpainted icon slot requirement (AGENTS.md) */
  .ngis-icon-slot, [data-ngis-icon] {
    background: transparent !important;
  }

  /* Hide category filter chips as requested */
  .cal-filter-chips {
    display: none !important;
  }

  /* Remove colored pill badge styling on calendar events */
  .cal-event-chip {
    background: transparent !important;
    color: #29352E !important;
    border-left: none !important;
    border: none !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    padding: 2px 4px !important;
  }
  .cal-event-chip:hover {
    background: #F1F5F9 !important;
  }
  .cal-agenda-pill {
    display: none !important;
  }
</style>
</head>

<body data-role="student" data-portal="student" data-page="calendar" class="bg-[#F8FAFC] text-slate-800 font-sans antialiased min-h-screen flex flex-col">
<main class="main flex-1 flex flex-col">

  <!-- Authoritative NGIS Responsive Hero Banner & Desktop Topbar -->
  <header id="heroBanner" role="banner"></header>

  <!-- Mandatory Mobile Responsive Hamburger Header (AGENTS.md Critical Rule) -->
  <div class="lg:hidden flex items-center justify-between px-4 py-3 bg-white border-b border-[#E1E9E3] text-[#29352E]">
    <div class="flex items-center gap-2">
      <button type="button" class="hamburger-btn mobile-hamburger-btn p-2 rounded-lg text-[#29352E] hover:bg-[#F8FAFC] transition active:scale-95" data-action="toggle-sidebar" aria-label="Open menu" aria-expanded="false" title="Open navigation">
        <span data-ngis-icon="menu"></span>
      </button>
      <div class="flex items-center gap-2">
        <img src="../../assets/images/logo.png" alt="NGIS" class="w-7 h-7 object-contain" onerror="this.onerror=null;this.src='../../assets/images/logo.png'">
        <span class="text-sm font-medium tracking-tight text-[#176B45]">Student Calendar</span>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <a href="student-timetable.html" class="p-2 text-[#64746A] hover:bg-[#F8FAFC] rounded-lg transition" aria-label="Class Timetable" title="Class Timetable">
        <span data-ngis-icon="calendarWeek"></span>
      </a>
      <a href="student-notifications.html" class="p-2 text-[#64746A] hover:bg-[#F8FAFC] rounded-lg transition" aria-label="Notifications">
        <span data-ngis-icon="bell"></span>
      </a>
    </div>
  </div>

  <!-- Calendar Content Workspace -->
  <div class="cal-workspace">

    <!-- Top Student Calendar Overview Bar -->
    <div class="flex items-center gap-3.5 mb-5 bg-white p-4 sm:p-5 rounded-2xl border border-[#E1E9E3] shadow-sm">
      <div class="w-11 h-11 rounded-xl flex items-center justify-center shrink-0 border border-[#E1E9E3] bg-[#F8FAFC]">
        <img src="../../assets/images/icons-3d/calendar.png" width="28" height="28" class="ngis-3d-icon" alt="Calendar" style="background:transparent!important;">
      </div>
      <div>
        <h1 class="text-base sm:text-lg font-medium text-[#29352E] tracking-tight">School Academic Calendar</h1>
      </div>
    </div>

    <!-- Mount Point for the Academic Calendar Engine -->
    <div id="academicCalendarApp"></div>

  </div><!-- /.cal-workspace -->

</main>
