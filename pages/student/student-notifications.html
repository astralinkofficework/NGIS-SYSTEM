<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NGIS — Notifications</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/hero.css">
<script>try{var _t=localStorage.getItem('ngis-theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>















<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/protect.js"></script>
<script src="_auth-bootstrap.js"></script>
</head>
<body>
<main class="main">
<div id="heroBanner"></div>
<div class="page">

  <div class="card anim-up">
    <div class="card-head">
      <div><h3>Notifications</h3><div class="sub" id="unreadLabel">Loading…</div></div>
      <button class="btn btn-ghost btn-sm" id="btnReadAll">Mark all read</button>
    </div>
    <div class="card-pad" id="list"><p class="muted">Loading…</p></div>
  </div>

</div>
</main>
<script>window.PAGE={"role":"student","active":"notifications"};</script>
<script>
window.HERO_CONFIG = {
  name: 'Student', id: 'Student', grade: 'Grade 10',
  avatar: 'https://images.pexels.com/photos/3785079/pexels-photo-3785079.jpeg?auto=compress&cs=tinysrgb&w=160',
  avatarSm: 'https://images.pexels.com/photos/3785079/pexels-photo-3785079.jpeg?auto=compress&cs=tinysrgb&w=80',
  homeLink: '../../index.html', signOutLink: '../../index.html',
  profileLink: 'student-profile.html', notifLink: 'student-notifications.html', chatLink: '../shared/chat.html',
  notifCount: 0, title: 'Notifications', greeting: 'Your inbox.',
  breadcrumbs: [{ label: 'Notifications' }], ddRows: []
};
</script>
<script src="../../assets/js/hero.js"></script>
<script src="../../assets/js/layout.js"></script>
<script>
(function () {
  function esc(s) { return String(s||'').replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>'); }

  async function load() {
    const el = document.getElementById('list');
    try {
      const res = await NGISAuth.api('/api/notifications');
      const items = res.data || [];
      const unread = res.meta?.unread ?? items.filter(n => !n.read).length;
      document.getElementById('unreadLabel').textContent = unread + ' unread';

      if (!items.length) {
        el.innerHTML = '<p class="muted">No notifications yet.</p>';
        return;
      }

      el.innerHTML = items.map(n => `
        <div class="flex gap12" style="padding:14px;border-radius:12px;margin-bottom:8px;border:1px solid var(--border);${!n.read ? 'background:var(--primary-soft)' : ''}">
          <div style="flex:1">
            <b style="font-size:13px">${esc(n.title)}</b>
            <p style="font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5">${esc(n.message)}</p>
            <div class="faint" style="font-size:11px;margin-top:4px">${esc(n.type)} · ${(n.created_at||'').slice(0,16).replace('T',' ')}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
            ${!n.read ? '<div style="width:8px;height:8px;border-radius:50%;background:var(--primary)"></div>' : ''}
            ${!n.read ? `<button class="btn btn-sm btn-ghost" data-read="${n.id}">Mark read</button>` : ''}
          </div>
        </div>`).join('');

      el.querySelectorAll('[data-read]').forEach(btn => {
        btn.addEventListener('click', async () => {
          try {
            await NGISAuth.api('/api/notifications/' + btn.dataset.read + '/read', { method: 'POST' });
            load();
          } catch (err) { alert(err.message); }
        });
      });
    } catch (err) {
      el.innerHTML = `<p style="color:#b91c1c">${esc(err.message)}</p>`;
    }
  }

  document.getElementById('btnReadAll').addEventListener('click', async () => {
    try {
      await NGISAuth.api('/api/notifications/read-all', { method: 'POST' });
      load();
    } catch (err) { alert(err.message); }
  });

  setTimeout(load, 200);
})();
</script>
</body>
</html>
