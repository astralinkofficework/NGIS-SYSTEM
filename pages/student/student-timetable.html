<script>
(function () {
  // Mock tracker dates
  const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  
  function updateTicker() {
    const ticker = document.getElementById('tickerText');
    const now = new Date();
    const dayName = days[now.getDay()];
    
    // Simulate schedule matches
    if (dayName === "Saturday" || dayName === "Sunday") {
      ticker.textContent = "Current Period: Free Study Period (Weekend). Stay rested!";
    } else {
      ticker.textContent = "Current: English Lit (10:20 - 12:00) • Ms. Rin (Rm 108). Next: Lunch Repast (12:00).";
    }
  }

  // Client-Side Offline ICS Export (RFC 5545)
  window.exportICSFile = function() {
    let icsContent = 
      "BEGIN:VCALENDAR\n" +
      "VERSION:2.0\n" +
      "PRODID:-//NGIS School//ERP Calendar//EN\n" +
      "CALSCALE:GREGORIAN\n" +
      "METHOD:PUBLISH\n" +
      "BEGIN:VEVENT\n" +
      "UID:ngis-math-10a@school.com\n" +
      "DTSTAMP:20260706T120000Z\n" +
      "DTSTART:20260706T080000\n" +
      "DTEND:20260706T100000\n" +
      "SUMMARY:Advanced Mathematics\n" +
      "DESCRIPTION:Adviser: Dr. Sarah Jenkins. Class 10A.\n" +
      "LOCATION:Room 302\n" +
      "END:VEVENT\n" +
      "BEGIN:VEVENT\n" +
      "UID:ngis-physics-10a@school.com\n" +
      "DTSTAMP:20260706T120000Z\n" +
      "DTSTART:20260706T102000\n" +
      "DTEND:20260706T120000\n" +
      "SUMMARY:Physics Mechanics\n" +
      "DESCRIPTION:Adviser: Dr. Pov. Lab 04.\n" +
      "LOCATION:Physics Lab 4\n" +
      "END:VEVENT\n" +
      "END:VCALENDAR";

    var blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'NGIS_Class10A_Timetable.ics';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    window.toast('ICS Calendar Exported!', 'success');
  };

  window.openClassDetail = function(subject, teacher, location, syllabus) {
    window.toast(`${subject} Detail: ${teacher} | Location: ${location} | ${syllabus}`, 'info');
  };

  updateTicker();
  setInterval(updateTicker, 60000);

})();
</script>
