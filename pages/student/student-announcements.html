<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NGIS — Announcements (redirecting…)</title>
<!-- Legacy student announcements page. The Announcements module was
     consolidated into ONE shared page + ONE backend feed (/api/news) used by
     every portal. This file only preserves old links/bookmarks: it forwards
     the visitor to the shared reader in the Student portal context. The
     ?portal hint selects UI context only — permissions always come from the
     authenticated session and the backend. -->
<link rel="canonical" href="../shared/announcements.html?portal=student"/>
<meta http-equiv="refresh" content="0; url=../shared/announcements.html?portal=student"/>
<script>
(function () {
  /* Preserve any deep-link parameters except portal/role, which this redirect
     owns. Never widen permissions: the shared page derives them from session. */
  try {
    var p = new URLSearchParams(window.location.search || '');
    p.delete('portal'); p.delete('role');
    var qs = p.toString();
    window.location.replace('../shared/announcements.html?portal=student' + (qs ? '&' + qs : ''));
  } catch (e) {
    window.location.replace('../shared/announcements.html?portal=student');
  }
})();
</script>
</head>
<body style="font-family:system-ui,sans-serif;background:#f7f9f7;color:#176B45;display:grid;place-items:center;min-height:100vh;margin:0">
<noscript><p>Redirecting to <a href="../shared/announcements.html?portal=student">Announcements</a>…</p></noscript>
<p>Opening Announcements…</p>
</body>
</html>
