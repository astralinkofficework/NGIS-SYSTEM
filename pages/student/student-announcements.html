<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NGIS — Announcements</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/hero.css">
<script>try{var _t=localStorage.getItem('ngis-theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>















<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/protect.js"></script>
<script src="_auth-bootstrap.js"></script>
</head>
<body>
<main class="main">
<div id="heroBanner"></div>
<div class="page">
  <div class="card anim-up">
    <div class="card-head"><div><h3>Announcements</h3><div class="sub">From school and your teachers</div></div></div>
    <div class="card-pad" id="feed"><p class="muted">Loading…</p></div>
  </div>
</div>
</main>
<script>window.PAGE={"role":"student","active":"announcements"};</script>
<script>
window.HERO_CONFIG = {
  name: 'Student', id: 'Student', grade: 'Grade 10',
  avatar: 'https://images.pexels.com/photos/3785079/pexels-photo-3785079.jpeg?auto=compress&cs=tinysrgb&w=160',
  avatarSm: 'https://images.pexels.com/photos/3785079/pexels-photo-3785079.jpeg?auto=compress&cs=tinysrgb&w=80',
  homeLink: '../../index.html', signOutLink: '../../index.html',
  profileLink: 'student-profile.html', notifLink: 'student-notifications.html', chatLink: '../shared/chat.html',
  notifCount: 0, title: 'Announcements', greeting: 'School notices for you.',
  breadcrumbs: [{ label: 'Announcements' }], ddRows: []
};
</script>
<script src="../../assets/js/hero.js"></script>
<script src="../../assets/js/layout.js"></script>
<script>
(function () {
  function esc(s) { return String(s||'').replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>'); }
  function priorityBadge(p) {
    if (p === 'urgent') return '<span class="badge red">Urgent</span>';
    if (p === 'high') return '<span class="badge amber">High</span>';
    return '<span class="badge blue">Info</span>';
  }
  async function load() {
    const el = document.getElementById('feed');
    try {
      const res = await NGISAuth.api('/api/announcements');
      const items = res.data || [];
      if (!items.length) { el.innerHTML = '<p class="muted">No announcements yet.</p>'; return; }
      el.innerHTML = items.map(a => `
        <div style="padding:16px;border:1px solid var(--border);border-radius:12px;margin-bottom:12px;${a.pinned ? 'border-color:var(--accent);background:var(--accent-soft)' : ''}">
          <div class="flex between center mb8">
            <div>
              <b>${esc(a.title)}</b>
              <div class="faint" style="font-size:11px">${esc(a.author_name || 'School')} · ${esc((a.created_at || '').slice(0,10))} · ${esc(a.audience)}</div>
            </div>
            <div class="flex gap8 center">${a.pinned ? '<span class="badge green">Pinned</span>' : ''}${priorityBadge(a.priority)}</div>
          </div>
          <p style="font-size:13.5px;line-height:1.65;color:var(--muted);margin:0">${esc(a.body)}</p>
        </div>`).join('');
    } catch (err) {
      el.innerHTML = `<p style="color:#b91c1c">${esc(err.message)}</p>`;
    }
  }
  setTimeout(load, 200);
})();
</script>
</body>
</html>
