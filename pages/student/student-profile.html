<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NGIS — My Profile</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/hero.css">
<script>try{var _t=localStorage.getItem('ngis-theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/protect.js"></script>
<script src="_auth-bootstrap.js"></script>
</head>
<body>
<main class="main">
<div id="heroBanner"></div>
<div class="page">

  <div class="col-main mt4 anim-up">
    <div style="flex:0 0 260px">
      <div class="card card-pad" style="text-align:center">
        <div id="avatarLetter" style="width:96px;height:96px;border-radius:50%;background:var(--primary);display:grid;place-items:center;margin:0 auto 16px;font-size:32px;font-weight:900;color:#fff">—</div>
        <h3 style="font-size:18px" id="displayName">Loading…</h3>
        <p class="muted" style="font-size:13px;margin-top:4px" id="displayGrade">—</p>
        <span class="badge blue" style="margin-top:8px">Active Student</span>
        <div style="margin-top:20px;padding:14px;background:var(--surface-2);border-radius:12px;text-align:left">
          <div style="font-size:12px;color:var(--muted);margin-bottom:8px" id="infoId">ID: —</div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:8px" id="infoEmail">Email: —</div>
          <div style="font-size:12px;color:var(--muted);margin-bottom:8px" id="infoClass">Class: —</div>
          <div style="font-size:12px;color:var(--muted)" id="infoGpa">GPA: —</div>
        </div>
      </div>
    </div>

    <div class="stack" style="flex:1">
      <div class="card">
        <div class="card-head"><h3>Account</h3></div>
        <div class="card-pad" style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <div><label class="label">First Name</label><input class="input" id="firstName" readonly></div>
          <div><label class="label">Last Name</label><input class="input" id="lastName" readonly></div>
          <div><label class="label">Email</label><input class="input" id="email" readonly></div>
          <div><label class="label">Phone</label><input class="input" id="phone" readonly></div>
          <div><label class="label">Student Number</label><input class="input" id="studentNumber" readonly></div>
          <div><label class="label">Grade</label><input class="input" id="grade" readonly></div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h3>Security — Change Password</h3></div>
        <div class="card-pad">
          <form id="pwForm" style="display:grid;gap:14px">
            <div class="flex gap12 wrap">
              <div style="flex:1;min-width:160px">
                <label class="label">Current Password</label>
                <input class="input" type="password" name="currentPassword" required placeholder="Current password" style="width:100%">
              </div>
              <div style="flex:1;min-width:160px">
                <label class="label">New Password</label>
                <input class="input" type="password" name="newPassword" required minlength="8" placeholder="Min 8 characters" style="width:100%">
              </div>
            </div>
            <div class="flex between center">
              <span id="pwMsg" class="muted" style="font-size:13px"></span>
              <button type="submit" class="btn btn-primary">
                <span class="material-symbols-outlined">lock_reset</span> Update Password
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

</div>
</main>
<script>window.PAGE={"role":"student","active":"profile"};</script>
<script>
window.HERO_CONFIG = {
  name: 'Student', id: 'Student', grade: 'Grade 10',
  avatar: 'https://images.pexels.com/photos/3785079/pexels-photo-3785079.jpeg?auto=compress&cs=tinysrgb&w=160',
  avatarSm: 'https://images.pexels.com/photos/3785079/pexels-photo-3785079.jpeg?auto=compress&cs=tinysrgb&w=80',
  homeLink: '../../index.html', signOutLink: '../../index.html',
  profileLink: 'student-profile.html', notifLink: 'student-notifications.html', chatLink: '../shared/chat.html',
  notifCount: 0, title: 'My Profile', greeting: 'Account settings.',
  breadcrumbs: [{ label: 'My Profile' }], ddRows: []
};
</script>
<script src="../../assets/js/hero.js"></script>
<script src="../../assets/js/layout.js"></script>
<script>
(function () {
  function set(id, val) { const el = document.getElementById(id); if (el) el.value = val || ''; }
  function text(id, val) { const el = document.getElementById(id); if (el) el.textContent = val || '—'; }

  async function loadProfile() {
    try {
      const res = await NGISAuth.api('/api/auth/me');
      const u = res.data || {};
      const s = u.student || {};
      const first = u.firstName || u.first_name || '';
      const last = u.lastName || u.last_name || '';

      text('displayName', (first + ' ' + last).trim() || 'Student');
      text('displayGrade', s.grade || '—');
      text('infoId', 'ID: ' + (s.student_number || '—'));
      text('infoEmail', 'Email: ' + (u.email || '—'));
      text('infoClass', 'Class: ' + (s.class_id || '—'));
      text('infoGpa', 'GPA: ' + (s.gpa != null ? Number(s.gpa).toFixed(2) : '—'));
      document.getElementById('avatarLetter').textContent = ((first[0] || '') + (last[0] || '')).toUpperCase() || '?';

      set('firstName', first);
      set('lastName', last);
      set('email', u.email);
      set('phone', u.phone);
      set('studentNumber', s.student_number);
      set('grade', s.grade);
    } catch (err) {
      text('displayName', 'Error loading profile');
    }
  }

  document.getElementById('pwForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const msg = document.getElementById('pwMsg');
    msg.textContent = 'Updating…';
    try {
      await NGISAuth.api('/api/auth/change-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          currentPassword: fd.get('currentPassword'),
          newPassword: fd.get('newPassword'),
        }),
      });
      msg.textContent = 'Password updated successfully.';
      e.target.reset();
    } catch (err) {
      msg.textContent = err.message || 'Failed to update password';
    }
  });

  setTimeout(loadProfile, 200);
})();
</script>
</body>
</html>
