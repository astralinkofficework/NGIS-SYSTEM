<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>NGIS — Grades</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/hero.css">
<script>try{var _t=localStorage.getItem('ngis-theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/protect.js"></script>
<script src="_auth-bootstrap.js"></script>
</head>
<body data-page="grades">
<main class="main">
<div id="heroBanner"></div>

  <div class="page">

    <div class="grid g-3 anim-up" style="margin-bottom:16px">
      <div class="stat">
        <div class="stat-top"><div class="stat-ico t-blue"><span class="material-symbols-outlined fill">grade</span></div></div>
        <div class="stat-val" id="statCount">—</div>
        <div class="stat-label">Assessments</div>
      </div>
      <div class="stat">
        <div class="stat-top"><div class="stat-ico t-green"><span class="material-symbols-outlined fill">trending_up</span></div></div>
        <div class="stat-val" id="statAvg">—</div>
        <div class="stat-label">Average %</div>
      </div>
      <div class="stat">
        <div class="stat-top"><div class="stat-ico t-amber"><span class="material-symbols-outlined fill">emoji_events</span></div></div>
        <div class="stat-val" id="statGpa">—</div>
        <div class="stat-label">GPA</div>
      </div>
    </div>

    <div class="card anim-up-2">
      <div class="card-head">
        <div><h3>Grade Book</h3><div class="sub">Scores recorded by your teachers</div></div>
      </div>
      <div class="card-pad" id="gradesList">
        <p class="muted">Loading grades…</p>
      </div>
    </div>

  </div>
</main>

<script>window.PAGE = { role: 'student', active: 'grades' };</script>
<script>
window.HERO_CONFIG = {
  name: 'Student',
  id: 'Student',
  grade: 'Grade 10',
  avatar: 'https://images.pexels.com/photos/3785079/pexels-photo-3785079.jpeg?auto=compress&cs=tinysrgb&w=160',
  avatarSm: 'https://images.pexels.com/photos/3785079/pexels-photo-3785079.jpeg?auto=compress&cs=tinysrgb&w=80',
  homeLink: '../../index.html',
  signOutLink: '../../index.html',
  profileLink: 'student-profile.html',
  notifLink: 'student-notifications.html',
  chatLink: '../shared/chat.html',
  notifCount: 0,
  title: 'Grades',
  greeting: 'Your assessment scores from the connected gradebook.',
  breadcrumbs: [{ label: 'Grades' }],
  ddRows: []
};
</script>
<script src="../../assets/js/hero.js"></script>
<script src="../../assets/js/layout.js"></script>
<script>
(function () {
  function esc(s) {
    return String(s || '').replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>');
  }

  async function load() {
    const el = document.getElementById('gradesList');
    try {
      if (!window.NGISAuth || !NGISAuth.isAuthenticated()) {
        el.innerHTML = '<p style="color:#b91c1c">Please sign in.</p>';
        return;
      }

      const [gradesRes, meRes] = await Promise.all([
        NGISAuth.api('/api/grades'),
        NGISAuth.api('/api/students/me').catch(() => null),
      ]);

      const grades = gradesRes.data || [];
      document.getElementById('statCount').textContent = grades.length;

      if (grades.length) {
        const avg = grades.reduce((s, g) => s + (Number(g.percentage) || 0), 0) / grades.length;
        document.getElementById('statAvg').textContent = avg.toFixed(1) + '%';
      } else {
        document.getElementById('statAvg').textContent = '—';
      }

      if (meRes && meRes.data) {
        const gpa = meRes.data.student?.gpa ?? meRes.data.gpa;
        if (gpa != null) document.getElementById('statGpa').textContent = Number(gpa).toFixed(2);
      }

      if (!grades.length) {
        el.innerHTML = '<p class="muted">No grades recorded yet.</p>';
        return;
      }

      el.innerHTML = `
        <div class="tbl-wrap">
          <table class="tbl">
            <thead>
              <tr>
                <th>Assessment</th>
                <th>Subject</th>
                <th>Type</th>
                <th>Score</th>
                <th>Letter</th>
                <th>Comments</th>
              </tr>
            </thead>
            <tbody>
              ${grades.map(g => `
                <tr>
                  <td><b>${esc(g.assessment_title)}</b></td>
                  <td>${esc(g.subject_name || g.subject_id)}</td>
                  <td><span class="badge blue">${esc(g.assessment_type || 'exam')}</span></td>
                  <td class="num">${g.score}/${g.max_score} <span class="faint">(${Number(g.percentage).toFixed(0)}%)</span></td>
                  <td><span class="badge green">${esc(g.letter_grade || '—')}</span></td>
                  <td class="faint" style="font-size:12px">${esc(g.comments || '')}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    } catch (err) {
      el.innerHTML = `<p style="color:#b91c1c">${esc(err.message)}</p>`;
    }
  }

  setTimeout(load, 200);
})();
</script>
</body>
</html>
