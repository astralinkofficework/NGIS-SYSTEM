<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<title>NGIS — Assignments</title>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Kantumruy+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/hero.css">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        forest: {900:"#01281a",800:"#013623",700:"#1e4d38",600:"#006c49",100:"#e2ede6",50:"#f0f6f2"},
        surface: {card:"#ffffff",page:"#f8fafb",subtle:"#f2f5f4",border:"#dce4df",borderLight:"#e9f0ec"},
        ink: {main:"#111b15",muted:"#4e5d54",soft:"#7d8d83"}
      },
      fontFamily: {sans:['"Inter"','sans-serif'],display:['"Inter"','sans-serif'],khmer:['"Kantumruy Pro"','sans-serif']}
    }
  }
};
</script>
<style>
html,body{background-color:#f8fafb;color:#111b15;font-family:'Inter',sans-serif!important;-webkit-font-smoothing:antialiased}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle}
.main{min-height:100vh;display:flex;flex-direction:column}
.page{max-width:1440px;width:100%;margin:0 auto;padding:24px 20px 64px}
@media(min-width:640px){.page{padding:28px 28px 64px}}
@media(min-width:1024px){.page{padding:32px 36px 72px}}
*,h1,h2,h3,h4,h5,h6,b,strong,th{font-weight:400!important}
</style>
<link rel="stylesheet" href="../../assets/css/interactions.css">
</head>
<body data-page="assignments" class="font-sans selection:bg-forest-100 selection:text-forest-800">
<main class="main">
  <div id="heroBanner"></div>
  <div class="page space-y-7">
    <!-- Metric cards and filter strip removed -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-7 items-start">
      <div class="lg:col-span-7 space-y-4">
        <div class="flex items-center justify-between pb-1">
          <div class="flex items-center gap-2.5">
            <h2 class="text-xl font-normal font-display text-forest-800 tracking-tight">Active &amp; Pending Tasks</h2>
            <span class="px-2.5 py-0.5 rounded-full text-[11px] font-normal bg-forest-100 text-forest-800 border border-forest-200">4 Due</span>
          </div>
          <span class="text-xs text-ink-soft font-medium">Showing all active coursework</span>
        </div>
        <div class="space-y-4" id="tasksList">
          <p class="text-sm text-ink-muted">Task cards load here. Full content is in the downloaded file — this push was truncated by tool limits. Please use the artifact file to push the complete version.</p>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="../../assets/js/hero.js"></script>
<script src="../../assets/js/layout.js"></script>
</body>
</html>
