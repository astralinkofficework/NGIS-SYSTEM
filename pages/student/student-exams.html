<!doctype html>
<html lang="en" data-theme="light" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NGIS — My Examination Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Khmer:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="../../assets/css/app.css?v=3.2">
  <link rel="stylesheet" href="../../assets/css/hero.css">
  <link rel="stylesheet" href="../../assets/css/interactions.css">
  <link rel="stylesheet" href="../../assets/css/design-system.css">
  <link rel="stylesheet" href="../../assets/css/action-icons.css?v=1.13.2">
  <link rel="stylesheet" href="../../assets/css/ui-cleanup.css">
  <link rel="stylesheet" href="../../assets/css/exams-simple.css?v=1.2">
  <script src="../../assets/js/action-icons.js?v=1.13.2" defer></script>
  <script>try{document.documentElement.setAttribute('data-theme','light');localStorage.setItem('ngis-theme','light');}catch(e){}</script>
</head>
<body data-role="student" data-portal="student" class="min-h-screen bg-[#F7F9F7] font-sans text-slate-800 antialiased flex flex-col">
  <main class="main flex-1 min-w-0 flex flex-col">
    <header id="heroBanner" role="banner"></header>
    <header id="mobileMainAppbar" class="lg:hidden bg-transparent border-none px-4 py-3 flex items-center justify-between sticky top-0 z-30 no-print">
      <div class="flex items-center gap-3 min-w-0">
        <button type="button" class="hamburger-btn mobile-hamburger-btn p-1.5 -ml-1 text-slate-700 hover:bg-slate-100 rounded-lg active:scale-95 transition flex items-center justify-center min-w-[38px] min-h-[38px]" data-action="toggle-sidebar" aria-label="Open menu" aria-expanded="false">
          <span data-ngis-icon="menu"></span>
        </button>
        <div class="min-w-0 truncate"><h1 class="text-sm font-medium text-slate-900 leading-tight truncate">My Examination Schedule</h1></div>
      </div>
      <div class="flex items-center gap-2 flex-shrink-0">
        <span class="px-2.5 py-0.5 rounded-full bg-emerald-50 border border-emerald-200 text-[11px] font-medium text-[#0F5132]">Student</span>
      </div>
    </header>
    <div id="examsWorkspace"></div>
  </main>

  <script>
    (function () {
      var p = new URLSearchParams(window.location.search);
      var req = (p.get('portal') || p.get('role') || 'student').toLowerCase();
      if (req === 'editor') req = 'admin';
      window.PAGE = { role: req, active: 'exams' };
      var dept = (p.get('dept') || '').toLowerCase();
      var deptTitles = {
        english: 'English Literature', math: 'Mathematics', maths: 'Mathematics',
        science: 'Science', physics: 'Physics', khmer: 'Khmer Literature',
        chinese: 'Chinese Language', history: 'World History', art: 'Fine Arts', ict: 'ICT'
      };
      var deptName = deptTitles[dept] || (dept ? dept.charAt(0).toUpperCase() + dept.slice(1) : '');
      var label = deptName ? deptName + ' ' : '';
      window.HERO_CONFIG = {
        role: req,
        title: (label || 'My ') + 'Examination Schedule',
        greeting: deptName
          ? 'Published ' + deptName + ' examinations for your enrolled classes only.'
          : 'Your published examination calendar — subject, date and time only.',
        name: 'Nrinphouneta Hok',
        id: 'Student ID: 2026-STD-0142',
        grade: 'Grade 10',
        avatar: 'https://images.pexels.com/photos/3785079/pexels-photo-3785079.jpeg?auto=compress&cs=tinysrgb&w=160',
        avatarSm: 'https://images.pexels.com/photos/3785079/pexels-photo-3785079.jpeg?auto=compress&cs=tinysrgb&w=80',
        breadcrumbs: deptName
          ? [{ label: 'Academic Departments', href: 'department.html?dept=' + encodeURIComponent(dept) + '&portal=' + encodeURIComponent(req) }, { label: deptName + ' Examinations' }]
          : [{ label: 'Examinations' }],
        homeLink: '../../index.html',
        signOutLink: '../../index.html',
        profileLink: 'student-settings.html'
      };
      document.title = 'NGIS — ' + (label || 'My ') + 'Examination Schedule';
    })();
  </script>
  <script src="../../assets/js/hero.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="../../assets/js/exams-simple.js?v=1.3"></script>
</body>
</html>
