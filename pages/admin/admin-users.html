<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to User Management...</title>
  <script>
    (function() {
      var p = new URLSearchParams(window.location.search);
      var role = (p.get('role') || 'students').toLowerCase();
      var target = 'admin-users-students.html';
      if (role.indexOf('teach') !== -1) target = 'admin-users-teachers.html';
      else if (role.indexOf('princ') !== -1) target = 'admin-users-principals.html';
      else if (role.indexOf('admin') !== -1) target = 'admin-users-admins.html';
      else if (role.indexOf('staff') !== -1) target = 'admin-users-staff.html';
      window.location.replace(target + (window.location.search || ''));
    })();
  </script>
</head>
<body style="font-family:sans-serif;padding:24px;color:#475569;">
  <p>Redirecting to User Accounts...</p>
</body>
</html>
