  document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('btnAdminReviewSubjectReq');
    if (btn) {
      btn.addEventListener('click', function () {
        AcademicRequests.openAdminReviewDrawer('AR-2026-0103');
      });
    }

    var urlParams = new URLSearchParams(window.location.search);
    var reqId = urlParams.get('req');
    if (reqId) {
      AcademicRequests.init().then(function () {
        AcademicRequests.openAdminReviewDrawer(reqId);
      });
    }
  });
