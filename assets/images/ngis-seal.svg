<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="crestBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0d5f47" />
      <stop offset="70%" stop-color="#064232" />
      <stop offset="100%" stop-color="#03261c" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fef9c3" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Ring with Gold Border -->
  <circle cx="50" cy="50" r="47.5" fill="url(#crestBg)" stroke="url(#goldGrad)" stroke-width="2.2" />
  <!-- Dotted Inner Border -->
  <circle cx="50" cy="50" r="43.5" fill="none" stroke="#facc15" stroke-width="1.2" stroke-dasharray="2.5 2" opacity="0.85" />
  <!-- Inner Rim -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6" />

  <!-- Laurel Wreath (Left) -->
  <g fill="url(#goldGrad)" opacity="0.95">
    <path d="M 23 48 C 21 44 24 38 27 35 C 27 38 25 43 23 48 Z" />
    <path d="M 21 56 C 18 52 20 46 24 43 C 24 46 22 51 21 56 Z" />
    <path d="M 24 64 C 20 61 21 55 25 52 C 26 55 24 60 24 64 Z" />
    <path d="M 30 71 C 26 69 26 63 29 60 C 31 63 30 68 30 71 Z" />
    <path d="M 38 76 C 34 75 33 70 36 67 C 38 70 38 74 38 76 Z" />
    <!-- Laurel Wreath (Right) -->
    <path d="M 77 48 C 79 44 76 38 73 35 C 73 38 75 43 77 48 Z" />
    <path d="M 79 56 C 82 52 80 46 76 43 C 76 46 78 51 79 56 Z" />
    <path d="M 76 64 C 80 61 79 55 75 52 C 74 55 76 60 76 64 Z" />
    <path d="M 70 71 C 74 69 74 63 71 60 C 69 63 70 68 70 71 Z" />
    <path d="M 62 76 C 66 75 67 70 64 67 C 62 70 62 74 62 76 Z" />
  </g>

  <!-- Stars at Bottom -->
  <polygon points="50,78 51.5,82 56,82 52.5,84.5 54,88.5 50,86 46,88.5 47.5,84.5 44,82 48.5,82" fill="url(#goldGrad)" />
  <polygon points="42,76 43,79 46,79 43.5,81 44.5,84 42,82 39.5,84 40.5,81 38,79 41,79" fill="url(#goldGrad)" opacity="0.8" />
  <polygon points="58,76 59,79 62,79 59.5,81 60.5,84 58,82 55.5,84 56.5,81 54,79 57,79" fill="url(#goldGrad)" opacity="0.8" />

  <!-- School Crest: Open Book & Sun / Torch in Center -->
  <g filter="url(#softGlow)">
    <!-- Sunburst behind book -->
    <circle cx="50" cy="51" r="14" fill="#0b7053" opacity="0.5" />
    <!-- Book Spine & Pages -->
    <path d="M 50 56 L 50 64 M 50 64 C 44 61 38 61 33 63 L 33 55 C 38 53 44 53 50 56 C 56 53 62 53 67 55 L 67 63 C 62 61 56 61 50 64 Z" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="1" />
    <!-- Book page lines -->
    <line x1="37" y1="56" x2="46" y2="58" stroke="#ca8a04" stroke-width="0.7" opacity="0.6" />
    <line x1="37" y1="58.5" x2="46" y2="60.5" stroke="#ca8a04" stroke-width="0.7" opacity="0.6" />
    <line x1="54" y1="58" x2="63" y2="56" stroke="#ca8a04" stroke-width="0.7" opacity="0.6" />
    <line x1="54" y1="60.5" x2="63" y2="58.5" stroke="#ca8a04" stroke-width="0.7" opacity="0.6" />
  </g>

  <!-- NGIS Acronym across top/middle -->
  <text x="50" y="44" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="15" fill="url(#goldText)" letter-spacing="1.2" filter="url(#softGlow)">NGIS</text>
  <text x="50" y="27" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="6.5" fill="#fef08a" letter-spacing="0.8" opacity="0.95">EST. 2010</text>
</svg>
