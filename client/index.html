<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="description" content="NGIS — School Operating System. Calm, fast, secure school management for five roles.">
  <title>NGIS · School Operating System</title>

  <!-- Prevent theme flash before JS runs -->
  <script>
    (function () {
      var t = localStorage.getItem('ngis-theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>

</body>
</html>
